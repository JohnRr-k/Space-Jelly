<style>
/* ═══════════════════════════════════════════════════════════════════════
   LEGACY · DESIGN SYSTEM
   Tokens first. Components consume tokens only — never raw values, never
   colour inside a media query. Themes are swapped by redefining tokens.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* ── ground & ink ───────────────────────────────────────────────── */
  --paper:        #F7F6F3;   /* page ground — cool-biased, not cream    */
  --paper-sunk:   #F1EFEA;   /* recessed wells, inputs                  */
  --paper-raised: #FFFFFF;   /* lifted surfaces: sheets, overlays       */
  --ink:          #191713;   /* warm black — primary text               */
  --ink-2:        #4A453D;   /* secondary prose                         */
  --ink-3:        #6B6459;   /* metadata, captions                      */
  --ink-4:        #9C948A;   /* the quietest legible tone               */
  --rule:         #DEDAD2;   /* hairline rules                          */
  --rule-strong:  #C6C0B5;

  /* ── brass · the single accent, used as line not fill ────────────── */
  --brass:        #8A6E3E;
  --brass-soft:   #B99B62;
  --brass-wash:   #EFE7D7;

  /* ── semantic, held apart from the accent ────────────────────────── */
  --good:         #4F7A52;
  --warn:         #97742C;
  --risk:         #9B4A45;

  /* ── type ────────────────────────────────────────────────────────── */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
           "Hoefler Text", "Times New Roman", Georgia, serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
           "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono",
           "Roboto Mono", Menlo, Consolas, monospace;

  --t-xs:  0.6875rem;  /* 11 — apparatus                */
  --t-sm:  0.8125rem;  /* 13 — captions, chips          */
  --t-ui:  0.875rem;   /* 14 — interface                */
  --t-bd:  1.0625rem;  /* 17 — body prose               */
  --t-lg:  1.375rem;   /* 22 — lead                     */
  --t-xl:  2rem;       /* 32 — section title            */
  --t-2xl: 2.875rem;   /* 46 — page title               */
  --t-3xl: 4.25rem;    /* 68 — display                  */

  /* ── metrics ─────────────────────────────────────────────────────── */
  --spine-w: 232px;
  --measure: 34rem;         /* ~65 characters of body prose */
  --pad-x: clamp(1.25rem, 4vw, 4.5rem);
  --radius: 3px;            /* paper is cut, not rounded */
  --ease: cubic-bezier(.22, .61, .36, 1);
  --slow: 520ms;
  --med:  260ms;
  --fast: 140ms;
  --shadow-sheet: 0 1px 2px rgba(25,23,19,.05), 0 24px 64px -24px rgba(25,23,19,.28);
  --grain: .035;
}

/* ── Nocturne · the archive at night ───────────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root {
    --paper:        #121110;
    --paper-sunk:   #191816;
    --paper-raised: #1C1B18;
    --ink:          #EDEAE3;
    --ink-2:        #BBB4A8;
    --ink-3:        #8E877B;
    --ink-4:        #6A645A;
    --rule:         #2A2825;
    --rule-strong:  #3B3833;
    --brass:        #C4A76A;
    --brass-soft:   #8E7845;
    --brass-wash:   #26221A;
    --good:         #7FA982;
    --warn:         #C4A05A;
    --risk:         #C97F79;
    --shadow-sheet: 0 1px 2px rgba(0,0,0,.4), 0 28px 70px -24px rgba(0,0,0,.7);
    --grain: .05;
  }
}
:root[data-theme="dark"] {
  --paper:        #121110;
  --paper-sunk:   #191816;
  --paper-raised: #1C1B18;
  --ink:          #EDEAE3;
  --ink-2:        #BBB4A8;
  --ink-3:        #8E877B;
  --ink-4:        #6A645A;
  --rule:         #2A2825;
  --rule-strong:  #3B3833;
  --brass:        #C4A76A;
  --brass-soft:   #8E7845;
  --brass-wash:   #26221A;
  --good:         #7FA982;
  --warn:         #C4A05A;
  --risk:         #C97F79;
  --shadow-sheet: 0 1px 2px rgba(0,0,0,.4), 0 28px 70px -24px rgba(0,0,0,.7);
  --grain: .05;
}
:root[data-theme="light"] {
  --paper:        #F7F6F3;
  --paper-sunk:   #F1EFEA;
  --paper-raised: #FFFFFF;
  --ink:          #191713;
  --ink-2:        #4A453D;
  --ink-3:        #6B6459;
  --ink-4:        #9C948A;
  --rule:         #DEDAD2;
  --rule-strong:  #C6C0B5;
  --brass:        #8A6E3E;
  --brass-soft:   #B99B62;
  --brass-wash:   #EFE7D7;
  --good:         #4F7A52;
  --warn:         #97742C;
  --risk:         #9B4A45;
  --shadow-sheet: 0 1px 2px rgba(25,23,19,.05), 0 24px 64px -24px rgba(25,23,19,.28);
  --grain: .035;
}

/* ═══ reset ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-ui);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;                 /* the shell scrolls, not the page */
}
h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
img, canvas { display: block; max-width: 100%; }
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 3px;
  border-radius: 1px;
}
::selection { background: var(--brass-wash); color: var(--ink); }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--rule-strong); border-radius: 9px;
  border: 3px solid var(--paper); background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: padding-box; border: 3px solid var(--paper); }

/* ═══ typographic primitives ═════════════════════════════════════════ */
.display, .title, .h-sec, .lead, .prose, .serif { font-family: var(--serif); }

.display {
  font-size: clamp(2.5rem, 6vw, var(--t-3xl));
  line-height: 1.02; letter-spacing: -.024em; font-weight: 400;
  text-wrap: balance;
}
.title {
  font-size: clamp(1.9rem, 4vw, var(--t-2xl));
  line-height: 1.08; letter-spacing: -.019em; font-weight: 400;
  text-wrap: balance;
}
.h-sec {
  font-size: var(--t-xl); line-height: 1.15;
  letter-spacing: -.014em; font-weight: 400; text-wrap: balance;
}
.lead {
  font-size: var(--t-lg); line-height: 1.5;
  color: var(--ink-2); letter-spacing: -.006em; text-wrap: pretty;
}
.prose {
  font-size: var(--t-bd); line-height: 1.68;
  color: var(--ink-2); max-width: var(--measure); text-wrap: pretty;
}
.prose p + p { margin-top: 1.05em; }
.prose em { color: var(--ink); }

/* the apparatus: everything the archive knows *about* a record */
.meta {
  font-family: var(--mono); font-size: var(--t-xs);
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.meta-lg { font-family: var(--mono); font-size: var(--t-sm); letter-spacing: .04em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dim { color: var(--ink-3); }
.dimmer { color: var(--ink-4); }
.brass { color: var(--brass); }

/* ═══ shell ══════════════════════════════════════════════════════════ */
#app { display: flex; height: 100dvh; overflow: hidden; }

.spine {
  width: var(--spine-w); flex: none;
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  background: var(--paper);
  z-index: 40;
}
.spine__head { padding: 22px 20px 16px; }
.wordmark {
  display: flex; align-items: baseline; gap: 9px;
  font-family: var(--serif); font-size: 1.0625rem;
  letter-spacing: .26em; text-transform: uppercase; color: var(--ink);
}
.wordmark small {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  color: var(--ink-4); text-transform: none; letter-spacing: .06em;
}
.spine__scroll { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.nav-group { padding: 10px 0 4px; }
.nav-group__label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-4);
  padding: 0 10px 8px; display: block;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 7px 10px; border-radius: var(--radius);
  color: var(--ink-2); text-align: left;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  position: relative;
}
.nav-item:hover { background: var(--paper-sunk); color: var(--ink); }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--paper-sunk); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -10px; top: 50%;
  width: 2px; height: 15px; margin-top: -7.5px; background: var(--brass);
}
.nav-item__ico { width: 15px; height: 15px; flex: none; color: var(--ink-3); }
.nav-item[aria-current="page"] .nav-item__ico { color: var(--brass); }
.nav-item__txt { flex: 1; font-size: var(--t-ui); letter-spacing: -.003em; }
.nav-item__n {
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  font-variant-numeric: tabular-nums; opacity: .85;
}
.spine__foot { padding: 12px; border-top: 1px solid var(--rule); display: grid; gap: 8px; }

.kbd {
  font-family: var(--mono); font-size: 10px; line-height: 1;
  padding: 3px 5px; border: 1px solid var(--rule-strong);
  border-radius: 3px; color: var(--ink-3); background: var(--paper);
  white-space: nowrap;
}

/* ── main surface ───────────────────────────────────────────────────── */
.surface { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .surface { scroll-behavior: auto; } }
.view { padding: 0 var(--pad-x) 8rem; max-width: 1440px; }
.view--wide { max-width: 1680px; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 14px var(--pad-x);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--med) var(--ease);
}
.topbar[data-stuck="1"] { border-bottom-color: var(--rule); }
.topbar__crumb { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.topbar__crumb b { font-weight: 400; color: var(--ink); }
.topbar__actions { display: flex; align-items: center; gap: 8px; }

.searchcue {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 9px 6px 11px; min-width: 210px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  color: var(--ink-3); background: var(--paper);
  transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.searchcue:hover { border-color: var(--rule-strong); color: var(--ink-2); }
.searchcue span { flex: 1; text-align: left; font-size: var(--t-ui); white-space: nowrap; }

/* ═══ atoms ══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: var(--radius);
  border: 1px solid var(--rule-strong); color: var(--ink);
  font-size: var(--t-ui); letter-spacing: -.003em; white-space: nowrap;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.btn:hover { background: var(--paper-sunk); border-color: var(--ink-4); }
.btn--primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn--primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--paper); }
.btn--ghost { border-color: transparent; color: var(--ink-3); }
.btn--ghost:hover { color: var(--ink); background: var(--paper-sunk); border-color: transparent; }
.btn--risk { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 35%, transparent); }
.btn--risk:hover { background: color-mix(in srgb, var(--risk) 9%, transparent); border-color: var(--risk); }
.btn--sm { padding: 4px 9px; font-size: var(--t-sm); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 14px; height: 14px; flex: none; }

.icobtn {
  display: inline-grid; place-items: center; width: 32px; height: 32px;
  border-radius: var(--radius); color: var(--ink-3);
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.icobtn:hover { background: var(--paper-sunk); color: var(--ink); }
.icobtn svg { width: 16px; height: 16px; }
.icobtn[aria-pressed="true"] { color: var(--brass); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 100px;
  border: 1px solid var(--rule); color: var(--ink-3);
  font-size: var(--t-sm); white-space: nowrap;
  transition: all var(--fast) var(--ease);
}
button.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip[aria-pressed="true"], .chip--on {
  background: var(--ink); border-color: var(--ink); color: var(--paper);
}
.chip--brass { border-color: var(--brass-soft); color: var(--brass); }
.chip__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  border: 1px solid var(--rule); padding: 2px 6px; border-radius: 2px;
}

.rule { height: 1px; background: var(--rule); border: 0; }
.rule--brass { background: linear-gradient(90deg, var(--brass) 0, var(--brass) 34px, var(--rule) 34px); }

.sechead {
  display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 22px;
  border-bottom: 1px solid var(--rule);
}
.sechead h2 { font-family: var(--serif); font-size: 1.375rem; font-weight: 400; letter-spacing: -.01em; }
.sechead .meta { margin-left: auto; }

.empty {
  padding: 56px 24px; text-align: center; color: var(--ink-3);
  border: 1px dashed var(--rule-strong); border-radius: var(--radius);
}
.empty h3 { font-family: var(--serif); font-size: 1.25rem; font-weight: 400; color: var(--ink-2); margin-bottom: 6px; }

/* rating · five hairline marks, no stars */
.rating { display: inline-flex; gap: 3px; align-items: center; }
.rating i { width: 12px; height: 2px; background: var(--rule-strong); display: block; }
.rating i.on { background: var(--brass); }
.rating--input i { width: 20px; height: 12px; cursor: pointer; background: none; position: relative; }
.rating--input i::after { content: ""; position: absolute; inset: 5px 0; background: var(--rule-strong); }
.rating--input i.on::after { background: var(--brass); }

/* ═══ record listings ════════════════════════════════════════════════ */
.grid { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }

/* the plate: a record's generated photographic field */
.plate { position: relative; overflow: hidden; background: var(--paper-sunk); }
.plate canvas { width: 100%; height: 100%; object-fit: cover; }
.plate::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 45%, rgba(12,11,10,.55) 100%);
  opacity: 0; transition: opacity var(--med) var(--ease);
}
.plate--shade::after { opacity: 1; }

.card {
  background: var(--paper); padding: 18px; display: flex; flex-direction: column;
  gap: 10px; text-align: left; transition: background var(--med) var(--ease);
  position: relative; min-height: 0;
}
.card:hover { background: var(--paper-sunk); }
.card__plate { aspect-ratio: 4 / 3; margin: -18px -18px 4px; }
.card__title { font-family: var(--serif); font-size: 1.125rem; line-height: 1.3; letter-spacing: -.008em; color: var(--ink); text-wrap: balance; }
.card__excerpt {
  font-size: var(--t-ui); line-height: 1.55; color: var(--ink-3);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card__foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 4px; }
.card__fav { position: absolute; top: 12px; right: 12px; color: #fff; opacity: .9; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
.card__fav svg { width: 15px; height: 15px; }

/* row listing — the ledger */
.ledger { border-top: 1px solid var(--rule); }
.row {
  display: grid; align-items: center; gap: 16px; width: 100%;
  padding: 13px 8px; border-bottom: 1px solid var(--rule); text-align: left;
  grid-template-columns: 92px 1fr auto;
  transition: background var(--fast) var(--ease), padding-left var(--fast) var(--ease);
}
.row:hover { background: var(--paper-sunk); padding-left: 14px; }
.row__main { min-width: 0; }
.row__title { font-family: var(--serif); font-size: 1.0625rem; letter-spacing: -.006em; color: var(--ink); }
.row__sub { font-size: var(--t-sm); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__aside { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }

/* ═══ home ═══════════════════════════════════════════════════════════ */
.hero { padding: clamp(3rem, 9vh, 6.5rem) 0 2.75rem; display: grid; gap: 1.5rem; }
.hero__greet { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero__stats { display: flex; gap: 34px; flex-wrap: wrap; padding-top: 6px; }
.stat { display: grid; gap: 3px; }
.stat__v { font-family: var(--serif); font-size: 1.75rem; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat__l { font-family: var(--mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-4); }

.weeks { display: grid; gap: 14px; padding: 26px 0 30px; }
.weeks__canvas { max-width: 100%; height: auto; cursor: crosshair; }
.weeks__legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.weeks__scale { display: flex; align-items: center; gap: 4px; }
.weeks__scale i { width: 10px; height: 10px; display: block; }
.weeks__read { min-height: 20px; }

.widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.widget { background: var(--paper); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 210px; }
.widget__head { display: flex; align-items: center; gap: 10px; }
.widget__head h3 { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4); font-weight: 400; }
.widget__more { margin-left: auto; color: var(--ink-4); }
.widget__more:hover { color: var(--brass); }

.onthisday { display: grid; gap: 12px; }
.otd { display: grid; gap: 4px; padding-left: 14px; border-left: 1px solid var(--brass-soft); text-align: left; }
.otd:hover .otd__t { color: var(--brass); }
.otd__t { font-family: var(--serif); font-size: 1.0625rem; transition: color var(--fast) var(--ease); }

.progress { height: 3px; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brass); }

/* ═══ timeline ═══════════════════════════════════════════════════════ */
.tl { display: grid; grid-template-columns: 1fr; position: relative; }
.tl__year { display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 34px 0 10px; align-items: start; }
.tl__yearlabel { position: sticky; top: 72px; display: grid; gap: 6px; }
.tl__yearlabel b { font-family: var(--serif); font-size: 2.25rem; font-weight: 400; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tl__entries { border-left: 1px solid var(--rule); padding-left: 0; display: grid; }
.tl__entry {
  display: grid; grid-template-columns: 78px 1fr; gap: 18px;
  padding: 15px 8px 15px 22px; text-align: left; position: relative;
  border-bottom: 1px solid var(--rule);
  transition: background var(--fast) var(--ease);
}
.tl__entry:hover { background: var(--paper-sunk); }
.tl__entry::before {

    if (abs >= ms) {
      const n = Math.round(abs / ms);
      return fut ? `in ${n} ${name}${n > 1 ? 's' : ''}` : `${n} ${name}${n > 1 ? 's' : ''} ago`;

const Bus = {
  map: new Map(),
  on(evt, fn) { (this.map.get(evt) || this.map.set(evt, []).get(evt)).push(fn); return () => this.off(evt, fn); },
  off(evt, fn) { const l = this.map.get(evt); if (l) l.splice(l.indexOf(fn), 1); },
  emit(evt, payload) { (this.map.get(evt) || []).forEach(fn => fn(payload)); },
};

  createdAt: new Date().toISOString(),
});

/** Forward migrations. Never mutate old versions in place — add a step. */
const MIGRATIONS = {
  // 1 → 2 example: { 1: (s) => { ...; s.version = 2; return s; } }
};

const Store = {
  state: blankState(),
  _rev: null,          // reverse relation index, invalidated on every write
  _byType: null,

  /* ── lifecycle ───────────────────────────────────────────────────── */
  hydrate() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch { /* private mode */ }
    if (!raw) return false;
    try {
      let parsed = JSON.parse(raw);
      while (MIGRATIONS[parsed.version]) parsed = MIGRATIONS[parsed.version](parsed);
      this.state = Object.assign(blankState(), parsed);
      this.invalidate();
      return true;
    } catch (err) {
      console.warn('Archive could not be read; keeping it untouched.', err);
      return false;
    }
  },
  persist: debounce(function () { Store._write(); }, 320),
  _write() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); }
    catch (err) {
      Toast.show('This archive is too large for browser storage. Export a backup.', {
        action: 'Export', onAction: () => Store.download(),
      });
    }
  },
  load(state, { persist = true } = {}) {
    this.state = Object.assign(blankState(), state);
    this.invalidate();
    if (persist) this._write();
    Bus.emit('store:reload');
  },

  /* ── reads ───────────────────────────────────────────────────────── */
  get(id) { return this.state.records[id] || null; },
  every() { return Object.values(this.state.records); },
  all(type) {
    if (!this._byType) {
      this._byType = {};
      for (const t of TYPES) this._byType[t] = [];
      for (const r of this.every()) (this._byType[r.type] ||= []).push(r);
      for (const t of TYPES) this._byType[t].sort(byDateDesc);
    }
    return this._byType[type] || [];
  },
  count(type) { return this.all(type).length; },

  /** Everything that points at `id`, and everything `id` points at. */
  links(id) {
    if (!this._rev) this.buildIndex();
    const out = [];
    const rec = this.get(id);
    if (rec) {
      for (const f of fieldsOf(rec.type)) {
        if (f.type !== 'rel') continue;
        const val = rec[f.key];
        for (const target of (f.multiple ? (val || []) : [val]).filter(Boolean)) {
          const t = this.get(target);
          if (t) out.push({ record: t, field: f });
        }
      }
    }
    return { outbound: out, inbound: (this._rev.get(id) || []).map(e => ({ record: this.get(e.from), field: e.field })).filter(e => e.record) };
  },
  /** Both directions, de-duplicated — what most views actually want. */
  related(id, type = null) {
    const { outbound, inbound } = this.links(id);
    const seen = new Set([id]);
    const list = [];
    for (const { record } of [...outbound, ...inbound]) {
      if (seen.has(record.id)) continue;
      seen.add(record.id);
      if (!type || record.type === type) list.push(record);
    }
    return list.sort(byDateDesc);
  },
  buildIndex() {
    this._rev = new Map();
    for (const rec of this.every()) {
      for (const f of fieldsOf(rec.type)) {
        if (f.type !== 'rel') continue;
        const val = rec[f.key];
        for (const target of (f.multiple ? (val || []) : [val]).filter(Boolean)) {
          if (!this._rev.has(target)) this._rev.set(target, []);
          this._rev.get(target).push({ from: rec.id, field: f });
        }
      }
    }
  },
  invalidate() { this._rev = null; this._byType = null; Search.dirty = true; },

  /* ── writes ──────────────────────────────────────────────────────── */
  put(rec) {
    const now = new Date().toISOString();
    const existing = rec.id ? this.state.records[rec.id] : null;
    const next = Object.assign({}, existing, rec, {
      id: rec.id || uid(rec.type.slice(0, 3)),
      type: rec.type || existing?.type,
      createdAt: existing?.createdAt || now,
      updatedAt: now,
    });
    this.state.records[next.id] = next;
    this.invalidate(); this.persist();
    Bus.emit('store:change', { id: next.id, type: next.type });
    return next;
  },
  patch(id, changes) {
    const rec = this.get(id); if (!rec) return null;
    return this.put(Object.assign({}, rec, changes, { id }));
  },
  remove(id) {
    const rec = this.get(id); if (!rec) return null;
    delete this.state.records[id];
    // sever dangling edges so the graph never points into nothing
    for (const other of this.every()) {
      for (const f of fieldsOf(other.type)) {
        if (f.type !== 'rel') continue;
        if (f.multiple && Array.isArray(other[f.key]) && other[f.key].includes(id)) {
          other[f.key] = other[f.key].filter(x => x !== id);
        } else if (!f.multiple && other[f.key] === id) other[f.key] = null;
      }
    }
    this.invalidate(); this.persist();
    Bus.emit('store:change', { id, removed: true });
    return rec;
  },
  setIdentity(patch) { Object.assign(this.state.identity, patch); this.persist(); Bus.emit('identity:change'); },
  setPref(key, value) { this.state.prefs[key] = value; this.persist(); Bus.emit('prefs:change', { key, value }); },

  /* ── portability ─────────────────────────────────────────────────── */
  snapshot() {
    return JSON.stringify({ ...this.state, exportedAt: new Date().toISOString(), app: 'LEGACY' }, null, 2);
  },
  download() {
    const blob = new Blob([this.snapshot()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `legacy-archive-${iso(new Date())}.json` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  stats() {
    const recs = this.every();
    const words = recs.reduce((n, r) => n + Object.entries(r).reduce((m, [k, v]) =>
      m + (typeof v === 'string' && fieldDef(r.type, k)?.type === 'longtext'
        ? v.trim().split(/\s+/).filter(Boolean).length : 0), 0), 0);
    const years = new Set(recs.map(r => yearOf(dateOf(r))).filter(Boolean));
    let bytes = 0;
    try { bytes = new Blob([localStorage.getItem(STORAGE_KEY) || '']).size; } catch {}
    return { records: recs.length, words, years: years.size, bytes };
  },
};

const byDateDesc = (a, b) => {
  const da = dateOf(a) || a.createdAt || '', db = dateOf(b) || b.createdAt || '';
  return db.localeCompare(da);
};
const byDateAsc = (a, b) => -byDateDesc(a, b);

/* ── assets · binary lives in IndexedDB, never in the JSON graph ───── */
const Assets = {
  db: null,
  urls: new Map(),
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((resolve) => {
      let req;
      try { req = indexedDB.open('legacy-assets', 1); }
      catch { return resolve(null); }
      req.onupgradeneeded = () => req.result.createObjectStore('files', { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
    return this.db;
  },
  async save(file) {
    const db = await this.open(); if (!db) return null;
    const id = uid('img');
    const buf = await file.arrayBuffer();
    await new Promise((res, rej) => {
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put({ id, blob: new Blob([buf], { type: file.type }), name: file.name, at: Date.now() });
      tx.oncomplete = res; tx.onerror = rej;
    });
    return id;
  },
  async url(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    const db = await this.open(); if (!db) return null;
    const rec = await new Promise((res) => {
      const tx = db.transaction('files', 'readonly');
      const q = tx.objectStore('files').get(id);
      q.onsuccess = () => res(q.result); q.onerror = () => res(null);
    });
    if (!rec) return null;
    const url = URL.createObjectURL(rec.blob);
    this.urls.set(id, url);
    return url;
  },
  async drop(id) {
    const db = await this.open(); if (!db) return;
    db.transaction('files', 'readwrite').objectStore('files').delete(id);
    if (this.urls.has(id)) { URL.revokeObjectURL(this.urls.get(id)); this.urls.delete(id); }
  },
};

/* ═══ 04 · SEARCH ════════════════════════════════════════════════════
   A small inverted index, weighted by the schema. Prefix matching so
   results appear while typing; field weight decides ordering.
   ══════════════════════════════════════════════════════════════════ */
const Search = {
  index: new Map(),   // token -> Map(recordId -> score)
  dirty: true,
  tokenise: (s) => String(s || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9']+/).filter(t => t.length > 1),

  build() {
    this.index = new Map();
    for (const rec of Store.every()) {
      const add = (text, weight) => {
        for (const tok of this.tokenise(text)) {
          if (!this.index.has(tok)) this.index.set(tok, new Map());
          const bucket = this.index.get(tok);
          bucket.set(rec.id, (bucket.get(rec.id) || 0) + weight);
        }
      };
      for (const f of fieldsOf(rec.type)) {
        const w = f.weight; if (!w) continue;
        const v = rec[f.key];
        if (Array.isArray(v)) v.forEach(x => add(x, w));
        else add(v, w);
      }
      add(SCHEMA[rec.type].label, 1);
    }
    this.dirty = false;
  },
  query(q, { limit = 40, types = null } = {}) {
    if (this.dirty) this.build();
    const terms = this.tokenise(q);
    if (!terms.length) return [];
    const scores = new Map();
    terms.forEach((term, ti) => {
      const hits = new Map();
      for (const [tok, bucket] of this.index) {
        if (!tok.startsWith(term)) continue;
        const decay = tok === term ? 1 : 0.62 - Math.min(0.4, (tok.length - term.length) * 0.05);
        for (const [id, s] of bucket) hits.set(id, Math.max(hits.get(id) || 0, s * decay));
      }
      for (const [id, s] of hits) {
        const prev = scores.get(id) || { score: 0, matched: 0 };
        scores.set(id, { score: prev.score + s, matched: prev.matched + 1 });
      }
    });
    return [...scores.entries()]
      .map(([id, { score, matched }]) => ({ record: Store.get(id), score: score * (1 + matched / terms.length) }))
      .filter(r => r.record && (!types || types.includes(r.record.type)))
      .sort((a, b) => b.score - a.score || byDateDesc(a.record, b.record))
      .slice(0, limit);
  },
};

/* ═══ 05 · PLATES ════════════════════════════════════════════════════
   Every record carries a generated photographic field, seeded by its id
   so it is stable forever and identical in every view. Real photographs
   replace it the moment you attach one — until then the archive still
   looks like an archive rather than a spreadsheet of grey boxes.
   ══════════════════════════════════════════════════════════════════ */
const Plates = {
  observer: null,
  isDark: () => document.documentElement.dataset.resolved === 'dark',

  paint(canvas) {
    const seed = hash32(canvas.dataset.seed || 'legacy');
    const rand = rng(seed);
    const dark = this.isDark();
    const box = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(box.width || 320));
    const h = Math.max(1, Math.round(box.height || (w * (Number(canvas.dataset.ratio) || 0.66))));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    if (!canvas.dataset.fixedH && !box.height) canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // Base hue from the record's mood when it has one, else from the seed.
    const mood = MOODS[canvas.dataset.mood];
    const baseHue = mood ? mood.hue + (rand() * 20 - 10) : (seed % 360);
    const sat = (mood ? mood.sat * 0.86 : 0.10 + rand() * 0.10) * 100;
    const L = dark ? 16 + rand() * 10 : 74 + rand() * 12;

    ctx.fillStyle = `hsl(${baseHue} ${sat * .7}% ${L}%)`;
    ctx.fillRect(0, 0, w, h);

    // Soft light fields — out-of-focus colour, never a pattern.
    const fields = 3 + Math.floor(rand() * 3);
    for (let i = 0; i < fields; i++) {
      const cx = rand() * w, cy = rand() * h;
      const r = (0.35 + rand() * 0.65) * Math.max(w, h);
      const hue = baseHue + (rand() * 66 - 33);
      const light = dark ? L + 6 + rand() * 22 : L - 6 - rand() * 26;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, `hsla(${hue} ${sat}% ${light}% / ${0.42 + rand() * 0.32})`);
      g.addColorStop(1, `hsla(${hue} ${sat}% ${light}% / 0)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }

    // A horizon, usually. It is what makes these read as photographs.
    if (rand() > 0.22) {
      const y = h * (0.42 + rand() * 0.34);
      const g = ctx.createLinearGradient(0, y - h * 0.22, 0, h);
      const hue = baseHue + (rand() * 30 - 15);
      g.addColorStop(0, `hsla(${hue} ${sat}% ${dark ? L + 4 : L - 16}% / 0)`);
      g.addColorStop(1, `hsla(${hue} ${sat * 1.1}% ${dark ? Math.max(6, L - 8) : L - 30}% / ${0.5 + rand() * 0.3})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }

    // A single light source, high and off-centre.
    {
      const lx = w * (0.2 + rand() * 0.6), ly = h * (0.05 + rand() * 0.3);
      const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.max(w, h) * (0.3 + rand() * 0.3));
      g.addColorStop(0, `hsla(${baseHue + 14} ${sat * 0.6}% ${dark ? L + 34 : L + 14}% / ${dark ? 0.34 : 0.42})`);
      g.addColorStop(1, 'hsla(0 0% 0% / 0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }

    // Vignette + film grain.
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, dark ? 'rgba(0,0,0,.45)' : 'rgba(40,34,26,.20)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);

    ctx.globalAlpha = dark ? 0.07 : 0.055;
    for (let i = 0; i < (w * h) / 26; i++) {
      ctx.fillStyle = rand() > .5 ? '#fff' : '#000';
      ctx.fillRect(rand() * w, rand() * h, 1, 1);
    }
    ctx.globalAlpha = 1;
    canvas.dataset.painted = '1';
  },

  watch(canvas) {
    if (!this.observer) {
      this.observer = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) { this.paint(e.target); this.observer.unobserve(e.target); }
        }
      }, { rootMargin: '260px' });
    }
    this.observer.observe(canvas);
  },
  repaintAll() {
    $$('canvas[data-seed]').forEach(c => { if (c.isConnected) this.paint(c); });
  },
};

/** A generated plate for any record. `shade` darkens the base for text. */
function plate(seed, { ratio = 0.66, mood = null, shade = false, cls = '' } = {}) {
  const canvas = el('canvas', { 'aria-hidden': 'true', width: 480, height: Math.round(480 * ratio),
    dataset: { seed: String(seed), ratio: String(ratio), ...(mood ? { mood } : {}) } });
  const wrap = el('div', { class: 'plate' + (shade ? ' plate--shade' : '') + (cls ? ' ' + cls : '') }, canvas);
  Plates.watch(canvas);
  return wrap;
}
function recordPlate(rec, opts = {}) {
  return plate(rec.id, { mood: rec.mood || null, ...opts });
}
function avatar(rec, size = 56) {
  const initials = titleOf(rec).split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  const canvas = el('canvas', { 'aria-hidden': 'true', dataset: { seed: rec.id + '·portrait', ratio: '1', fixedH: '1' },
    style: { width: size + 'px', height: size + 'px' } });
  Plates.watch(canvas);
  return el('div', { class: 'avatar', style: { width: size + 'px', height: size + 'px' } },
    canvas,
    el('div', { class: 'avatar__mono', style: { fontSize: Math.round(size * 0.36) + 'px' } }, initials));
}

    met: '1997-03-14', birthday: '1965-06-19', placeId: 'pl_porto', favourite: true, tags: ['origin'],
    note: 'A carpenter who talks with his hands still moving. We did not understand each other until I started making things too.',
    learned: 'Measure it again. It costs nothing to measure it again.' });
  add('person', 'pe_ines', { name: 'Inês Vance', relation: 'Family', role: 'My sister. Four years younger, ten years braver.',
    met: '2001-05-30', birthday: '2001-05-30', placeId: 'pl_lisbon', favourite: true, tags: ['origin'],
    note: 'We spent our teens barely speaking and our twenties on the phone constantly. Nobody warns you that siblings are a relationship you get to choose twice.',
    learned: 'You can just do the thing. She has never understood why anyone waits.' });
  add('person', 'pe_avo', { name: 'Avó Céu', relation: 'Family', role: 'Grandmother. The kitchen, the radio, the hands.',
    met: '1997-03-14', birthday: '1936-01-24', placeId: 'pl_amarante', favourite: true, tags: ['gone'],
    note: 'Born in a village of two hundred people, died in the same village at eighty-seven. Fed everyone who came through the door for seventy years.',
    learned: 'Feeding someone is a complete sentence. It does not need explaining.' });
  add('person', 'pe_kai', { name: 'Kai Ferreira', relation: 'Chosen family', role: 'Oldest friend. Knows the version of me from before.',
    met: '2004-09-06', birthday: '1997-08-11', placeId: 'pl_porto', favourite: true, tags: ['constant'],
    note: 'We met at seven over a disagreement about a football and have not had a serious argument since. Twenty-two years of being unimpressed by each other, affectionately.',
    learned: 'Showing up unremarkably, for decades, is the whole thing.' });
  add('person', 'pe_ren', { name: 'Ren Nakamura', relation: 'Partner', role: 'The person I want to tell things to first.',
    met: '2022-07-21', birthday: '1995-09-30', placeId: 'pl_porto', favourite: true, tags: ['now'],
    note: 'Met on a mountain in a queue for a cable car neither of us needed to take. An architect, which explains the pausing before speaking.',
    learned: 'That being known is different from being understood, and rarer.' });
  add('person', 'pe_hale', { name: 'Dr. Miriam Hale', relation: 'Mentor', role: 'Taught me to sit inside a hard question longer.',
    met: '2016-02-11', birthday: '1959-04-08', placeId: 'pl_lisbon', tags: ['work'],
    note: 'Ran the lab I did not deserve to be in. Asked me questions she already knew the answers to, for a year, until I could ask them myself.',
    learned: '"You are answering too quickly." Still the most useful sentence anyone has said to me.' });
  add('person', 'pe_yara', { name: 'Yara Osei', relation: 'Colleague', role: 'Built the company with me. Disagrees with me correctly.',
    met: '2022-09-14', birthday: '1993-12-05', placeId: 'pl_lisbon', tags: ['work'],
    note: 'The best editor of other people I have worked with. Can find the one weak assumption in an hour of confident talking.',
    learned: 'Strong opinions are cheap. Changing one in public is expensive and worth it.' });
  add('person', 'pe_marco', { name: 'Marco Duarte', relation: 'Friend', role: 'Best friend at fifteen. We drifted, and that is allowed.',
    met: '2010-09-13', birthday: '1996-07-22', placeId: 'pl_porto', tags: ['past'],
    note: 'Inseparable for six years, then slowly not. No falling out, no event — just two lives that stopped overlapping. I still send a message every birthday.',
    learned: 'Not every ending needs a reason. Some friendships are complete rather than broken.' });
  add('person', 'pe_sofia', { name: 'Sofia Lindqvist', relation: 'Passed through', role: 'Two days in Iceland. Changed how I travel.',
    met: '2023-02-19', birthday: '1990-03-17', placeId: 'pl_reykjavik', tags: ['brief'],
    note: 'Shared a table because the café was full. Talked for six hours. We have exchanged maybe nine messages since and I think about her advice constantly.',
    learned: '"Go in winter. Everywhere is better with fewer people in it."' });

  /* ── chapters ───────────────────────────────────────────────────── */
  add('chapter', 'ch_begin', { title: 'Beginnings', from: '1997-03-14', to: '2009-06-30',
    subtitle: 'A small flat in Porto and no sense that time was passing.',
    summary: 'Twelve years that feel like one long afternoon. School, the river, my grandmother\'s kitchen in August, a football that was always slightly flat.',
    defining: 'Total safety, and no awareness of it. The only chapter I did not have to survive.', tags: ['childhood'] });
  add('chapter', 'ch_appr', { title: 'The long apprenticeship', from: '2009-07-01', to: '2015-08-31',
    subtitle: 'Learning things badly, in public, on purpose.',
    summary: 'Adolescence and the first real work. Bad at most of it. The years where I found out what I was willing to be bad at for long enough to get good.',
    defining: 'Wanting to be taken seriously, several years before I had earned it.', tags: ['school', 'growth'] });
  add('chapter', 'ch_cities', { title: 'First cities', from: '2015-09-01', to: '2019-12-31',
    subtitle: 'Lisbon, Berlin, Amsterdam, and learning to be a stranger.',
    summary: 'Left home at eighteen and kept leaving. Four years of arriving somewhere with a bag and no plan for the second week.',
    defining: 'Loneliness that turned out to be tuition, not damage.', tags: ['travel', 'independence'] });
  add('chapter', 'ch_quiet', { title: 'The quiet years', from: '2020-01-01', to: '2022-06-30',
    subtitle: 'The world stopped and I found out who I was without an audience.',
    summary: 'Two and a half years mostly indoors. Lost my grandmother. Learned to cook properly, learned to run, learned that I had been outsourcing my sense of self to other people\'s attention.',
    defining: 'Stillness I did not choose, which gave me things I could not have bought.', tags: ['solitude', 'grief'] });
  add('chapter', 'ch_build', { title: 'Building', from: '2022-07-01', to: '2025-11-30',
    subtitle: 'Started something. Met Ren. Slept badly and happily.',
    summary: 'Three years of making a thing exist that did not exist before, with Yara, with too little money and exactly enough conviction.',
    defining: 'The first time effort and outcome were visibly connected.', tags: ['work', 'love'] });
  add('chapter', 'ch_now', { title: 'Now', from: '2025-12-01',
    subtitle: 'Choosing the pace instead of inheriting it.',
    summary: 'Fewer things, done more slowly, on purpose. The chapter I am writing from inside, which means I have no idea what it is about yet.',
    defining: 'Deliberateness. Ask me in four years.', tags: ['present'] });

  /* ── memories ───────────────────────────────────────────────────── */
  add('memory', 'me_kitchen', { title: 'August in a four-metre kitchen', date: '2004-08-15', kind: 'Everyday',
    mood: 'tender', weather: 'Heat', placeId: 'pl_amarante', peopleIds: ['pe_avo', 'pe_ines'],
    favourite: true, resonance: 5, tags: ['family', 'food', 'childhood'],
    story: 'Every August we were sent to Amarante for a month. Avó Céu cooked at a stove that was too small for the amount of food she made, with the radio on a station that only played the news. Inês and I sat on the floor because there were never enough chairs, and nobody found that strange.',
    reflection: 'I spent years thinking those summers were boring. They were the last time I was somewhere without wanting to be somewhere else.' });
  add('memory', 'me_football', { title: 'The argument that started twenty-two years', date: '2004-09-06', kind: 'Beginning',
    mood: 'content', weather: 'Clear', placeId: 'pl_porto', peopleIds: ['pe_kai'], resonance: 4,
    tags: ['friendship', 'childhood'],
    story: 'Kai claimed the ball was his because it had his brother\'s name on it. It did not. We argued for the entire break, played on the same team after lunch, and that was apparently that.',
    reflection: 'The most consequential relationship of my life started over a factual dispute I won.' });
  add('memory', 'me_rome', { title: 'The temperature of Roman stone', date: '2014-04-16', kind: 'Journey',
    mood: 'awe', weather: 'Clear', placeId: 'pl_rome', resonance: 3, tags: ['school', 'first time abroad'],
    story: 'School trip, forty of us, a teacher losing her voice by day two. I remember almost nothing of the itinerary and everything about sitting on a wall in the late afternoon with my hand flat on stone that was still warm at seven in the evening.',
    reflection: 'The detail that survives is never the one on the itinerary. I stopped photographing monuments after this.' });
  add('memory', 'me_leaving', { title: 'Leaving with one bag', date: '2015-09-12', kind: 'Beginning',
    mood: 'restless', weather: 'Overcast', placeId: 'pl_lisbon', peopleIds: ['pe_elena', 'pe_tomas'],
    favourite: true, resonance: 5, tags: ['independence', 'threshold'],
    story: 'My father drove me to Lisbon and did not say anything useful for three hours, then helped me carry one bag up four flights and said "measure it again" about a shelf I had not built yet. My mother had put an envelope in the side pocket that I did not find for a week.',
    reflection: 'They were both terrified and neither said so. I only recognised it years later, doing the same thing at an airport for Inês.' });
  add('memory', 'me_hale', { title: 'You are answering too quickly', date: '2016-02-11', kind: 'Encounter',
    mood: 'reflective', weather: 'Rain', placeId: 'pl_lisbon', peopleIds: ['pe_hale'], resonance: 5,
    tags: ['work', 'mentorship'], favourite: true,
    story: 'First week in the lab. Dr. Hale asked what I thought the failure mode was and I had an answer before she finished the sentence. She waited, then said: "You are answering too quickly. Sit in it until Thursday."',
    reflection: 'I have spent a decade learning to tolerate the gap between a question and my answer. It is still the hardest professional skill I have.' });
  add('memory', 'me_sines', { title: 'Cold water, in August, on purpose', date: '2016-08-14', kind: 'Everyday',
    mood: 'alive', weather: 'Clear', placeId: 'pl_sines', peopleIds: ['pe_kai', 'pe_ines'], resonance: 4,
    tags: ['ocean', 'summer', 'ritual'],
    story: 'The Atlantic at São Torpes is genuinely too cold and we go in anyway, every year, shouting. Afterwards we sit on the sand not talking for twenty minutes because the cold empties your head out.',
    reflection: 'The only reliable reset I have found. Nothing survives that water — not a mood, not an argument, not a work problem.' });
  add('memory', 'me_berlin', { title: 'Bad at being alone in Berlin', date: '2017-06-23', kind: 'Journey',
    mood: 'melancholy', weather: 'Overcast', placeId: 'pl_berlin', resonance: 4, tags: ['solo', 'threshold'],
    story: 'Nine days by myself. I ate dinner at 5pm to avoid restaurants being full of couples, walked until my feet hurt so the day would be over, and called Kai twice from a doorway. On day seven I stopped performing being fine and started actually enjoying it.',
    reflection: 'You do not learn to be alone by being good at it. You learn by being bad at it for a week and not going home.' });
  add('memory', 'me_amsterdam', { title: 'Six months that became two years', date: '2018-03-04', kind: 'Beginning',
    mood: 'content', weather: 'Cold', placeId: 'pl_amsterdam', resonance: 3, tags: ['work', 'moving'],
    story: 'Took a six-month contract, arrived with a suitcase and a wildly optimistic view of Dutch weather in March. Signed a second contract in September without telling anyone at home for two weeks.',
    reflection: 'Most of my life has been decided by not going back at the point where going back was the plan.' });
  add('memory', 'me_kyoto', { title: 'The knife shop that took forty minutes', date: '2019-04-04', kind: 'Encounter',
    mood: 'awe', weather: 'Clear', placeId: 'pl_kyoto', resonance: 5, favourite: true, tags: ['craft', 'japan'],
    story: 'I went in to buy a knife and left ninety minutes later having bought nothing. The man behind the counter asked what I cooked, then what I cooked most often, then how I held things, then showed me four knives and told me which one I did not need.',
    reflection: 'He talked me out of the expensive one. That was the first time I understood that mastery and salesmanship point in opposite directions.' });
  add('memory', 'me_snow', { title: 'Snow to the second floor', date: '2019-04-11', kind: 'Ordinary miracle',
    mood: 'awe', weather: 'Snow', placeId: 'pl_furano', resonance: 5, favourite: true, tags: ['snow', 'silence', 'japan'],
    story: 'I had never seen real snow — the kind that changes the shape of a town. I stood in a field outside Furano at seven in the morning and there was no sound at all. Not quiet. No sound.',
    reflection: 'Twenty-two years old and I found out silence has a texture. I have been chasing that specific frequency ever since.' });
  add('memory', 'me_call', { title: 'The call from the hospital', date: '2020-11-08', kind: 'Loss',
    mood: 'bittersweet', weather: 'Rain', placeId: 'pl_porto', peopleIds: ['pe_avo', 'pe_elena'],
    resonance: 5, favourite: true, tags: ['grief', 'family'],
    story: 'My mother called at 6:40 in the morning and I knew from the first syllable. Nobody could travel. We held the funeral on a video call with eleven squares on the screen, and my father spoke for two minutes and could not finish.',
    reflection: 'I grieved her badly, at a distance, in a small flat. Two years later I made her arroz de forno correctly for the first time and cried in the kitchen like it had just happened. Grief keeps its own schedule.' });
  add('memory', 'me_bread', { title: 'The fourth loaf', date: '2020-05-17', kind: 'Everyday',
    mood: 'content', weather: 'Clear', placeId: 'pl_porto', resonance: 3, tags: ['cooking', 'lockdown'],
    story: 'The first three were bricks. The fourth one came out of the oven and made the correct sound when I knocked on the bottom of it, and I stood in the kitchen at eleven at night genuinely delighted with myself.',
    reflection: 'The first thing I ever got good at purely by repetition, with nobody watching. It rewired how I think about practice.' });
  add('memory', 'me_run', { title: 'Ten kilometres, badly', date: '2021-03-06', kind: 'Milestone',
    mood: 'alive', weather: 'Cold', placeId: 'pl_porto', resonance: 4, tags: ['body', 'discipline'],
    story: 'Started running in January because the walls were closing in. On a cold Saturday in March I did ten kilometres for the first time, at a pace that would embarrass a brisk walk, and sat on a wall by the river for twenty minutes afterwards, absolutely thrilled.',
    reflection: 'I had spent my whole life assuming I was "not a runner", based on no evidence collected after the age of fourteen.' });
  add('memory', 'me_marrakesh', { title: 'Overwhelmed, and sleeping perfectly', date: '2021-10-09', kind: 'Journey',
    mood: 'elated', weather: 'Heat', placeId: 'pl_marrakesh', resonance: 4, tags: ['travel', 'senses'],
    story: 'Nine days of noise, heat, mint, dust and being comprehensively out of my depth. I have never been so tired at the end of a day, or slept so completely.',
    reflection: 'Sensory overload turns out to be the opposite of the overstimulation I get from a screen. One empties you, the other fills you with nothing.' });
  add('memory', 'me_cable', { title: 'A queue for a cable car neither of us needed', date: '2022-07-21', kind: 'Beginning',
    mood: 'elated', weather: 'Clear', placeId: 'pl_chamonix', peopleIds: ['pe_ren'],
    resonance: 5, favourite: true, tags: ['love', 'chance'],
    story: 'Ren was in the queue reading the safety notice out loud, sceptically, to nobody. I said the notice had been translated by someone who had never been on a mountain. We took the cable car, which neither of us had planned to take, and then walked for four hours.',
    reflection: 'Everything since has come from being in the wrong queue for eleven minutes.' });
  add('memory', 'me_incorp', { title: 'The company existed at 14:02', date: '2022-09-14', kind: 'Beginning',
    mood: 'restless', weather: 'Overcast', placeId: 'pl_lisbon', peopleIds: ['pe_yara'],
    resonance: 4, tags: ['work', 'threshold'],
    story: 'The registration came through while we were eating sandwiches on a bench outside the notary. Yara looked at the email, said "well, now we have to do it", and we went back to work. No photograph, no celebration.',
    reflection: 'The moments that change your life are administratively unremarkable. The ceremony always happens somewhere else.' });
  add('memory', 'me_aurora', { title: 'Standing in a car park at 1am, weeping', date: '2023-02-19', kind: 'Ordinary miracle',
    mood: 'awe', weather: 'Clear', placeId: 'pl_reykjavik', peopleIds: ['pe_sofia'],
    resonance: 5, favourite: true, tags: ['aurora', 'iceland'],
    story: 'We had given up and gone back to the guesthouse. Sofia knocked on the door at 12:50 and we ran out in coats over pyjamas and stood in a gravel car park for forty minutes while the entire sky moved.',
    reflection: 'I had seen a hundred photographs and none of them prepared me for the movement. Photographs remove the one thing that matters.' });
  add('memory', 'me_faroe', { title: 'Weather that arrives in ninety seconds', date: '2023-02-24', kind: 'Journey',
    mood: 'alive', weather: 'Storm', placeId: 'pl_faroe', resonance: 4, tags: ['edge', 'wind'],
    story: 'Eleven houses, a waterfall going straight off a cliff into the sea, and a wind that took the door out of my hand. Clear, then not clear, then clear again, inside a quarter of an hour.',
    reflection: 'Being physically overruled by weather is good for the ego. Nothing I was worried about that month survived that wind.' });
  add('memory', 'me_firsthire', { title: 'Signing someone else\'s salary', date: '2023-06-01', kind: 'Milestone',
    mood: 'reflective', weather: 'Clear', placeId: 'pl_lisbon', peopleIds: ['pe_yara'], resonance: 4,
    tags: ['work', 'responsibility'],
    story: 'Our first hire signed on a Thursday. That night I did the maths on how many months of her salary we actually had, three times, getting the same answer each time.',
    reflection: 'The day the work stopped being about me. I have not been able to make it about me since, which is mostly a relief.' });
  add('memory', 'me_bigsur', { title: 'Stopping the car four times in twelve kilometres', date: '2024-05-09', kind: 'Journey',
    mood: 'elated', weather: 'Fog', placeId: 'pl_bigsur', peopleIds: ['pe_ren'], resonance: 5, favourite: true,
    tags: ['road trip', 'fog'],
    story: 'Fog coming over the ridge and down onto a road with nothing on the other side of the barrier. Ren stopped saying anything at all, which is how I know it was working.',
    reflection: 'The best days of my life have a low information content and I cannot explain them to anyone who was not there.' });
  add('memory', 'me_seoul', { title: 'Stew at 1am with people I had known eleven hours', date: '2025-03-22', kind: 'Encounter',
    mood: 'elated', weather: 'Cold', placeId: 'pl_seoul', resonance: 4, tags: ['work', 'strangers'],
    story: 'A conference, then a bar, then somebody\'s favourite place, then a stew at one in the morning with four people whose surnames I still do not know. We argued about typography with total sincerity.',
    reflection: 'Every so often you get an evening with no history and no future in it, and it is completely weightless.' });
  add('memory', 'me_arroz', { title: 'Getting the rice right', date: '2025-01-24', kind: 'Ordinary miracle',
    mood: 'bittersweet', weather: 'Rain', placeId: 'pl_porto', peopleIds: ['pe_avo', 'pe_elena'],
    resonance: 5, favourite: true, tags: ['grief', 'food', 'family'],
    story: 'Fourth attempt at Avó Céu\'s arroz de forno with no recipe, only the memory of the smell. I got the crust right and the room filled with 2004 and I had to sit down on the kitchen floor.',
    reflection: 'She left no recipe. It turns out that was not carelessness — the recipe was the twenty Augusts of watching.' });
  add('memory', 'me_ines', { title: 'Driving Inês to the airport', date: '2025-08-30', kind: 'Ending',
    mood: 'bittersweet', weather: 'First light', placeId: 'pl_porto', peopleIds: ['pe_ines'],
    resonance: 4, tags: ['family', 'threshold'],
    story: 'Five in the morning, one bag, the same drive my father did for me ten years earlier. I said nothing useful for the whole journey and then told her to measure things twice, which made no sense in context and made her laugh.',
    reflection: 'I finally understood the silence in that car in 2015. He was not being distant. He was concentrating on not saying anything that would make it harder.' });
  add('memory', 'me_slow', { title: 'The month I said no to everything', date: '2025-12-04', kind: 'Beginning',
    mood: 'content', weather: 'Cold', placeId: 'pl_porto', peopleIds: ['pe_ren'], resonance: 4,
    tags: ['boundaries', 'pace'],
    story: 'Declined eleven things in four weeks — talks, calls, a podcast, two dinners I did not want to go to. Nothing bad happened. Nobody was even slightly offended.',
    reflection: 'The cost of saying no was almost entirely imaginary, and I had been paying it in advance for a decade.' });
  add('memory', 'me_ren_move', { title: 'Two sets of books on one shelf', date: '2026-02-14', kind: 'Milestone',
    mood: 'tender', weather: 'Rain', placeId: 'pl_porto', peopleIds: ['pe_ren'], resonance: 5, favourite: true,
    tags: ['love', 'home'],
    story: 'We spent an entire Saturday merging two libraries and arguing about whether to sort by subject or by when we read them. Four duplicate copies. We kept all four.',
    reflection: 'You find out what you are actually like when you have to decide which copy of a book survives.' });
  add('memory', 'me_river', { title: 'The bench, Tuesday, nothing happening', date: '2026-06-17', kind: 'Everyday',
    mood: 'grateful', weather: 'Clear', placeId: 'pl_porto', resonance: 3, tags: ['ordinary', 'porto'],
    story: 'Coffee on the bench above the river at eleven on a Tuesday, no reason, nothing scheduled. Two boats, a dog with opinions, someone practising trumpet badly and cheerfully somewhere above.',
    reflection: 'Logged deliberately. Nothing happened, and I would like to be able to find this day again in thirty years.' });

  add('experience', 'ex_snow', { title: 'See real snow', status: 'lived', kind: 'Place', date: '2019-04-11',

  add('experience', 'ex_solo', { title: 'Travel somewhere alone', status: 'lived', kind: 'Solitude', date: '2017-06-23',

  add('experience', 'ex_bread', { title: 'Bake bread that is actually good', status: 'lived', kind: 'Craft', date: '2020-05-17',

  add('experience', 'ex_10k', { title: 'Run ten kilometres without stopping', status: 'lived', kind: 'Skill', date: '2021-03-06',
    placeId: 'pl_porto', rating: 4, again: true, impact: 'Left a mark', tags: ['body'],

  add('experience', 'ex_desert', { title: 'Sleep in the desert', status: 'lived', kind: 'Place', date: '2021-10-13',

  add('experience', 'ex_mountain', { title: 'Stand above the clouds', status: 'lived', kind: 'Nerve', date: '2022-07-19',

  add('experience', 'ex_business', { title: 'Build something that outlives the idea of it', status: 'lived',

  add('experience', 'ex_roadtrip', { title: 'Drive a coast road with no schedule', status: 'lived', kind: 'Together',

  add('experience', 'ex_surf', { title: 'Learn to surf properly', status: 'planned', kind: 'Skill',
