/* ═══ 07 · UI KIT ════════════════════════════════════════════════════
   Sheets, toasts, the composer and the command palette. Everything a
   view needs to be written declaratively.
   ══════════════════════════════════════════════════════════════════ */

const Toast = {
  show(message, { action = null, onAction = null, ms = 4200 } = {}) {
    const node = el('div.toast', { role: 'status' }, el('span', message),
      action && el('button', { onclick: () => { onAction?.(); dismiss(); } }, action));
    $('#toast-root').appendChild(node);
    const dismiss = () => {
      node.classList.add('toast--out');
      setTimeout(() => node.remove(), 260);
    };
    setTimeout(dismiss, ms);
    return dismiss;
  },
};

const Overlay = {
  stack: [],
  open(content, { label = 'Panel', narrow = false, onClose = null, bar = null } = {}) {
    const sheet = el('div', { class: 'sheet' + (narrow ? ' sheet--narrow' : ''), role: 'dialog',
      'aria-modal': 'true', 'aria-label': label });
    const close = () => this.close(entry);
    sheet.appendChild(el('div.sheet__bar', el('h2', label), bar || null,
      el('button.icobtn', { onclick: close, 'aria-label': 'Close', title: 'Close  ·  Esc' }, icon('close', 17))));
    sheet.appendChild(el('div.sheet__body', content));
    const scrim = el('div.scrim', { onclick: (e) => { if (e.target === scrim) close(); } }, sheet);
    const entry = { scrim, onClose, prev: document.activeElement };
    this.stack.push(entry);
    $('#overlay-root').appendChild(scrim);
    document.body.style.overflow = 'hidden';
    setTimeout(() => (sheet.querySelector('input,textarea,select,button:not(.icobtn)') || sheet).focus?.(), 90);
    return { close, sheet };
  },
  close(entry = this.stack[this.stack.length - 1]) {
    if (!entry) return;
    this.stack = this.stack.filter(e => e !== entry);
    entry.scrim.style.animation = 'fade 160ms var(--ease) reverse both';
    setTimeout(() => entry.scrim.remove(), 150);
    if (!this.stack.length) document.body.style.overflow = '';
    entry.onClose?.();
    entry.prev?.focus?.();
  },
  closeTop() { this.close(); },
  get open$() { return this.stack.length > 0; },
};

function confirmSheet({ title, body, confirm = 'Confirm', danger = false, onConfirm }) {
  let handle;
  const node = el('div', { style: { display: 'grid', gap: '18px' } },
    el('h3.h-sec', title),
    el('p.prose', body),
    el('div.form__foot',
      el('div.spacer'),
      el('button.btn', { onclick: () => handle.close() }, 'Cancel'),
      el('button', { class: 'btn ' + (danger ? 'btn--risk' : 'btn--primary'),
        onclick: () => { handle.close(); onConfirm(); } }, confirm)));
  handle = Overlay.open(node, { label: title, narrow: true });
  return handle;
}

/* ── small display atoms shared by every view ───────────────────────── */
const ratingEl = (n, max = 5) =>
  el('span.rating', { title: `${n || 0} of ${max}`, 'aria-label': `${n || 0} out of ${max}` },
    Array.from({ length: max }, (_, i) => el('i', { class: i < (n || 0) ? 'on' : '' })));

const moodDot = (mood) => {
  const m = MOODS[mood]; if (!m) return null;
  return el('span.chip', { title: 'Mood' },
    el('span.chip__dot', { style: { background: `hsl(${m.hue} ${m.sat * 100}% 52%)` } }), m.label);
};

function sectionHead(title, meta, action) {
  return el('div.sechead', el('h2', title), meta && el('span.meta', meta), action || null);
}

function statBlock(value, label, title = '') {
  return el('div.stat', { title }, el('div.stat__v', value), el('div.stat__l', label));
}

function emptyNote(title, body, cta) {
  return el('div.empty', el('h3', title), el('p', { style: { maxWidth: '46ch', margin: '0 auto' } }, body),
    cta ? el('div', { style: { marginTop: '18px' } }, cta) : null);
}

/** The one card used across Memories, Odyssey, Gallery and related lists. */
function recordCard(rec, { plateRatio = 0.75, showPlate = true } = {}) {
  const s = SCHEMA[rec.type];
  const body = bodyOf(rec) || rec.role || rec.subtitle || rec.note || '';
  return el('a', { class: 'card', href: routeOf(rec) },
    showPlate && el('div', { class: 'plate card__plate' + (rec.favourite ? ' plate--shade' : '') },
      recordPlate(rec, { ratio: plateRatio }).firstChild),
    rec.favourite ? el('span.card__fav', icon('heart', 15)) : null,
    el('span.meta', [fmtDate(dateOf(rec), 'day'), yearOf(dateOf(rec))].filter(Boolean).join(' · ') || s.label),
    el('span.card__title', titleOf(rec)),
    body ? el('span.card__excerpt', body) : null,
    el('span.card__foot',
      rec.mood ? moodDot(rec.mood) : null,
      rec.status ? el('span.tag', optLabel(rec.status, EXP_STATUS)) : null,
      rec.category ? el('span.tag', rec.category) : null,
      rec.rating ? ratingEl(rec.rating) : null));
}

function recordRow(rec, { showType = true } = {}) {
  const s = SCHEMA[rec.type];
  return el('a', { class: 'row', href: routeOf(rec) },
    el('span.meta', fmtDate(dateOf(rec), 'short') || '—'),
    el('span.row__main',
      el('span.row__title', titleOf(rec)),
      el('span.row__sub', bodyOf(rec) || rec.role || rec.subtitle || '')),
    el('span.row__aside',
      rec.mood ? moodDot(rec.mood) : null,
      showType ? el('span.tag', s.label) : null,
      icon('chevron', 14)));
}

/* ── the composer · one form engine, eleven record types ───────────── */
function openComposer(type, id = null, presets = {}) {
  const schema = SCHEMA[type];
  const existing = id ? Store.get(id) : null;
  const draft = Object.assign({ type }, existing || presets);
  /* A new record defaults to today — the common case is filing something
     that just happened, and re-typing today's date is friction. */
  if (!existing && schema.dateField && !draft[schema.dateField]) draft[schema.dateField] = iso(new Date());
  let dirty = false, handle = null;
  const errors = new Map();

  const setValue = (key, value) => { draft[key] = value; dirty = true; };

  const fieldNode = (f) => {
    const wrap = el('div.field');
    if (f.col === 'full') wrap.style.gridColumn = '1 / -1';
    const inputId = `f_${f.key}_${Math.random().toString(36).slice(2, 6)}`;
    wrap.appendChild(el('label', { for: inputId }, f.label, f.required ? el('span.brass', ' ·') : null));

    let input;
    switch (f.type) {
      case 'longtext':
        input = el('textarea', { class: 'textarea' + (f.tall ? ' textarea--tall' : ''), id: inputId,
          placeholder: f.placeholder || '', oninput: (e) => setValue(f.key, e.target.value) });
        input.value = draft[f.key] || '';
        break;
      case 'select': {
        input = el('select.select', { id: inputId, onchange: (e) => setValue(f.key, e.target.value || null) });
        input.appendChild(el('option', { value: '' }, '—'));
        for (const o of f.options) {
          const v = optValue(o), l = typeof o === 'string' ? o : o.label;
          input.appendChild(el('option', { value: v, selected: draft[f.key] === v }, l));
        }
        break;
      }
      case 'date':
        input = el('input.input', { type: 'date', id: inputId, value: draft[f.key] ? iso(draft[f.key]) : '',
          oninput: (e) => setValue(f.key, e.target.value || null) });
        break;
      case 'number':
        input = el('input.input', { type: 'number', id: inputId, step: f.step || 1, value: draft[f.key] ?? '',
          oninput: (e) => setValue(f.key, e.target.value === '' ? null : Number(e.target.value)) });
        break;
      case 'bool': {
        const box = el('input', { type: 'checkbox', id: inputId, checked: !!draft[f.key],
          onchange: (e) => setValue(f.key, e.target.checked) });
        input = el('label.switch', { for: inputId }, box, el('span.switch__t'),
          el('span', { style: { fontSize: 'var(--t-ui)', color: 'var(--ink-2)' } }, f.label));
        clear(wrap);   // the switch carries its own label
        break;
      }
      case 'rating': {
        input = el('span', { class: 'rating rating--input', id: inputId, role: 'radiogroup' });
        const paint = () => [...input.children].forEach((m, i) => m.classList.toggle('on', i < (draft[f.key] || 0)));
        for (let i = 1; i <= 5; i++) {
          input.appendChild(el('i', { role: 'radio', tabindex: '0', 'aria-label': `${i} of 5`,
            onclick: () => { setValue(f.key, draft[f.key] === i ? 0 : i); paint(); },
            onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setValue(f.key, i); paint(); } } }));
        }
        paint();
        break;
      }
      case 'tags': {
        input = el('input.input', { id: inputId, placeholder: f.placeholder || 'Comma separated',
          value: (draft[f.key] || []).join(', '),
          oninput: (e) => setValue(f.key, e.target.value.split(',').map(s => s.trim()).filter(Boolean)) });
        break;
      }
      case 'rel': {
        const options = (f.to === 'any' ? Store.every() : Store.all(f.to))
          .filter(r => r.id !== id).sort((a, b) => titleOf(a).localeCompare(titleOf(b)));
        const chips = el('div.picker');
        const redraw = () => {
          clear(chips);
          const chosen = f.multiple ? (draft[f.key] || []) : (draft[f.key] ? [draft[f.key]] : []);
          for (const rid of chosen) {
            const r = Store.get(rid); if (!r) continue;
            chips.appendChild(el('button', { type: 'button', class: 'chip chip--on', onclick: () => {
              if (f.multiple) setValue(f.key, (draft[f.key] || []).filter(x => x !== rid));
              else setValue(f.key, null);
              redraw();
            } }, titleOf(r), icon('close', 11)));
          }
          if (!chosen.length) chips.appendChild(el('span', { class: 'dimmer', style: { fontSize: 'var(--t-sm)' } }, 'Nothing linked yet'));
        };
        redraw();
        const picker = el('select.select', { id: inputId, onchange: (e) => {
          const v = e.target.value; if (!v) return;
          if (f.multiple) setValue(f.key, [...new Set([...(draft[f.key] || []), v])]);
          else setValue(f.key, v);
          e.target.value = ''; redraw();
        } }, el('option', { value: '' }, f.multiple ? 'Add…' : 'Choose…'),
          ...options.map(r => el('option', { value: r.id }, titleOf(r) + (f.to === 'any' ? `  ·  ${SCHEMA[r.type].label}` : ''))));
        input = el('div', { style: { display: 'grid', gap: '8px' } }, chips, picker);
        break;
      }
      default:
        input = el('input.input', { id: inputId, placeholder: f.placeholder || '', value: draft[f.key] || '',
          oninput: (e) => setValue(f.key, e.target.value) });
    }
    wrap.appendChild(input);
    if (f.help) wrap.appendChild(el('span.field__help', f.help));
    const err = el('span', { class: 'field__help', style: { color: 'var(--risk)', display: 'none' } });
    errors.set(f.key, err);
    wrap.appendChild(err);
    return wrap;
  };

  const grid = el('div.form__grid', ...schema.fields.map(fieldNode));
  const form = el('div.form', grid);

  /* photographs — stored as blobs, referenced by id */
  if (PHOTO_TYPES.includes(type)) {
    const shelf = el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
    const renderShelf = async () => {
      clear(shelf);
      for (const pid of draft.photos || []) {
        const url = await Assets.url(pid);
        const thumb = el('div', { style: { position: 'relative', width: '78px', height: '78px', border: '1px solid var(--rule)' } },
          url ? el('img', { src: url, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } })
              : el('div', { class: 'dimmer', style: { display: 'grid', placeItems: 'center', height: '100%', fontSize: '10px' } }, 'missing'),
          el('button.icobtn', { type: 'button', title: 'Remove', style: { position: 'absolute', top: '0', right: '0', background: 'var(--paper-raised)', width: '22px', height: '22px' },
            onclick: () => { setValue('photos', (draft.photos || []).filter(x => x !== pid)); Assets.drop(pid); renderShelf(); } }, icon('close', 12)));
        shelf.appendChild(thumb);
      }
      if (!(draft.photos || []).length) shelf.appendChild(el('span', { class: 'dimmer', style: { fontSize: 'var(--t-sm)' } },
        'No photographs attached. Until you add one, this record uses its generated plate.'));
    };
    const file = el('input', { type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' },
      onchange: async (e) => {
        for (const f of e.target.files) {
          const aid = await Assets.save(f);
          if (aid) setValue('photos', [...(draft.photos || []), aid]);
        }
        e.target.value = ''; renderShelf();
      } });
    renderShelf();
    const block = el('div.field', { style: { gridColumn: '1 / -1' } },
      el('label', 'Photographs'), shelf, file,
      el('div', el('button.btn.btn--sm', { type: 'button', onclick: () => file.click() }, icon('upload', 13), 'Attach photographs')));
    grid.appendChild(block);
  }

  const save = () => {
    let ok = true;
    for (const f of schema.fields) {
      const err = errors.get(f.key); if (!err) continue;
      const empty = f.required && (draft[f.key] === undefined || draft[f.key] === null || draft[f.key] === '');
      err.style.display = empty ? '' : 'none';
      err.textContent = empty ? `${f.label} is needed before this can be filed.` : '';
      if (empty) ok = false;
    }
    if (!ok) { Toast.show('A couple of fields still need you.'); return; }
    const saved = Store.put(draft);
    dirty = false;
    handle.close();
    Toast.show(existing ? `${schema.label} updated.` : `${schema.label} filed.`);
    if (!existing) go(routeOf(saved)); else Router.refresh();
  };

  form.appendChild(el('div.form__foot',
    existing ? el('button.btn.btn--risk.btn--sm', { onclick: () => {
      handle.close();
      confirmSheet({ title: `Remove this ${schema.label.toLowerCase()}?`,
        body: 'It is deleted from the archive and from anything linked to it. This cannot be undone — export a backup first if you are unsure.',
        confirm: 'Remove', danger: true,
        onConfirm: () => { Store.remove(existing.id); Toast.show(`${schema.label} removed.`); go(`#/${schema.module}`); } });
    } }, icon('trash', 13), 'Remove') : null,
    el('div.spacer'),
    el('span.meta', existing ? `Filed ${fmtDate(existing.createdAt, 'short')}` : 'New entry'),
    el('button.btn', { onclick: () => handle.close() }, 'Cancel'),
    el('button.btn.btn--primary', { onclick: save }, icon('check', 14), existing ? 'Save' : 'File it')));

  form.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); }
  });

  handle = Overlay.open(form, {
    label: (existing ? 'Edit ' : 'New ') + schema.label.toLowerCase(),
    onClose: () => { if (dirty) Toast.show('Closed without filing. Nothing was saved.'); },
  });
  return handle;
}

/* ── command palette · the fastest path to anything ─────────────────── */
const Palette = {
  node: null, sel: 0, results: [],
  open(initial = '') {
    if (this.node) return;
    const input = el('input', { placeholder: 'Search the archive, or jump anywhere…', value: initial,
      'aria-label': 'Search', autocomplete: 'off', spellcheck: 'false' });
    const list = el('div.pal__list');
    const pal = el('div.pal', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Search' },
      el('div.pal__in', icon('search', 17, 'dim'), input,
        el('span.kbd', 'Esc')),
      list,
      el('div.pal__foot',
        el('span.meta', 'Enter — open'), el('span.meta', '↑ ↓ — move'), el('span.meta', '⌘K — anywhere')));
    this.node = el('div.pal-scrim', { onclick: (e) => { if (e.target === this.node) this.close(); } }, pal);
    document.body.appendChild(this.node);
    input.focus(); input.select();

    const render = () => {
      const q = input.value.trim();
      this.results = this.compute(q);
      clear(list);
      if (!this.results.length) {
        list.appendChild(el('div', { class: 'pal__grp' }, 'Nothing found'));
        list.appendChild(el('button.pal__it', { onclick: () => { this.close(); openComposer('memory', null, { title: q }); } },
          icon('plus', 15), el('div', el('b', `File “${q}” as a new memory`), el('div.pal__sub', 'Nothing in the archive matched'))));
        return;
      }
      let group = null;
      this.results.forEach((r, i) => {
        if (r.group !== group) { group = r.group; list.appendChild(el('div.pal__grp', group)); }
        list.appendChild(el('button.pal__it', { dataset: { sel: i === this.sel ? '1' : '0' },
          onmousemove: () => { if (this.sel !== i) { this.sel = i; render(); } },
          onclick: () => { this.close(); r.run(); } },
          icon(r.icon, 15, 'dim'),
          el('div', { style: { minWidth: 0 } }, el('b', r.label), r.sub ? el('div.pal__sub', r.sub) : null),
          el('span.pal__hint', icon('arrow', 14))));
      });
      const active = list.querySelector('[data-sel="1"]');
      active?.scrollIntoView({ block: 'nearest' });
    };
    this.render = render;

    input.addEventListener('input', () => { this.sel = 0; render(); });
    this.node.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); this.close(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); this.sel = Math.min(this.results.length - 1, this.sel + 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.sel = Math.max(0, this.sel - 1); render(); }
      else if (e.key === 'Enter') { e.preventDefault(); const r = this.results[this.sel]; if (r) { this.close(); r.run(); } }
    });
    render();
  },
  close() { this.node?.remove(); this.node = null; this.sel = 0; },

  compute(q) {
    const out = [];
    if (!q) {
      for (const m of MODULES) out.push({ group: 'Go to', icon: m.icon, label: m.label, sub: m.blurb, run: () => go(m.route) });
      for (const t of TYPES) out.push({ group: 'File something new', icon: SCHEMA[t].icon, label: `New ${SCHEMA[t].label.toLowerCase()}`,
        sub: SCHEMA[t].blurb, run: () => openComposer(t) });
      return out;
    }
    const lower = q.toLowerCase();
    for (const m of MODULES) {
      if (m.label.toLowerCase().includes(lower)) out.push({ group: 'Go to', icon: m.icon, label: m.label, run: () => go(m.route) });
    }
    for (const { record } of Search.query(q, { limit: 26 })) {
      out.push({ group: SCHEMA[record.type].plural, icon: SCHEMA[record.type].icon,
        label: titleOf(record),
        sub: [fmtDate(dateOf(record), 'short'), (bodyOf(record) || '').slice(0, 76)].filter(Boolean).join('  ·  '),
        run: () => go(routeOf(record)) });
    }
    for (const t of TYPES) {
      if (SCHEMA[t].label.toLowerCase().startsWith(lower) || SCHEMA[t].plural.toLowerCase().startsWith(lower)) {
        out.push({ group: 'File something new', icon: SCHEMA[t].icon, label: `New ${SCHEMA[t].label.toLowerCase()}`, run: () => openComposer(t) });
      }
    }
    out.push({ group: 'File something new', icon: 'plus', label: `File “${q}” as a memory`,
      sub: 'Opens the composer with this title', run: () => openComposer('memory', null, { title: q }) });
    // keep groups contiguous — search returns records interleaved by score
    const order = [...new Set(out.map(o => o.group))];
    return out.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
  },
};

/* ═══ 08 · VIEWS ═════════════════════════════════════════════════════
   Each module is a lens over the same record graph. Nothing here owns
   data; everything reads from Store and writes through the composer.
   ══════════════════════════════════════════════════════════════════ */

const Life = {
  birth: () => Store.state.identity.birthdate,
  age: () => ageOn(Life.birth()),
  span: 90,                                   // the grid's horizon, in years
  weekIndex(date) {
    const b = toDate(Life.birth()), d = toDate(date);
    if (!b || !d) return -1;
    return Math.floor((d - b) / (DAY * 7));
  },
  weekStart(i) {
    const b = toDate(Life.birth()); if (!b) return null;
    return new Date(b.getTime() + i * DAY * 7);
  },
  chapterAt(date) {
    const d = toDate(date); if (!d) return null;
    return Store.all('chapter').find(c => {
      const from = toDate(c.from), to = c.to ? toDate(c.to) : new Date(8640000000000000);
      return from && d >= from && d <= to;
    }) || null;
  },
  currentChapter() { return Life.chapterAt(new Date()); },
};

const greeting = () => {
  const h = new Date().getHours();
  if (h < 5)  return 'Still awake';
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  if (h < 22) return 'Good evening';
  return 'Late, again';
};

/* ── HOME ───────────────────────────────────────────────────────────── */
function viewHome() {
  const id = Store.state.identity;
  const age = Life.age();
  const first = (id.name || '').split(' ')[0];
  const memories = Store.all('memory');
  const chapter = Life.currentChapter();

  /* On this day — the same calendar date, any year but this one */
  const today = new Date();
  const onThisDay = Store.every().filter(r => {
    const d = toDate(dateOf(r));
    return d && d.getMonth() === today.getMonth() && d.getDate() === today.getDate()
      && d.getFullYear() !== today.getFullYear();
  }).sort(byDateDesc);

  /* Next letter still sealed */
  const sealed = Store.all('letter')
    .filter(l => l.opensOn && daysUntil(l.opensOn) > 0)
    .sort((a, b) => a.opensOn.localeCompare(b.opensOn));

  /* Birthdays inside the next 60 days */
  const upcoming = Store.all('person').map(p => {
    if (!p.birthday) return null;
    const b = toDate(p.birthday);
    const next = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if (next < new Date(today.toDateString())) next.setFullYear(today.getFullYear() + 1);
    return { person: p, in: daysUntil(next), on: next };
  }).filter(x => x && x.in <= 60).sort((a, b) => a.in - b.in);

  /* A lesson, chosen deterministically by the date — the same all day */
  const lessons = Store.all('lesson');
  const lesson = lessons.length ? lessons[hash32(iso(today)) % lessons.length] : null;

  const dreaming = Store.all('experience').filter(e => e.status === 'dreaming');
  const planned  = Store.all('experience').filter(e => e.status === 'planned');

  return el('div.stagger',
    el('section.hero',
      el('div.hero__greet',
        el('h1.display', greeting() + (first ? ', ' + first : '')),
      ),
      id.tagline ? el('p.lead', { style: { maxWidth: '38ch' } }, id.tagline) : null,
      el('div.hero__stats',
        statBlock(`${age.years}`, `years, ${age.days} days`, 'Age today'),
        statBlock(age.weeks.toLocaleString(), 'weeks lived'),
        statBlock(memories.length.toLocaleString(), 'memories kept'),
        statBlock(Store.count('experience').toString(), 'experiences'),
        statBlock(Store.count('person').toString(), 'people'),
        statBlock(Store.count('place').toString(), 'places'),
      )),

    weeksPanel(),

    el('section.widgets',
      /* On this day */
      el('article.widget',
        el('div.widget__head', icon('spark', 14, 'brass'), el('h3', 'On this day'),
          el('span.meta', fmtDate(today, 'day'))),
        onThisDay.length
          ? el('div.onthisday', ...onThisDay.slice(0, 4).map(r =>
              el('a.otd', { href: routeOf(r) },
                el('span.meta', `${yearOf(dateOf(r))}  ·  ${new Date().getFullYear() - yearOf(dateOf(r))} years ago`),
                el('span.otd__t', titleOf(r)))))
          : el('p', { class: 'dim', style: { fontSize: 'var(--t-ui)' } },
              'Nothing filed on this date yet. It is not too late to make today one of them.')),

      /* Current chapter */
      chapter ? el('article.widget',
        el('div.widget__head', icon('book', 14, 'brass'), el('h3', 'Current chapter'),
          el('a.widget__more', { href: '#/chapters', title: 'All chapters' }, icon('arrow', 15))),
        el('a', { href: routeOf(chapter), style: { display: 'grid', gap: '8px' } },
          el('span.h-sec', chapter.title),
          el('span.lead', { style: { fontSize: 'var(--t-ui)' } }, chapter.subtitle || '')),
        el('div', { style: { marginTop: 'auto', display: 'grid', gap: '7px' } },
          el('span.meta', `Began ${fmtDate(chapter.from, 'month')}  ·  ${Math.max(0, Math.floor((Date.now() - toDate(chapter.from)) / DAY)).toLocaleString()} days so far`))) : null,

      /* Sealed letter */
      el('article.widget',
        el('div.widget__head', icon('lock', 14, 'brass'), el('h3', 'Sealed'),
          el('a.widget__more', { href: '#/letters' }, icon('arrow', 15))),
        sealed.length ? (() => {
          const l = sealed[0], d = daysUntil(l.opensOn);
          return el('div', { style: { display: 'grid', gap: '14px' } },
            el('div', { style: { display: 'grid', gap: '4px' } },
              el('span.meta', `To ${l.to}`),
              el('span.h-sec', { style: { fontSize: '1.25rem' } }, l.title)),
            el('div.countdown', ...countdownParts(d)),
            el('span.meta', `Opens ${fmtDate(l.opensOn)}`));
        })() : el('p', { class: 'dim', style: { fontSize: 'var(--t-ui)' } }, 'No letters are waiting. Write one to someone you will be in ten years.')),

      /* Odyssey */
      el('article.widget',
        el('div.widget__head', icon('compass', 14, 'brass'), el('h3', 'Still ahead'),
          el('a.widget__more', { href: '#/odyssey' }, icon('arrow', 15))),
        el('div', { style: { display: 'grid', gap: '11px' } },
          ...[...planned.slice(0, 2), ...dreaming.slice(0, 2)].map(e =>
            el('a.otd', { href: routeOf(e), style: { borderLeftColor: e.status === 'planned' ? 'var(--brass)' : 'var(--rule-strong)' } },
              el('span.meta', e.status === 'planned' ? (e.target || 'Planned') : 'Dreaming'),
              el('span.otd__t', e.title)))),
        el('span.meta', { style: { marginTop: 'auto' } },
          `${planned.length} planned  ·  ${dreaming.length} dreaming  ·  ${Store.all('experience').filter(e => e.status === 'lived').length} lived`)),

      /* A lesson */
      lesson ? el('article.widget',
        el('div.widget__head', icon('lesson', 14, 'brass'), el('h3', 'Something you learned'),
          el('a.widget__more', { href: '#/lessons' }, icon('arrow', 15))),
        el('a', { href: routeOf(lesson) },
          el('p', { class: 'serif', style: { fontSize: '1.3125rem', lineHeight: '1.45', letterSpacing: '-.01em' } }, lesson.title)),
        el('span.meta', { style: { marginTop: 'auto' } },
          [lesson.category, lesson.cost && `cost: ${lesson.cost}`].filter(Boolean).join('  ·  '))) : null,

      /* People */
      el('article.widget',
        el('div.widget__head', icon('people', 14, 'brass'), el('h3', 'Coming up'),
          el('a.widget__more', { href: '#/people' }, icon('arrow', 15))),
        upcoming.length
          ? el('div', { style: { display: 'grid', gap: '12px' } }, ...upcoming.slice(0, 3).map(u =>
              el('a', { href: routeOf(u.person), style: { display: 'flex', gap: '12px', alignItems: 'center' } },
                avatar(u.person, 34),
                el('div', { style: { display: 'grid', gap: '2px' } },
                  el('span', { style: { fontFamily: 'var(--serif)', fontSize: '1.0625rem' } }, u.person.name),
                  el('span.meta', u.in === 0 ? 'Birthday today' : `Birthday in ${u.in} day${u.in === 1 ? '' : 's'}  ·  ${fmtDate(u.on, 'day')}`)))))
          : el('p', { class: 'dim', style: { fontSize: 'var(--t-ui)' } }, 'No birthdays in the next two months.')),

      /* Recently kept */
      el('article.widget',
        el('div.widget__head', icon('memory', 14, 'brass'), el('h3', 'Recently kept'),
          el('a.widget__more', { href: '#/memories' }, icon('arrow', 15))),
        el('div', { style: { display: 'grid', gap: '12px' } }, ...memories.slice(0, 3).map(m =>
          el('a.otd', { href: routeOf(m) }, el('span.meta', fmtDate(dateOf(m), 'short')), el('span.otd__t', m.title))))),
    ),

    /* Favourites strip */
    (() => {
      const favs = Store.every().filter(r => r.favourite).slice(0, 8);
      if (!favs.length) return null;
      return el('section', { style: { paddingTop: '52px' } },
        sectionHead('Kept close', `${favs.length} records`),
        el('div.strip', ...favs.map(f =>

/** Years / months / days remaining, for a sealed letter's countdown. */
function countdownParts(days) {
  const y = Math.floor(days / 365), m = Math.floor((days % 365) / 30), d = (days % 365) % 30;
  return [['years', y], ['months', m], ['days', d]]
    .map(([label, n]) => el('div', el('b', String(n)), el('span.meta', label)));
}

/* ── LIFE IN WEEKS ───────────────────────────────────────────────────
   The whole span of a life at 52 columns to the year. Weeks you have
   lived are ink; weeks that hold something are brass, brighter with
   more in them. It is the one view that shows the shape of the thing.
   ─────────────────────────────────────────────────────────────────── */
function weeksPanel() {
  const canvas = el('canvas.weeks__canvas', { role: 'img',
    'aria-label': `Life in weeks: ${Life.age().weeks} weeks lived of roughly ${Life.span * 52}` });
  const readout = el('div', { class: 'weeks__read meta' }, 'Hover a week.');
  const density = new Map();
  for (const r of Store.every()) {
    const i = Life.weekIndex(dateOf(r));
    if (i < 0) continue;
    if (!density.has(i)) density.set(i, []);
    density.get(i).push(r);
  }

  const YEARS = Life.span, WEEKS = 52;
  let cell = 0, gap = 1.5, top = 18;
  const draw = () => {
    if (!canvas.isConnected) return;
    const avail = canvas.parentElement.clientWidth || 900;
    cell = clamp(avail / YEARS - gap, 4, 11);
    const step = cell + gap;
    const w = Math.floor(YEARS * step), h = Math.round(WEEKS * step + top);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = w * dpr; canvas.height = h * dpr;
    /* width only — CSS height:auto keeps the cells square when the
       canvas has to shrink to fit a narrow screen */
    canvas.style.width = w + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);

    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue('--ink').trim();
    const rule = css.getPropertyValue('--rule').trim();
    const brass = css.getPropertyValue('--brass').trim();
    const faint = css.getPropertyValue('--ink-4').trim();
    const lived = Life.age().weeks;

    /* a decade axis, because 90 undifferentiated columns are unreadable */
    ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = faint; ctx.textBaseline = 'top';
    for (let y = 0; y <= YEARS - 10; y += 10) {
      ctx.fillText(String(y), y * step, 2);
    }

    for (let year = 0; year < YEARS; year++) {
      for (let week = 0; week < WEEKS; week++) {
        const i = year * WEEKS + week;
        const x = year * step, y = top + week * step;
        const hits = density.get(i);
        if (hits) { ctx.globalAlpha = clamp(0.5 + hits.length * 0.17, 0.5, 1); ctx.fillStyle = brass; }
        else if (i <= lived) { ctx.globalAlpha = 0.34; ctx.fillStyle = ink; }
        else { ctx.globalAlpha = 1; ctx.fillStyle = rule; }
        ctx.fillRect(x, y, cell, cell);
      }
    }
    /* the week you are inside right now */
    ctx.globalAlpha = 1;
    const cx = Math.floor(lived / WEEKS) * step, cy = top + (lived % WEEKS) * step;
    ctx.strokeStyle = ink; ctx.lineWidth = 1.25;
    ctx.strokeRect(cx - 1.5, cy - 1.5, cell + 3, cell + 3);
  };

  const hit = (e) => {
    const box = canvas.getBoundingClientRect();
    const step = cell + gap;
    const year = Math.floor((e.clientX - box.left) / step);
    const week = Math.floor((e.clientY - box.top - top) / step);
    if (year < 0 || year >= YEARS || week < 0 || week >= WEEKS) return null;
    return year * WEEKS + week;
  };
  canvas.addEventListener('mousemove', (e) => {
    const i = hit(e);
    if (i === null) return;
    const start = Life.weekStart(i);
    const hits = density.get(i) || [];
    const lived = Life.age().weeks;
    clear(readout);
    readout.appendChild(el('span', `Week ${i.toLocaleString()}  ·  ${fmtDate(start, 'long')}  ·  age ${Math.floor(i / WEEKS)}`));
    if (hits.length) {
      readout.appendChild(el('span', { class: 'brass', style: { marginLeft: '12px' } },
        hits.map(h => titleOf(h)).join('  ·  ')));
    } else if (i > lived) {
      readout.appendChild(el('span', { class: 'dimmer', style: { marginLeft: '12px' } }, 'not yet'));
    }
  });
  canvas.addEventListener('mouseleave', () => { clear(readout); readout.appendChild(el('span', 'Hover a week.')); });
  canvas.addEventListener('click', (e) => {
    const i = hit(e); if (i === null) return;
    const hits = density.get(i);
    if (hits?.length === 1) go(routeOf(hits[0]));
    else if (hits?.length) go(`#/timeline?year=${yearOf(dateOf(hits[0]))}`);
    else {
      const start = Life.weekStart(i);
      if (start && start <= new Date()) go(`#/timeline?year=${start.getFullYear()}`);
    }
  });

  requestAnimationFrame(draw);
  const onResize = debounce(draw, 140);
  window.addEventListener('resize', onResize);
  Bus.on('theme:change', () => requestAnimationFrame(draw));

  return el('section.weeks',
    el('div.sechead', el('h2', 'Life in weeks'),
      el('span.meta', `${Life.age().weeks.toLocaleString()} lived  ·  ${(Life.span * 52 - Life.age().weeks).toLocaleString()} remaining, optimistically`)),
    el('div', canvas),
    readout,
    el('div.weeks__legend',
      el('span.meta', 'One column is a year of your life, top to bottom, 52 weeks.'),
      el('span.weeks__scale',
        el('i', { style: { background: 'var(--rule)' } }), el('span.meta', 'ahead'),
        el('i', { style: { background: 'var(--ink-4)', opacity: '.5', marginLeft: '10px' } }), el('span.meta', 'lived'),
        el('i', { style: { background: 'var(--brass)', marginLeft: '10px' } }), el('span.meta', 'holds something'))));
}

/* ── PLACES · a navigational chart, not a street map ─────────────────
   Landmass geometry needs an offline dataset this build deliberately
   does not carry, so places are plotted on a true equirectangular
   graticule instead — accurate positions, no borrowed basemap. The
   projection is isolated in `project()` if you ever drop tiles in.
   ─────────────────────────────────────────────────────────────────── */
/** World projection seam — swap this (and `toXY` below) for real tiles. */
const project = (lat, lng) => ({ x: (Number(lng) + 180) / 360, y: (90 - Number(lat)) / 180 });

function haversine(a, b) {
  const R = 6371, toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

function viewPlaces() {
  const places = Store.all('place').filter(p => p.lat != null && p.lng != null);
  const all = Store.all('place');
  const home = Store.get(Store.state.identity.homePlaceId) || all.find(p => p.home);

  const canvas = el('canvas', { 'aria-hidden': 'true' });
  const pins = el('div.chart__pins');
  const chart = el('div.chart', canvas, pins);

  /* Frame the chart on the ground you have actually covered, padded, and
     held to 2:1 so the projection stays undistorted. An empty southern
     ocean is not information. */
  const bounds = (() => {
    if (!places.length) return { minLat: -60, maxLat: 80, minLng: -170, maxLng: 170 };
    const lats = places.map(p => Number(p.lat)), lngs = places.map(p => Number(p.lng));
    let minLat = Math.min(...lats), maxLat = Math.max(...lats);
    let minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const padLat = Math.max(9, (maxLat - minLat) * 0.22), padLng = Math.max(9, (maxLng - minLng) * 0.14);
    minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;
    return {
      minLat: Math.max(-85, minLat), maxLat: Math.min(85, maxLat),
      minLng: Math.max(-180, minLng), maxLng: Math.min(180, maxLng),
    };
  })();
  const spanLat = bounds.maxLat - bounds.minLat, spanLng = bounds.maxLng - bounds.minLng;
  /* The frame follows the data rather than the globe, so latitude ends up
     stretched. That is stated in the caption instead of being hidden. */
  const ratio = clamp(spanLat / spanLng, 0.30, 0.62);
  const exaggeration = (ratio / (spanLat / spanLng));
  const toXY = (lat, lng) => ({
    x: (Number(lng) - bounds.minLng) / (bounds.maxLng - bounds.minLng),
    y: (bounds.maxLat - Number(lat)) / (bounds.maxLat - bounds.minLat),
  });
  const gridStep = (() => {
    const span = bounds.maxLng - bounds.minLng;
    return span > 200 ? 30 : span > 110 ? 15 : span > 55 ? 10 : 5;
  })();

  const drawChart = () => {
    if (!canvas.isConnected) return;
    const w = chart.clientWidth || 900, h = Math.round(w * ratio);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = '100%'; canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, w, h);
    ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';

    const rule = css.getPropertyValue('--rule').trim();
    const faint = css.getPropertyValue('--ink-4').trim();

    /* meridians */
    ctx.lineWidth = 1;
    for (let lng = Math.ceil(bounds.minLng / gridStep) * gridStep; lng <= bounds.maxLng; lng += gridStep) {
      const x = Math.round(toXY(0, lng).x * w) + .5;
      ctx.strokeStyle = rule;
      ctx.globalAlpha = lng === 0 ? 1 : .5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h - 13); ctx.stroke();
      ctx.globalAlpha = .9; ctx.fillStyle = faint; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(`${Math.abs(Math.round(lng))}°${lng === 0 ? '' : lng > 0 ? 'E' : 'W'}`, x, h - 3);
    }
    /* parallels */
    for (let lat = Math.ceil(bounds.minLat / gridStep) * gridStep; lat <= bounds.maxLat; lat += gridStep) {
      const y = Math.round(toXY(lat, 0).y * h) + .5;
      ctx.strokeStyle = rule;
      ctx.globalAlpha = lat === 0 ? 1 : .5;
      ctx.beginPath(); ctx.moveTo(26, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.globalAlpha = .9; ctx.fillStyle = faint; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`${Math.abs(Math.round(lat))}°${lat === 0 ? '' : lat > 0 ? 'N' : 'S'}`, 4, y);
    }
    /* the named lines, dashed */
    ctx.setLineDash([3, 5]); ctx.globalAlpha = .75; ctx.strokeStyle = css.getPropertyValue('--rule-strong').trim();
    for (const lat of [23.44, -23.44, 66.56, -66.56]) {
      if (lat < bounds.minLat || lat > bounds.maxLat) continue;
      const y = Math.round(toXY(lat, 0).y * h) + .5;
      ctx.beginPath(); ctx.moveTo(26, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.setLineDash([]);

    /* the route: places in the order you first stood on them */
    const route = [...places].filter(p => p.first).sort((a, b) => String(a.first).localeCompare(String(b.first)));
    if (route.length > 1) {
      ctx.strokeStyle = css.getPropertyValue('--brass').trim();
      ctx.globalAlpha = .32; ctx.lineWidth = 1.25;
      ctx.beginPath();
      route.forEach((p, i) => {
        const { x, y } = toXY(p.lat, p.lng);
        const px = x * w, py = y * h;
        if (i === 0) ctx.moveTo(px, py);
        else {
          const prev = toXY(route[i - 1].lat, route[i - 1].lng);
          const mx = (prev.x * w + px) / 2, my = (prev.y * h + py) / 2 - Math.abs(px - prev.x * w) * .14;
          ctx.quadraticCurveTo(mx, my, px, py);
        }
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    clear(pins);
    for (const p of places) {
      const { x, y } = toXY(p.lat, p.lng);
      pins.appendChild(el('a', { class: 'pin' + (p.home ? ' pin--home' : ''), href: routeOf(p),
        style: { left: (x * 100) + '%', top: (y * 100) + '%' }, title: p.name },
        el('span.pin__dot'), el('span.pin__label', p.name)));
    }
  };
  requestAnimationFrame(drawChart);
  window.addEventListener('resize', debounce(drawChart, 160));
  Bus.on('theme:change', () => requestAnimationFrame(drawChart));

  const far = home && places.length
    ? places.filter(p => p.id !== home.id).map(p => ({ p, km: haversine(home, p) })).sort((a, b) => b.km - a.km)[0]
    : null;

  return el('div.stagger',
    pageHead('Places', SCHEMA.place.blurb,
      el('button.btn.btn--primary', { onclick: () => openComposer('place') }, icon('plus', 14), 'Add a place')),
    el('div.hero__stats', { style: { padding: '0 0 20px' } },
      statBlock(String(all.length), 'places'),
      statBlock(String(new Set(all.map(p => p.region).filter(Boolean)).size), 'countries & regions'),
      home ? statBlock(home.name, 'home ground') : null,
      far ? statBlock(far.km.toLocaleString() + ' km', `furthest — ${far.p.name}`) : null),
    chart,
    el('p', { class: 'meta', style: { padding: '10px 0 30px' } },
      `${gridStep}° graticule · framed on where you have been`
      + (exaggeration > 1.1 ? ` · latitude stretched ×${exaggeration.toFixed(1)} to fill the frame` : '')
      + ' · the brass line is the order you first arrived'),
    el('div.grid.grid--3', ...all.map(p => el('a.card', { href: routeOf(p) },
      el('div', { class: 'plate card__plate' }, recordPlate(p, { ratio: 0.62 }).firstChild),
      el('span.meta', [p.region, p.kind].filter(Boolean).join('  ·  ')),
      el('span.card__title', p.name),
      p.note ? el('span.card__excerpt', p.note) : null,
      el('span.card__foot',
        p.home ? el('span.chip.chip--brass', 'Home') : null,
        p.first ? el('span.meta', `first ${fmtDate(p.first, 'month')}` ) : null,
        p.rating ? ratingEl(p.rating) : null)))));
}

/* ── SEARCH RESULTS ─────────────────────────────────────────────────── */
function viewSearch(params) {
  const q = params.q || '';

  const out = el('div', { style: { display: 'grid', gap: '18px' } });
  const input = el('input.input', { value: q, placeholder: 'Search everything…',
    style: { fontFamily: 'var(--serif)', fontSize: '1.375rem', padding: '14px 16px' },
    oninput: debounce((e) => run(e.target.value), 180) });

  /* Results are rebuilt in place rather than through the router, so the
     caret and focus survive every keystroke. */
  function run(term) {
    const found = term.trim() ? Search.query(term, { limit: 120 }) : [];
    const byType = {};
    for (const r of found) (byType[r.record.type] ||= []).push(r.record);
    history.replaceState(null, '', term.trim() ? `#/search?q=${encodeURIComponent(term)}` : '#/search');
    clear(out);
    if (!term.trim()) return;
    out.appendChild(el('p.meta', { style: { padding: '4px 0 8px' } },
      `${found.length} result${found.length === 1 ? '' : 's'} for “${term}”`));
    for (const [type, list] of Object.entries(byType)) {
      out.appendChild(el('section',
        sectionHead(SCHEMA[type].plural, `${list.length}`),
        el('div.ledger', ...list.map(r => recordRow(r, { showType: false })))));
    }
    if (!found.length) out.appendChild(emptyNote('Nothing found',
      'Nothing in the archive matches that yet. Search covers titles, stories, reflections, tags and names.'));
  }
  run(q);
  setTimeout(() => { input.focus(); input.setSelectionRange(q.length, q.length); }, 40);

  return el('div.stagger',
    pageHead('Search', 'One index over every record type. Prefix matching, weighted by where the words appear.'),
    input, out);
}

/* ── RECORD DETAIL · one renderer, per-type apparatus ────────────────── */
function viewRecord(type, id) {
  const rec = Store.get(id);
  if (!rec) return el('div', pageHead('Not in the archive', 'That record is not here. It may have been removed.'),
    el('a.btn', { href: '#/' }, 'Back to home'));

  const schema = SCHEMA[rec.type];
  const relatedAll = Store.related(rec.id);

  /* apparatus — the typewritten column of what the archive knows */
  const appar = [];
  const put = (k, v) => { if (v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && !v.length)) appar.push(el('div.appar', el('span.appar__k', k), el('span.appar__v', v))); };

  put('Filed as', schema.label);
  if (dateOf(rec)) put(rec.type === 'letter' ? 'Written' : rec.type === 'chapter' ? 'Began' : 'Date',
    frag(fmtDate(dateOf(rec)), el('div.meta', { style: { paddingTop: '2px' } }, relTime(dateOf(rec)))));
  if (Life.birth() && dateOf(rec) && rec.type !== 'person') {
    const a = ageOn(Life.birth(), toDate(dateOf(rec)));
    if (a.years >= 0) put('You were', `${a.years} years old`);
  }
  const chapter = Life.chapterAt(dateOf(rec));
  if (chapter && rec.type !== 'chapter') put('Chapter', el('a', { href: routeOf(chapter) }, chapter.title));

  for (const f of schema.fields) {
    const v = rec[f.key];
    if (v === null || v === undefined || v === '' || f.key === schema.titleField || f.key === schema.bodyField) continue;
    if (f.key === schema.dateField) continue;
    if (f.type === 'longtext' || f.key === 'entries') continue;
    if (f.type === 'rel') {
      const ids = f.multiple ? v : [v];
      const nodes = ids.map(x => Store.get(x)).filter(Boolean)
        .map(r => el('a', { href: routeOf(r), style: { display: 'block' } }, titleOf(r)));
      if (nodes.length) put(f.label, frag(...nodes));
      continue;
    }
    if (f.type === 'bool') { if (v && f.key !== 'favourite') put(f.label, 'Yes'); continue; }
    if (f.type === 'rating') { put(f.label, ratingEl(v)); continue; }
    if (f.type === 'tags') { put(f.label, frag(...v.map(t => el('span.tag', { style: { marginRight: '4px', display: 'inline-block', marginBottom: '4px' } }, t)))); continue; }
    if (f.type === 'select') { put(f.label, optLabel(v, f.options)); continue; }
    if (f.type === 'date') { put(f.label, fmtDate(v)); continue; }
    put(f.label, String(v));
  }

  /* main column */
  const main = [];
  const sealed = rec.type === 'letter' && rec.opensOn && daysUntil(rec.opensOn) > 0;

  main.push(el('div', { style: { display: 'grid', gap: '12px' } },
    el('div.rec__sub',
      el('span.meta', schema.label),
      rec.mood ? moodDot(rec.mood) : null,
      rec.status ? el('span.chip', optLabel(rec.status, EXP_STATUS)) : null,
      rec.favourite ? el('span.chip.chip--brass', icon('heart', 11), 'Kept close') : null),
    el('h1.title', titleOf(rec)),
    rec.subtitle || rec.role ? el('p.lead', { style: { maxWidth: '44ch' } }, rec.subtitle || rec.role) : null));

  if (rec.type === 'person') {
    main.push(el('div.person-hd', avatar(rec, 110),
      el('div', { style: { display: 'grid', gap: '6px' } },
        el('span.meta', rec.relation || ''),
        rec.met ? el('span.lead', `Known since ${fmtDate(rec.met, 'month')} — ${relTime(rec.met).replace(' ago', '')}`) : null)));
  } else if (!['letter', 'lesson', 'chapter', 'collection'].includes(rec.type)) {
    main.push(el('div', { class: 'plate rec__hero' + (rec.type === 'place' ? '' : ' plate--shade') },
      recordPlate(rec, { ratio: 0.42 }).firstChild));
  }

  if (sealed) {
    const d = daysUntil(rec.opensOn);
    main.push(el('div', { style: { display: 'grid', gap: '18px', padding: '30px 0', justifyItems: 'start' } },
      el('div.seal', { style: { width: '64px', height: '64px', fontSize: '22px' } }, 'L'),
      el('h2.h-sec', 'This letter is still sealed'),
      el('p.prose', `You wrote it on ${fmtDate(rec.written)} and asked not to read it until ${fmtDate(rec.opensOn)}. That is ${d.toLocaleString()} days from today.`),
      el('div.countdown', ...countdownParts(d)),
      el('p.prose', { style: { fontSize: 'var(--t-ui)' } },
        'Nothing is encrypted — this is your own archive, and you could open it. Breaking the seal early is recorded, because the record of having waited is part of what makes it worth writing.'),
      el('button.btn', { onclick: () => confirmSheet({
        title: 'Break the seal early?',
        body: `There are ${d.toLocaleString()} days left. Opening now clears the seal date permanently, and the letter joins the open ones.`,
        confirm: 'Open it now',
        onConfirm: () => { Store.patch(rec.id, { opensOn: null, openedEarly: iso(new Date()) }); Toast.show('Seal broken.'); Router.refresh(); } }) },
        icon('unlock', 14), 'Break the seal')));
  } else {
    for (const f of schema.fields) {
      if (f.type !== 'longtext') continue;
      const v = rec[f.key]; if (!v) continue;
      const isReflection = ['reflection', 'lesson', 'learned', 'defining'].includes(f.key);
      main.push(el('section', { style: { display: 'grid', gap: '10px' } },
        el('h2.meta', f.label),
        isReflection
          ? el('div.reflect', ...String(v).split('\n\n').map(p => el('p', p)))
          : el('div.prose', ...String(v).split('\n\n').map(p => el('p', p)))));
    }
  }

  if (rec.entries?.length) {
    main.push(el('section', { style: { display: 'grid', gap: '10px' } },
      el('h2.meta', 'Entries'),
      el('div.ledger', ...rec.entries.map((e, i) => el('div.row', { style: { gridTemplateColumns: '38px 1fr' } },
        el('span.meta', String(i + 1).padStart(2, '0')),
        el('span', { style: { fontFamily: 'var(--serif)', fontSize: 'var(--t-bd)' } }, e))))));
  }

  /* a chapter shows what happened inside it */
  if (rec.type === 'chapter') {
    const inside = Store.every().filter(r => {
      const d = toDate(dateOf(r)); if (!d || r.type === 'chapter') return false;
      return d >= toDate(rec.from) && (!rec.to || d <= toDate(rec.to));
    }).sort(byDateDesc);
    if (inside.length) main.push(el('section', { style: { display: 'grid', gap: '12px' } },
      el('h2.meta', `Inside this chapter — ${inside.length} records`),
      el('div.ledger', ...inside.slice(0, 40).map(r => recordRow(r)))));
  }

  /* a person shows the life you share */
  if (rec.type === 'person') {
    const shared = relatedAll;
    const together = shared.filter(r => dateOf(r)).sort(byDateAsc);
    if (together.length) {
      main.push(el('section', { style: { display: 'grid', gap: '12px' } },
        el('h2.meta', `Together — ${together.length} records, ${yearOf(dateOf(together[0]))} to ${yearOf(dateOf(together[together.length - 1]))}`),
        el('div.ledger', ...[...together].reverse().map(r => recordRow(r)))));
    }
  } else if (relatedAll.length) {
    main.push(el('section', { style: { display: 'grid', gap: '12px' } },
      el('h2.meta', 'Connected'),
      el('div.linkgrid', ...relatedAll.slice(0, 12).map(r => el('a.linkcell', { href: routeOf(r) },
        el('span.meta', SCHEMA[r.type].label + (dateOf(r) ? '  ·  ' + fmtDate(dateOf(r), 'short') : '')),
        el('b', titleOf(r)))))));
  }

  /* photographs, if any were attached */
  if ((rec.photos || []).length) {
    const strip = el('div.strip');
    main.push(el('section', { style: { display: 'grid', gap: '12px' } }, el('h2.meta', 'Photographs'), strip));
    (async () => {
      for (const pid of rec.photos) {
        const url = await Assets.url(pid);
        if (url) strip.appendChild(el('img', { src: url, alt: '', style: { width: '100%', aspectRatio: '1', objectFit: 'cover' } }));
      }
    })();
  }

  return el('div.stagger',
    el('div', { style: { paddingTop: '26px' } }),
    el('div.rec',
      el('aside.rec__apparatus',
        el('div', { style: { display: 'flex', gap: '6px' } },
          el('button.btn.btn--sm', { onclick: () => openComposer(rec.type, rec.id) }, icon('edit', 13), 'Edit'),
          ['memory', 'person', 'place'].includes(rec.type)
            ? el('button.icobtn', { 'aria-pressed': rec.favourite ? 'true' : 'false',
                title: rec.favourite ? 'Kept close' : 'Keep close',
                onclick: () => { Store.patch(rec.id, { favourite: !rec.favourite }); Router.refresh(); } }, icon('heart', 15))
            : null),
        ...appar,
        el('div.appar', el('span.appar__k', 'Catalogue'), el('span', { class: 'appar__v num', style: { fontSize: 'var(--t-sm)' } }, rec.id))),
      el('div.rec__main', ...main)));
}

/* ═══ 09 · SHELL, ROUTER, BOOT ═══════════════════════════════════════ */

const MODULES = [
  { key: 'home',        label: 'Home',        route: '#/',             icon: 'home',     group: 'Archive',  render: viewHome,         blurb: 'Where you are, right now' },
  { key: 'timeline',    label: 'Timeline',    route: '#/timeline',     icon: 'timeline', group: 'Archive',  render: viewTimeline,     blurb: 'Everything, in order' },
  { key: 'chapters',    label: 'Chapters',    route: '#/chapters',     icon: 'book',     group: 'Archive',  render: viewChapters,     type: 'chapter', blurb: 'The eras you have named' },

  { key: 'memories',    label: 'Memories',    route: '#/memories',     icon: 'memory',   group: 'The record', render: viewMemories,   type: 'memory' },
  { key: 'odyssey',     label: 'Odyssey',     route: '#/odyssey',      icon: 'compass',  group: 'The record', render: viewOdyssey,    type: 'experience' },
  { key: 'people',      label: 'People',      route: '#/people',       icon: 'people',   group: 'The record', render: viewPeople,     type: 'person' },
  { key: 'places',      label: 'Places',      route: '#/places',       icon: 'place',    group: 'The record', render: viewPlaces,     type: 'place' },

  { key: 'lessons',     label: 'Lessons',     route: '#/lessons',      icon: 'lesson',   group: 'What it meant', render: viewLessons, type: 'lesson' },
  { key: 'letters',     label: 'Letters',     route: '#/letters',      icon: 'letter',   group: 'What it meant', render: viewLetters, type: 'letter' },
  { key: 'achievements',label: 'Achievements',route: '#/achievements', icon: 'trophy',   group: 'What it meant', render: viewAchievements, type: 'achievement' },

  { key: 'soundtrack',  label: 'Soundtrack',  route: '#/soundtrack',   icon: 'music',    group: 'Sensory', render: viewSoundtrack,   type: 'track' },
  { key: 'gallery',     label: 'Gallery',     route: '#/gallery',      icon: 'gallery',  group: 'Sensory', render: viewGallery },
  { key: 'collections', label: 'Collections', route: '#/collections',  icon: 'grid',     group: 'Sensory', render: viewCollections,  type: 'collection' },

  { key: 'search',      label: 'Search',      route: '#/search',       icon: 'search',   group: null, render: viewSearch },
  { key: 'settings',    label: 'Settings',    route: '#/settings',     icon: 'settings', group: null, render: viewSettings },
];
const moduleByKey = (k) => MODULES.find(m => m.key === k);
const go = (hash) => { location.hash = hash || '#/'; };

/* ── theme ──────────────────────────────────────────────────────────── */
const Theme = {
  media: window.matchMedia('(prefers-color-scheme: dark)'),
  set(pref) { Store.setPref('theme', pref); this.apply(); },
  apply() {
    const pref = Store.state.prefs.theme || 'auto';
    const root = document.documentElement;
    if (pref === 'auto') delete root.dataset.theme;
    else root.dataset.theme = pref;
    root.dataset.resolved = pref === 'auto' ? (this.media.matches ? 'dark' : 'light') : pref;
    Bus.emit('theme:change');
    requestAnimationFrame(() => Plates.repaintAll());
  },
  init() {
    this.apply();
    this.media.addEventListener('change', () => { if ((Store.state.prefs.theme || 'auto') === 'auto') this.apply(); });
  },
};

/* ── the spine ──────────────────────────────────────────────────────── */
function renderSpine() {
  const spine = $('#spine');
  clear(spine);
  const current = Router.current;

  spine.appendChild(el('div.spine__head',
    el('a.wordmark', { href: '#/', 'aria-label': 'LEGACY — home' }, 'Legacy'),
    el('div', { class: 'meta', style: { paddingTop: '7px', color: 'var(--ink-4)' } },
      Store.state.identity.name || 'Your life, remembered')));

  const scroll = el('div.spine__scroll');
  const groups = [...new Set(MODULES.filter(m => m.group).map(m => m.group))];
  for (const g of groups) {
    const list = el('ul');
    for (const m of MODULES.filter(x => x.group === g)) {
      const active = current.module === m.key;
      list.appendChild(el('li', el('a', {
        class: 'nav-item', href: m.route, 'aria-current': active ? 'page' : null },
        icon(m.icon, 15, 'nav-item__ico'),
        el('span.nav-item__txt', m.label),
        m.type ? el('span.nav-item__n', String(Store.count(m.type))) : null)));
    }
    scroll.appendChild(el('div.nav-group', el('span.nav-group__label', g), list));
  }
  spine.appendChild(scroll);

  spine.appendChild(el('div.spine__foot',
    el('a', { class: 'nav-item', href: '#/settings', 'aria-current': current.module === 'settings' ? 'page' : null },
      icon('settings', 15, 'nav-item__ico'), el('span.nav-item__txt', 'Settings')),
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '2px 10px 4px' } },
      el('span.meta', { style: { flex: 1 } }, `${Store.stats().records} records`),
      el('span.kbd', '⌘K'))));
}

/* ── the topbar ─────────────────────────────────────────────────────── */
function renderTopbar() {
  const bar = $('#topbar');
  clear(bar);
  const { module, id } = Router.current;
  const m = moduleByKey(module) || MODULES[0];
  const rec = id ? Store.get(id) : null;

  bar.appendChild(el('button.icobtn.spine__toggle', {
    'aria-label': 'Menu', onclick: () => document.body.dataset.nav = document.body.dataset.nav === 'open' ? '' : 'open' },
    icon('menu', 18)));

  bar.appendChild(el('nav.topbar__crumb', { 'aria-label': 'Breadcrumb' },
    el('a', { class: 'meta', href: m.route }, m.label),
    rec ? frag(icon('chevron', 12, 'dimmer'), el('b', { style: { fontFamily: 'var(--serif)', fontSize: '1rem' } }, titleOf(rec))) : null));

  bar.appendChild(el('div.topbar__actions',
    el('button.searchcue', { onclick: () => Palette.open() },
      icon('search', 15), el('span', 'Search everything'), el('span.kbd', '⌘K')),
    el('button.icobtn', { title: 'Switch theme', 'aria-label': 'Switch theme',
      onclick: () => {
        const order = ['light', 'dark', 'auto'];
        const next = order[(order.indexOf(Store.state.prefs.theme || 'auto') + 1) % 3];
        Theme.set(next);
        Toast.show(next === 'auto' ? 'Following your system.' : next === 'dark' ? 'Nocturne.' : 'Daylight.');
      } }, icon(document.documentElement.dataset.resolved === 'dark' ? 'moon' : 'sun', 16)),
    el('button.btn.btn--primary', { onclick: () => openComposer(m.type || 'memory'),
      title: 'File something new  ·  N' },
      icon('plus', 14), el('span', 'New'))));
}

/* ── router ─────────────────────────────────────────────────────────── */
const Router = {
  current: { module: 'home', id: null, params: {} },
  parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    const [pathPart, queryPart] = raw.split('?');
    const segments = pathPart.split('/').filter(Boolean);
    const params = Object.fromEntries(new URLSearchParams(queryPart || ''));
    if (!segments.length) return { module: 'home', id: null, params };
    const m = MODULES.find(x => x.key === segments[0]);
    if (!m) return { module: 'home', id: null, params };
    return { module: m.key, id: segments[1] || null, params };
  },
  render() {
    this.current = this.parse();
    const { module, id, params } = this.current;
    const m = moduleByKey(module);
    const view = $('#view');
    clear(view);

    let node;
    try {
      node = id ? viewRecord(module, id) : m.render(params);
    } catch (err) {
      console.error(err);
      node = el('div', pageHead('Something went wrong rendering this view',
        'The archive itself is untouched — every record is still stored. Reload the page, and export a backup from Settings if this keeps happening.'),
        el('pre', { class: 'prose', style: { whiteSpace: 'pre-wrap', fontFamily: 'var(--mono)', fontSize: '12px' } }, String(err && err.stack || err)));
    }
    view.appendChild(node);

    renderSpine();
    renderTopbar();
    document.title = (id && Store.get(id) ? titleOf(Store.get(id)) + ' · ' : m.key !== 'home' ? m.label + ' · ' : '')
      + 'LEGACY';
    document.body.dataset.nav = '';
    if (!this._keepScroll) $('#surface').scrollTop = 0;
    this._keepScroll = false;
    if (params.year) {
      const anchor = $(`#y${params.year}`);
      if (anchor) setTimeout(() => anchor.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    }
  },
  refresh() {
    const y = $('#surface').scrollTop;
    this._keepScroll = true;
    this.render();
    $('#surface').scrollTop = y;
  },
  init() {
    window.addEventListener('hashchange', () => this.render());
    this.render();
  },
};

/* ── keyboard · Linear-style, with g-sequences ──────────────────────── */
let chord = null, chordTimer = null;
const inField = (t) => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;

  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); return; }

  if (e.key === 'Escape') {
    if (Palette.node) { Palette.close(); return; }
    if (Overlay.stack.length) { Overlay.closeTop(); return; }
    if (document.body.dataset.nav === 'open') { document.body.dataset.nav = ''; return; }
  }
  if (inField(e.target) || mod || e.altKey) return;

  if (chord === 'g') {
    clearTimeout(chordTimer); chord = null;
    const map = { h: '#/', t: '#/timeline', m: '#/memories', o: '#/odyssey', p: '#/people',
      l: '#/lessons', w: '#/letters', a: '#/achievements', s: '#/soundtrack', g: '#/gallery',
      c: '#/chapters', k: '#/collections', r: '#/places', ',': '#/settings' };
    if (map[e.key.toLowerCase()]) { e.preventDefault(); go(map[e.key.toLowerCase()]); }
    return;
  }
  switch (e.key) {
    case 'g': chord = 'g'; chordTimer = setTimeout(() => (chord = null), 1400); break;
    case '/': e.preventDefault(); Palette.open(); break;
    case 'n': case 'N': {
      e.preventDefault();
      const m = moduleByKey(Router.current.module);
      openComposer(m?.type || 'memory');
      break;
    }
    case '?': e.preventDefault(); shortcutsSheet(); break;
    default: break;
  }
});

function shortcutsSheet() {
  const rows = [
    ['⌘K  /  /', 'Search everything, jump anywhere, file anything'],
    ['N', 'File something new in the current module'],
    ['G then H', 'Home'], ['G then T', 'Timeline'], ['G then M', 'Memories'],
    ['G then O', 'Odyssey'], ['G then P', 'People'], ['G then R', 'Places'],
    ['G then L', 'Lessons'], ['G then W', 'Letters'], ['G then A', 'Achievements'],
    ['G then S', 'Soundtrack'], ['G then G', 'Gallery'], ['G then C', 'Chapters'],
    ['⌘↵', 'Save, from inside the composer'],
    ['Esc', 'Close whatever is open'],
    ['?', 'This list'],
  ];
  Overlay.open(el('div', { style: { display: 'grid', gap: '2px' } },
    ...rows.map(([k, v]) => el('div', { style: { display: 'flex', gap: '18px', alignItems: 'center', padding: '9px 0', borderBottom: '1px solid var(--rule)' } },
      el('span.kbd', { style: { minWidth: '86px', textAlign: 'center' } }, k),
      el('span', { style: { color: 'var(--ink-2)' } }, v)))),
    { label: 'Keyboard', narrow: true });
}

/* ── first run ──────────────────────────────────────────────────────── */
function firstRunNotice() {
  if (!Store.state.prefs.firstRun || !Store.state.prefs.sample) return;
  const notice = el('div.notice',
    icon('spark', 17, 'brass'),
    el('div', { style: { display: 'grid', gap: '10px' } },
      el('p', el('b', 'This is a sample life, so nothing here is empty. '),
        'It belongs to a person who does not exist — Noa Vance, born March 1997. Every module is populated so you can see how the archive behaves once it has years in it.'),
      el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
        el('a.btn.btn--primary.btn--sm', { href: '#/settings' }, 'Make it mine'),
        el('button.btn.btn--sm', { onclick: () => { Store.setPref('firstRun', false); Router.refresh(); } }, 'Keep looking around'))));
  const view = $('#view');
  const hero = view.querySelector('.hero');
  if (hero) hero.after(notice); else view.prepend(notice);
}

/* ── boot ───────────────────────────────────────────────────────────── */
function boot() {
  const had = Store.hydrate();
  if (!had) Store.load(sampleArchive(), { persist: true });

  /* the first-run notice belongs to Home, and must survive refresh() too */
  const renderView = Router.render.bind(Router);
  Router.render = function () {
    renderView();
    if (this.current.module === 'home' && !this.current.id) firstRunNotice();
  };

  Theme.init();

  Bus.on('store:reload', () => Router.render());
  Bus.on('chrome:refresh', () => renderSpine());
  Bus.on('identity:change', () => renderSpine());

  const surface = $('#surface');
  surface.addEventListener('scroll', () => {
    $('#topbar').dataset.stuck = surface.scrollTop > 6 ? '1' : '0';
  }, { passive: true });

  Router.init();

  console.log('%cLEGACY', 'font: 600 15px/1 ui-monospace, monospace; letter-spacing: .26em',
    '\nYour life, remembered forever.\nEverything is stored locally. Settings → Export keeps a copy you own.');
}

boot();
