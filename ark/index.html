function paletteItems(q) {
  const term = q.toLowerCase().trim();
  const groups = [];
  const match = (s) => !term || String(s).toLowerCase().includes(term);

  const actions = [
    { label: "Add an object", icon: "plus", run: () => assetForm() },
    { label: "Add to wishlist", icon: "bookmark", run: () => wishForm() },
    { label: "New collection", icon: "layers", run: () => collectionForm() },
    { label: "New maintenance reminder", icon: "wrench", run: () => taskForm() },
    { label: "Begin an ownership review", icon: "scales", run: () => reviewFlow() },
    { label: "Export library", icon: "download", run: exportLibrary },
    { label: `Switch to ${state.settings.theme === "dark" ? "light" : "dark"} mode`, icon: state.settings.theme === "dark" ? "sun" : "moon", run: toggleTheme },
  ].filter((x) => match(x.label));
  if (actions.length) groups.push({ label: "Actions", items: actions });

  const places = NAV.flatMap((g) => g.items).concat([{ r: "settings", label: "Settings", icon: "settings" }])
    .filter((x) => match(x.label)).map((x) => ({ label: x.label, icon: x.icon, sub: "Go to", run: () => go("#/" + x.r) }));
  if (places.length) groups.push({ label: "Navigate", items: places });

  if (term) {
    const assets = searchAssets(q, { status: "all" }).slice(0, 8).map((a) => ({
      label: a.name, thumb: a, sub: [a.brand, collName(a.coll)].filter(Boolean).join(" · "), run: () => go("#/asset/" + a.id),
    }));
    if (assets.length) groups.push({ label: "Objects", items: assets });

    const colls = state.collections.filter((c) => match(c.name)).map((c) => ({
      label: c.name, icon: "layers", sub: inColl(c.id).length + " objects", run: () => go("#/collection/" + c.id),
    }));
    if (colls.length) groups.push({ label: "Collections", items: colls });

    const wishes = state.wishlist.filter((x) => match(x.name + " " + x.brand)).slice(0, 4).map((x) => ({
      label: x.name, icon: "bookmark", sub: money(x.price), run: () => go("#/wish/" + x.id),
    }));
    if (wishes.length) groups.push({ label: "Wishlist", items: wishes });

    groups.push({ label: "Search", items: [{ label: `Search everything for “${q}”`, icon: "search", run: () => go("#/search?q=" + encodeURIComponent(q)) }] });
  }
  return groups;
}

function openPalette() {
  if (layers().querySelector('[data-layer="palette"]')) return;
  const el = document.createElement("div");
  el.className = "pal-scrim";
  el.dataset.layer = "palette";
  el.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Search">
    <div class="pal-input-wrap">${icon("search")}
      <input class="pal-input" id="pal-input" placeholder="Search objects, collections, memories, or type a command…" autocomplete="off" />
      <kbd class="kbd">esc</kbd></div>
    <div class="pal-results" id="pal-results"></div>
    <div class="pal-foot"><span><kbd class="kbd">↑↓</kbd> navigate</span><span><kbd class="kbd">↵</kbd> open</span>
      <span style="margin-left:auto">${owned().length} objects · ${state.collections.length} collections</span></div>
  </div>`;
  el.addEventListener("mousedown", (e) => { if (e.target === el) closeLayer(); });
  layers().appendChild(el);
  document.body.style.overflow = "hidden";

  const input = el.querySelector("#pal-input");
  const results = el.querySelector("#pal-results");
  let flat = [], sel = 0;

  const paint = () => {
    const groups = paletteItems(input.value);
    flat = [];
    results.innerHTML = groups.map((g) => `<div class="pal-group-label">${esc(g.label)}</div>` + g.items.map((it) => {
      const i = flat.push(it) - 1;
      return `<div class="pal-item ${i === sel ? "is-sel" : ""}" data-i="${i}">
        ${it.thumb ? `<span class="th">${coverFor(it.thumb)}</span>` : icon(it.icon || "arrowRight")}
        <span class="truncate">${esc(it.label)}</span>
        ${it.sub ? `<span class="pal-sub truncate">${esc(it.sub)}</span>` : ""}</div>`;
    }).join("")).join("");
    if (!flat.length) results.innerHTML = `<div class="empty" style="padding:var(--s6)"><p class="t-sm">Nothing matched.</p></div>`;
    results.querySelectorAll(".pal-item").forEach((node) => {
      node.onclick = () => { const it = flat[Number(node.dataset.i)]; closeLayer(); it.run(); };
      node.onmouseenter = () => { sel = Number(node.dataset.i); results.querySelectorAll(".pal-item").forEach((n) => n.classList.toggle("is-sel", n === node)); };
    });
  };
  const move = (d) => {
    sel = clamp(sel + d, 0, flat.length - 1);
    const nodes = results.querySelectorAll(".pal-item");
    nodes.forEach((n, i) => n.classList.toggle("is-sel", i === sel));
    if (nodes[sel]) nodes[sel].scrollIntoView({ block: "nearest" });
  };
  input.addEventListener("input", () => { sel = 0; paint(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") { e.preventDefault(); const it = flat[sel]; if (it) { closeLayer(); it.run(); } }
  });
  paint();
  setTimeout(() => input.focus(), 40);
}

function toggleTheme() {
  mutate((s) => (s.settings.theme = s.settings.theme === "dark" ? "light" : "dark"));
}

/* Event delegation -------------------------------------------------------- */

const ACTIONS = {
  close: () => closeLayer(),
  theme: () => toggleTheme(),
  menu: () => document.body.classList.toggle("nav-open"),
  palette: () => openPalette(),
  go: (el) => go(el.dataset.href),
  "new-asset": (el) => assetForm(null, el.dataset.coll),
  "edit-asset": (el) => { closeAllLayers(); assetForm(findAsset(el.dataset.id)); },
  "new-collection": () => collectionForm(),
  "edit-collection": (el) => collectionForm(findColl(el.dataset.id)),
  "new-wish": () => wishForm(),
  "edit-wish": (el) => wishForm(findWish(el.dataset.id)),
  "add-memory": (el) => memoryForm(el.dataset.id),
  "log-service": (el) => serviceForm(el.dataset.id),
  "add-task": (el) => taskForm(el.dataset.id),
  "add-photo": (el) => addPhoto(el.dataset.id),
  "part-with": (el) => { closeAllLayers(); partWithForm(el.dataset.id); },
  reflect: (el) => reflectFlow(el.dataset.id),
  "acquire-wish": (el) => { closeAllLayers(); acquireWish(el.dataset.id); },
  review: () => reviewFlow(),
  export: () => exportLibrary(),
  import: () => importLibrary(),
  lightbox: (el) => lightbox(el.dataset.id, Number(el.dataset.i || 0)),

  fav: (el) => {
    const a = findAsset(el.dataset.id);
    mutate(() => (a.favorite = !a.favorite));
    toast(a.favorite ? "Added to favourites." : "Removed from favourites.");
  },

  "complete-task": (el) => {
    const t = state.tasks.find((x) => x.id === el.dataset.id);
    if (!t) return;
    const a = findAsset(t.asset);
    const prevDue = t.due, wasDone = t.done;
    mutate(() => {
      t.history = [...(t.history || []), { date: iso(Date.now()) }];
      if (t.every > 0) t.due = ahead(t.every); else t.done = true;
    }, { log: { kind: "care", text: `${t.title} — ${a ? a.name : ""}`, href: a ? "#/asset/" + a.id : "" } });
    toast(t.every > 0 ? `Done. Next due ${relative(t.due)}.` : "Done.", "Undo", () => {
      mutate(() => { t.history.pop(); t.due = prevDue; t.done = wasDone; });
    });
  },
  "del-task": (el) => {
    const t = state.tasks.find((x) => x.id === el.dataset.id);
    if (!t) return;
    mutate((s) => (s.tasks = s.tasks.filter((x) => x.id !== t.id)));
    toast("Reminder removed.", "Undo", () => mutate((s) => s.tasks.push(t)));
  },
  "del-memory": (el) => {
    const a = findAsset(el.dataset.id);
    const m = (a.memories || []).find((x) => x.id === el.dataset.mid);
    mutate(() => (a.memories = a.memories.filter((x) => x.id !== el.dataset.mid)));
    toast("Memory removed.", "Undo", () => mutate(() => a.memories.push(m)));
  },
  "delete-asset": (el) => {
    const a = findAsset(el.dataset.id);
    confirmDialog({
      title: `Delete ${a.name}?`, danger: true, confirm: "Delete permanently",
      body: "This erases the object and everything attached to it — memories, service history and reminders. If you no longer own it, record it as parted with instead: the history is worth keeping.",
      onConfirm: () => {
        closeAllLayers();
        mutate((s) => { s.assets = s.assets.filter((x) => x.id !== a.id); s.tasks = s.tasks.filter((t) => t.asset !== a.id); }, { silent: true });
        go("#/collections"); toast("Deleted.", "Undo", () => mutate((s) => s.assets.push(a)));
      },
    });
  },
  "delete-collection": (el) => {
    const c = findColl(el.dataset.id);
    closeAllLayers();
    mutate((s) => (s.collections = s.collections.filter((x) => x.id !== c.id)), { silent: true });
    go("#/collections"); toast("Collection removed.", "Undo", () => mutate((s) => s.collections.push(c)));
  },
  "delete-wish": (el) => {
    const x = findWish(el.dataset.id);
    closeAllLayers();
    mutate((s) => (s.wishlist = s.wishlist.filter((y) => y.id !== x.id)), { silent: true });
    go("#/wishlist"); toast("Removed from the wishlist.", "Undo", () => mutate((s) => s.wishlist.push(x)));
  },
  "decline-wish": (el) => {
    const x = findWish(el.dataset.id);
    confirmDialog({
      title: `Decide against the ${x.name}?`,
      body: "It moves to 'let go' with the reason preserved. Deciding against something is a result, not a failure — the amount is counted as money you chose not to spend.",
      confirm: "Let it go",
      onConfirm: () => { mutate(() => (x.status = "declined"), { log: { kind: "edit", text: `Decided against the ${x.name}` }, silent: true }); go("#/wishlist?s=declined"); toast("Let go of."); },
    });
  },

  "asset-more": (el) => {
    const a = findAsset(el.dataset.id);
    openModal(`<div class="modal-head"><div><div class="modal-title">${esc(a.name)}</div>
        <div class="modal-sub">${esc(a.brand)}${a.brand ? " · " : ""}${esc(collName(a.coll))}</div></div></div>
      <div class="modal-body flush" style="padding:var(--s2)">
        <button class="pal-item" style="width:100%" data-act="add-memory" data-id="${a.id}">${icon("quill")}Attach a memory</button>
        <button class="pal-item" style="width:100%" data-act="log-service" data-id="${a.id}">${icon("wrench")}Log a service</button>
        <button class="pal-item" style="width:100%" data-act="add-task" data-id="${a.id}">${icon("calendar")}Set a maintenance reminder</button>
        <button class="pal-item" style="width:100%" data-act="add-photo" data-id="${a.id}">${icon("camera")}Add a photograph</button>
        <button class="pal-item" style="width:100%" data-act="edit-asset" data-id="${a.id}">${icon("edit")}Edit every field</button>
        ${a.status !== "parted" ? `<button class="pal-item" style="width:100%" data-act="part-with" data-id="${a.id}">${icon("archive")}Record parting with it</button>` : ""}
        <button class="pal-item" style="width:100%;color:var(--red)" data-act="delete-asset" data-id="${a.id}">${icon("trash")}Delete permanently</button>
      </div>`, { size: "sm", noFocus: true });
  },

  reset: () => confirmDialog({
    title: "Reset to the sample library?", danger: true, confirm: "Reset everything",
    body: "Every object, memory, reminder and wishlist entry you have added will be erased and replaced with the sample library. Export first if you want to keep it.",
    onConfirm: () => { state = buildSeed(); save(); go("#/home"); render(); toast("Reset to the sample library."); },
  }),

  "chart-mode": (el) => {
    const panel = el.closest(".panel");
    const mode = el.dataset.mode;
    panel.querySelectorAll("[data-pane]").forEach((p) => { p.hidden = p.dataset.pane !== mode; });
    panel.querySelectorAll('[data-act="chart-mode"]').forEach((b) => b.classList.toggle("is-on", b === el));
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const fn = ACTIONS[act];
  if (!fn) return;
  if (el.tagName !== "SELECT" && el.tagName !== "INPUT") { e.preventDefault(); fn(el, e); }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  if (act === "set") { mutate((s) => (s.settings[el.dataset.key] = el.value)); toast("Saved."); }
  else if (act === "gallery-coll") {
    const p = new URLSearchParams(route.params.toString());
    if (el.value) p.set("c", el.value); else p.delete("c");
    go("#/gallery?" + p.toString());
  } else if (act === "search-filter") {
    const p = new URLSearchParams(route.params.toString());
    if (el.value) p.set(el.dataset.key, el.value); else p.delete(el.dataset.key);
    go("#/search?" + p.toString());
  }
});

let searchTimer = null;
document.addEventListener("input", (e) => {
  const el = e.target.closest('[data-act="search-input"]');
  if (!el) return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const p = new URLSearchParams(route.params.toString());
    if (el.value) p.set("q", el.value); else p.delete("q");
    go("#/search?" + p.toString());
  }, 320);
});

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") { if (layers().children.length) { closeLayer(); } else document.body.classList.remove("nav-open"); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  if (e.key === "n" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); assetForm(); }
});

/* Boot -------------------------------------------------------------------- */

function boot() {
  const fresh = !localStorage.getItem(STORAGE_KEY);
  state = load();
  /* Persist immediately on first run so the sample library — including its
     dates relative to that first moment — stays stable across reloads. */
  if (fresh) save();
  document.documentElement.setAttribute("data-theme", state.settings.theme || "light");
  route = parseRoute();
  window.addEventListener("hashchange", () => {
    route = parseRoute();
    document.body.classList.remove("nav-open");
    render();
    const si = document.querySelector('[data-act="search-input"]');
    if (si && route.name === "search") { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
  });
  if (!location.hash) location.replace("#/home");
  render();
  if (!state.assets.length) assetForm();
}
boot();
</script>
