    </div>
    <div class="grid g3 stagger">
      ${stats.map((c) => {
        const cover = c.items.slice().sort(by((a) => -a.value))[0];
        return `<a class="coll-card" href="#/collection/${c.id}">
          <div class="cover cover-wide"><div class="cover-inner">${cover ? coverFor(cover) : artFor(c.id, c.hue, { letter: c.name })}</div></div>
          <div class="coll-body">
            <div class="row gap2"><span class="eyebrow">${esc(c.count ? c.count + (c.count === 1 ? " object" : " objects") : "Empty")}</span>
              ${c.favs ? `<span class="eyebrow" style="color:var(--gold-ink)">· ${c.favs} favourite${c.favs === 1 ? "" : "s"}</span>` : ""}</div>
            <div class="coll-name">${esc(c.name)}</div>
            <p class="t-sm muted clamp-2" style="margin-top:2px">${esc(c.description || "")}</p>
            <div class="coll-stats">
              <div class="coll-stat"><b>${money(c.value, { compact: true })}</b><span>Value</span></div>
              <div class="coll-stat"><b>${c.oldest ? esc(String(c.oldest.purchaseDate).slice(0, 4)) : "—"}</b><span>Since</span></div>
              <div class="coll-stat"><b>${c.newest ? esc(fmtDate(c.newest.purchaseDate, "short")) : "—"}</b><span>Latest</span></div>
            </div>
          </div></a>`;
      }).join("")}
    </div>
  </div>`;
};

VIEWS.collection = () => {
  const c = findColl(route.id);
  if (!c) return emptyState("Collection not found", "It may have been removed.", `<a class="btn" href="#/collections">All collections</a>`);
  const items = inColl(c.id);
  const sortKey = route.params.get("sort") || "recent";
  const sorted = items.slice().sort(
    sortKey === "value" ? by((a) => -a.value) :
    sortKey === "oldest" ? by((a) => a.purchaseDate) :
    sortKey === "name" ? by((a) => a.name.toLowerCase()) : by((a) => a.purchaseDate, -1)
  );
  const value = sum(items, (a) => a.value), paid = sum(items, (a) => a.price);
  const years = items.length ? [...new Set(items.map((a) => String(a.purchaseDate).slice(0, 4)))].sort() : [];
  const growth = (() => {
    const list = items.slice().sort(by((a) => a.purchaseDate));
    let cum = 0;
    return list.map((a) => { cum += a.price; return { x: a.purchaseDate, y: cum, n: a.name }; });
  })();
  return `<div class="view">
    <div class="card" style="overflow:hidden;margin-bottom:var(--s7)">
      <div class="cover cover-wide" style="aspect-ratio:auto;height:180px">
        <div class="cover-inner">${artFor(c.id + ":hero", c.hue, { letter: c.name, big: true })}</div>
      </div>
      <div class="card-pad">
        <div class="row gap4" style="align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div class="eyebrow">Collection</div>
            <h1 class="page-title" style="font-size:32px;margin-top:4px">${esc(c.name)}</h1>
            <p class="lede" style="margin-top:var(--s3);max-width:64ch">${esc(c.description || "")}</p>
          </div>
          <button class="btn btn-sm" data-act="edit-collection" data-id="${c.id}">${icon("edit")}Edit</button>
        </div>
        <div class="grid g4 gap5" style="margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line-soft)">
          <div class="coll-stat"><b style="font-size:22px">${items.length}</b><span>Objects</span></div>
          <div class="coll-stat"><b style="font-size:22px">${money(value, { compact: true })}</b><span>Current value</span></div>
          <div class="coll-stat"><b style="font-size:22px">${money(paid, { compact: true })}</b><span>Total paid</span></div>
          <div class="coll-stat"><b style="font-size:22px">${years.length ? esc(years[0] + "–" + years[years.length - 1]) : "—"}</b><span>Span</span></div>
        </div>
      </div>
    </div>

    ${growth.length > 2 ? `<section class="section">
      <div class="section-head"><div><h2 class="section-title">How it grew</h2>
        <div class="section-sub">Committed amount over the life of the collection</div></div></div>
      <div class="panel"><div class="panel-body">${areaChart(growth, { height: 180, fmt: (p) => `<b>${esc(p.n)}</b><br>${money(p.y)} committed by ${fmtDate(p.x, "short")}` })}</div></div>
    </section>` : ""}

    <div class="section-head">
      <div><h2 class="section-title">Objects</h2><div class="section-sub">${items.length} in this collection</div></div>
      <div class="spacer"></div>
      <div class="seg">
        ${[["recent", "Newest"], ["oldest", "Oldest"], ["value", "Value"], ["name", "A–Z"]].map(([k, l]) =>
          `<button class="${sortKey === k ? "is-on" : ""}" data-act="go" data-href="#/collection/${c.id}?sort=${k}">${l}</button>`).join("")}
      </div>
      <button class="btn btn-sm" data-act="new-asset" data-coll="${c.id}">${icon("plus")}Add here</button>
    </div>

    ${items.length ? `<div class="grid g4 stagger">${sorted.map((a) => assetCard(a)).join("")}</div>`
      : emptyState("Nothing here yet", "This collection is waiting for its first object.", `<button class="btn btn-primary" data-act="new-asset" data-coll="${c.id}">${icon("plus")}Add an object</button>`)}
  </div>`;
};

/* Asset page ------------------------------------------------------------- */

VIEWS.asset = () => {
  const a = findAsset(route.id);
  if (!a) return emptyState("Object not found", "It may have been removed from the library.", `<a class="btn" href="#/collections">Back to collections</a>`);
  const photos = assetPhotos(a);
  const active = clamp(parseInt(route.params.get("p") || "0", 10) || 0, 0, photos.length - 1);
  const w = warrantyState(a);
  const st = stewardship(a);
  const tasks = tasksFor(a.id).filter((t) => !t.done).sort(by((t) => t.due));
  const done = tasksFor(a.id).filter((t) => t.done);
  const mems = (a.memories || []).slice().sort(by((m) => m.date, -1));
  const related = (a.related || []).map(findAsset).filter(Boolean);
  const replaces = a.replaces ? findAsset(a.replaces) : null;
  const replacedBy = state.assets.find((x) => x.replaces === a.id);
  const isParted = a.status === "parted";

  const chips = [
    `<span class="chip">${esc(a.condition)}</span>`,
    a.usage ? `<span class="chip">${icon("refresh")}used ${esc(a.usage)}</span>` : "",
    a.favorite ? `<span class="chip chip-gold">${iconFilled("heart")}Favourite</span>` : "",
    w ? `<span class="chip ${w.level === "expired" ? "" : w.level === "soon" ? "chip-orange" : "chip-green"}">${icon("shield")}${esc(w.label)}</span>` : "",
    a.acquired === "gift" ? `<span class="chip chip-gold">${icon("gift")}A gift</span>` : "",
    a.receipt ? `<span class="chip">${icon("doc")}Receipt kept</span>` : "",
  ].filter(Boolean).join("");

  return `<div class="view">
    ${isParted ? `<div class="card card-pad" style="margin-bottom:var(--s5);border-color:var(--line-strong);background:var(--paper-sunk)">
      <div class="row gap3"><span class="attn-icon" style="background:var(--surface);color:var(--ink-3)">${icon("archive")}</span>
      <div><b>Parted with — ${esc(a.partedHow || "released")} ${esc(fmtDate(a.partedOn, "long"))}</b>
      <div class="t-sm muted">${esc(a.partedTo || "")}</div></div></div>
      ${a.partedNote ? `<p class="prose" style="margin-top:var(--s4)">${esc(a.partedNote)}</p>` : ""}
    </div>` : ""}

    <div class="page-head">
      <div class="row gap4" style="align-items:flex-start">
        <div style="min-width:0;flex:1">
          <div class="eyebrow">${esc(a.brand || "—")} <span style="opacity:.5">·</span> <a href="#/collection/${a.coll}">${esc(collName(a.coll))}</a></div>
          <h1 class="page-title" style="margin-top:6px">${esc(a.name)}</h1>
          ${a.model ? `<p class="page-sub mono">${esc(a.model)}</p>` : ""}
          <div class="row-wrap" style="margin-top:var(--s4)">${chips}</div>
        </div>
        <div class="row gap2">
          <button class="btn btn-icon" data-act="fav" data-id="${a.id}" title="${a.favorite ? "Remove from favourites" : "Add to favourites"}" style="${a.favorite ? "color:var(--gold)" : ""}">${a.favorite ? iconFilled("heart") : icon("heart")}</button>
          <button class="btn" data-act="edit-asset" data-id="${a.id}">${icon("edit")}Edit</button>
          <button class="btn btn-icon" data-act="asset-more" data-id="${a.id}" title="More">${icon("chevronDown")}</button>
        </div>
      </div>
    </div>

    <div class="detail">
      <div>
        <div class="detail-gallery" style="margin-bottom:var(--s7)">
          <div class="detail-hero" data-act="lightbox" data-id="${a.id}" data-i="${active}">
            <div class="art">${photoFrame(a, photos[active], { big: true })}</div>
          </div>
          <div class="thumbs">
            ${photos.map((p, i) => `<button class="thumb ${i === active ? "is-active" : ""}" data-act="go" data-href="#/asset/${a.id}?p=${i}" aria-label="View ${i + 1}">
              <div class="art">${photoFrame(a, p)}</div></button>`).join("")}
            <button class="thumb thumb-add" data-act="add-photo" data-id="${a.id}" title="Add a photograph">${icon("plus")}</button>
          </div>
        </div>

        ${(a.purpose || a.reason || a.story) ? `<section class="section">
          ${a.purpose ? `<div style="margin-bottom:var(--s6)">
            <div class="eyebrow" style="margin-bottom:var(--s3)">Purpose</div>
            <p class="quote">${esc(a.purpose)}</p></div>` : ""}
          ${a.reason ? `<div style="margin-bottom:var(--s6)">
            <div class="eyebrow" style="margin-bottom:var(--s3)">Why I bought it</div>
            <p class="prose">${esc(a.reason)}</p></div>` : ""}
          ${a.story ? `<div>
            <div class="eyebrow" style="margin-bottom:var(--s3)">The story behind it</div>
            <p class="prose">${esc(a.story)}</p></div>` : ""}
        </section>` : `<section class="card card-pad" style="margin-bottom:var(--s7)">
          <div class="row gap3">${icon("quill")}<div><b>No intention recorded</b>
          <p class="t-sm muted">Why did you buy this? What is it for? A year from now, this is the part you will wish you had written down.</p></div></div>
          <button class="btn btn-sm" style="margin-top:var(--s4)" data-act="edit-asset" data-id="${a.id}">Write it now</button>
        </section>`}

        <section class="section">
          <div class="section-head"><div><h2 class="section-title">Memories</h2>
            <div class="section-sub">${mems.length ? mems.length + " moment" + (mems.length === 1 ? "" : "s") + " attached to this object" : "Objects hold time. Attach the moments this one has been part of."}</div></div>
            <div class="spacer"></div>
            <button class="btn btn-sm" data-act="add-memory" data-id="${a.id}">${icon("plus")}Add memory</button></div>
          ${mems.length ? `<div class="panel"><div class="panel-body flush">
            ${mems.map((m) => `<div class="mem-card">
              <div class="mem-art"><div class="art">${artFor(m.id, (findColl(a.coll) || {}).hue, { letter: m.place || a.brand })}</div></div>
              <div class="mem-body">
                <div class="row gap2" style="margin-bottom:6px">
                  <span class="eyebrow">${esc(MEMORY_KINDS[m.kind] || "A moment")}</span>
                  <span class="muted t-xs">· ${esc(fmtDate(m.date, "medium"))}${m.place ? " · " + esc(m.place) : ""}</span>
                  <div class="spacer" style="flex:1"></div>
                  <button class="btn btn-ghost btn-sm" data-act="del-memory" data-id="${a.id}" data-mid="${m.id}" title="Remove">${icon("x")}</button>
                </div>
                <div class="mem-quote">${esc(m.title)}</div>
                <p class="prose t-sm" style="margin-top:6px">${esc(m.body)}</p>
              </div></div>`).join("")}
          </div></div>` : ""}
        </section>

        ${(a.care || (a.service || []).length) ? `<section class="section">
          <div class="section-head"><div><h2 class="section-title">Care &amp; service</h2>
            <div class="section-sub">What keeps this object alive</div></div>
            <div class="spacer"></div>
            <button class="btn btn-sm" data-act="log-service" data-id="${a.id}">${icon("wrench")}Log service</button></div>
          ${a.care ? `<div class="card card-pad" style="margin-bottom:var(--s4)">
            <div class="eyebrow" style="margin-bottom:var(--s2)">Maintenance notes</div>
            <p class="prose">${esc(a.care)}</p></div>` : ""}
          ${(a.service || []).length ? `<div class="panel"><div class="panel-body flush">
            ${a.service.slice().sort(by((s) => s.date, -1)).map((s) => `<div class="rowitem">
              <span class="attn-icon" style="background:var(--paper-sunk);color:var(--ink-3)">${icon("wrench")}</span>
              <div class="row-main"><div class="row-title">${esc(s.what)}</div>
                <div class="row-sub">${esc(fmtDate(s.date, "medium"))}${s.where ? " · " + esc(s.where) : ""}</div></div>
              <div class="row-end num">${s.cost ? money(s.cost) : "no charge"}</div></div>`).join("")}
          </div></div>` : ""}
        </section>` : `<section class="section">
          <div class="section-head"><div><h2 class="section-title">Care &amp; service</h2>
            <div class="section-sub">Nothing recorded yet</div></div><div class="spacer"></div>
            <button class="btn btn-sm" data-act="log-service" data-id="${a.id}">${icon("wrench")}Log service</button></div>
        </section>`}

        ${(related.length || replaces || replacedBy) ? `<section class="section">
          <div class="section-head"><div><h2 class="section-title">Related</h2>
            <div class="section-sub">Objects that belong with this one</div></div></div>
          ${replaces ? `<div class="card card-pad" style="margin-bottom:var(--s3)">
            <div class="eyebrow" style="margin-bottom:6px">Succeeds</div>
            ${assetRow(replaces, `<span class="chip chip-plain">${esc(replaces.status === "parted" ? "parted with" : "still owned")}</span>`)}</div>` : ""}
          ${replacedBy ? `<div class="card card-pad" style="margin-bottom:var(--s3)">
            <div class="eyebrow" style="margin-bottom:6px">Succeeded by</div>${assetRow(replacedBy)}</div>` : ""}
          ${related.length ? `<div class="grid g3">${related.map((r) => assetCard(r)).join("")}</div>` : ""}
        </section>` : ""}
      </div>

      <aside class="stack gap4">
        <div class="panel">
          <div class="panel-body">
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <div><div class="eyebrow">Current value</div>
                <div class="num" style="font-size:30px;line-height:1.2">${money(a.value)}</div></div>
              <div style="text-align:right"><div class="eyebrow">Paid</div>
                <div class="num" style="font-size:18px">${money(a.price)}</div></div>
            </div>
            <div style="margin-top:var(--s4)">${a.price ? deltaChip(a) : ""}</div>
            <hr class="rule" style="margin:var(--s4) 0">
            <dl class="stack">
              <div class="stat-line"><dt>Owned for</dt><dd>${esc(durationWords(daysBetween(a.purchaseDate, isParted ? a.partedOn : iso(Date.now()))))}<small>${esc(fmtDate(a.purchaseDate, "medium"))}</small></dd></div>
              ${!isParted && a.price ? `<div class="stat-line"><dt>Cost per year</dt><dd>${money(costPerYear(a))}</dd></div>
              <div class="stat-line"><dt>Cost per use</dt><dd>${money(costPerUse(a), { cents: costPerUse(a) < 10 })}<small>est. ${USES_PER_YEAR[a.usage] || 12} uses a year</small></dd></div>` : ""}
            </dl>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Stewardship</h3><div class="spacer"></div>
            <span class="num" style="font-size:16px">${st.score}<span class="muted" style="font-size:12px">/100</span></span></div>
          <div class="panel-body">
            <div class="meter meter-lg ${st.score >= 75 ? "green" : st.score >= 45 ? "" : "orange"}"><i style="width:${st.score}%"></i></div>
            <div class="stack gap2" style="margin-top:var(--s4)">
              ${st.parts.map((p) => `<div class="row gap2 t-sm" style="color:${p.ok ? "var(--ink-2)" : "var(--ink-4)"}">
                <span style="color:${p.ok ? "var(--green)" : "var(--ink-4)"};width:14px;display:inline-flex">${p.ok ? icon("check") : icon("x")}</span>
                <span>${esc(p.k)}</span></div>`).join("")}
            </div>
            <p class="hint" style="margin-top:var(--s4)">How well this object is kept — not how much it is worth.</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Maintenance</h3><div class="spacer"></div>
            <button class="btn btn-ghost btn-sm" data-act="add-task" data-id="${a.id}">${icon("plus")}Add</button></div>
          <div class="panel-body flush">
            ${tasks.length ? tasks.map((t) => taskRow(t, { compact: true })).join("")
              : `<div class="empty" style="padding:var(--s6) var(--s5)">${icon("calendar")}<p class="t-sm">No reminders set for this object.</p></div>`}
            ${done.length ? `<div class="rowitem"><span class="t-xs muted">${done.length} completed reminder${done.length === 1 ? "" : "s"} in history</span></div>` : ""}
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Record</h3></div>
          <div class="panel-body">
            <dl class="spec-list">
              ${spec("Brand", a.brand)}
              ${spec("Model", a.model, "mono")}
              ${spec("Collection", `<a href="#/collection/${a.coll}">${esc(collName(a.coll))}</a>`, "", true)}
              ${spec("Acquired", a.acquired === "gift" ? "Received as a gift" : a.acquired === "inherited" ? "Inherited" : a.acquired === "made" ? "Made it myself" : "Purchased")}
              ${spec("Purchase date", fmtDate(a.purchaseDate, "long"))}
              ${spec("Purchase price", a.price ? money(a.price) : "—")}
              ${spec("Store", a.store)}
              ${spec("Serial number", a.serial, "mono")}
              ${spec("Warranty", a.warrantyUntil ? fmtDate(a.warrantyUntil, "long") + (a.warrantyNote ? ` <span class="muted">— ${esc(a.warrantyNote)}</span>` : "") : "", "", true)}
              ${spec("Receipt", a.receipt ? "Kept" : "Not kept")}
              ${spec("Condition", a.condition)}
              ${spec("Usage", a.usage ? "Used " + a.usage : "")}
              ${spec("Storage location", a.location)}
              ${spec("Replacement plan", a.replacement)}
            </dl>
            ${(a.tags || []).length ? `<div class="row-wrap" style="margin-top:var(--s4)">
              ${a.tags.map((t) => `<a class="chip" href="#/search?q=${encodeURIComponent("#" + t)}">${icon("tag")}${esc(t)}</a>`).join("")}</div>` : ""}
          </div>
        </div>
      </aside>
    </div>
  </div>`;
};

function spec(label, value, cls = "", raw = false) {
  if (!value) return "";
  return `<div class="spec"><dt>${esc(label)}</dt><dd class="${cls}">${raw ? value : esc(value)}</dd></div>`;
}

function taskRow(t, opts = {}) {
  const a = findAsset(t.asset);
  const d = daysUntil(t.due);
  const tone = t.done ? "" : d < 0 ? "chip-red" : d <= 14 ? "chip-orange" : "chip-plain";
  const meta = TASK_TYPES[t.type] || TASK_TYPES.service;
  return `<div class="task ${t.done ? "is-done" : ""}">
    <button class="task-check" data-act="complete-task" data-id="${t.id}" aria-label="Mark complete">${icon("check")}</button>
    <div style="min-width:0;flex:1">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        ${opts.compact ? "" : `<a href="#/asset/${t.asset}">${esc(a ? a.name : "—")}</a>`}
        <span class="chip ${tone}">${esc(t.done ? "completed" : (d < 0 ? "overdue " : "due ") + relative(t.due))}</span>
        <span>${esc(meta.label)}</span>
        ${t.every ? `<span>· every ${esc(durationWords(t.every))}</span>` : ""}
      </div>
      ${t.notes && !opts.compact ? `<p class="t-sm muted" style="margin-top:6px;max-width:70ch">${esc(t.notes)}</p>` : ""}
    </div>
    <button class="btn btn-ghost btn-sm" data-act="del-task" data-id="${t.id}" title="Remove reminder">${icon("x")}</button>
  </div>`;
}

/* Timeline ---------------------------------------------------------------- */

VIEWS.timeline = () => {
  const filter = route.params.get("k") || "all";
  const events = [];
  state.assets.forEach((a) => {
    events.push({ date: a.purchaseDate, kind: "acquired", a, title: a.name,
      text: a.acquired === "gift" ? "Received as a gift" : a.acquired === "inherited" ? "Inherited" : `Acquired from ${a.store || "—"}`, amount: a.price });
    if (a.status === "parted" && a.partedOn) events.push({ date: a.partedOn, kind: "parted", a, title: a.name, text: a.partedNote || a.partedTo || "" });
    (a.service || []).forEach((s) => events.push({ date: s.date, kind: "service", a, title: s.what, text: s.where || "", amount: s.cost }));
    (a.memories || []).forEach((m) => events.push({ date: m.date, kind: "memory", a, title: m.title, text: m.body, place: m.place }));
  });
  const shown = events.filter((e) => filter === "all" || e.kind === filter).sort(by((e) => e.date, -1));
  const years = {};
  shown.forEach((e) => { const y = String(e.date).slice(0, 4); (years[y] = years[y] || []).push(e); });
  const ykeys = Object.keys(years).sort((x, y) => y.localeCompare(x));
  const kinds = [["all", "Everything"], ["acquired", "Acquisitions"], ["memory", "Memories"], ["service", "Service"], ["parted", "Parted with"]];

  return `<div class="view">
    <div class="page-head">
      <h1 class="page-title">Timeline</h1>
      <p class="page-sub">A lifetime of decisions, in order. Every acquisition, every repair, every letting-go.</p>
    </div>
    <div class="filters">
      <div class="seg">${kinds.map(([k, l]) => `<button class="${filter === k ? "is-on" : ""}" data-act="go" data-href="#/timeline?k=${k}">${l}</button>`).join("")}</div>
      <div class="spacer" style="flex:1"></div>
      <span class="t-sm muted">${shown.length} events across ${ykeys.length} years</span>
    </div>

    <div class="tl">
      ${ykeys.map((y) => {
        const evs = years[y];
        const spend = sum(evs.filter((e) => e.kind === "acquired"), (e) => e.amount);
        const adds = evs.filter((e) => e.kind === "acquired").length;
        return `<div class="tl-year">
          <div class="tl-year-label">${esc(y)}
            <span class="tl-year-meta">${adds ? adds + " acquired · " + money(spend, { compact: true }) : evs.length + " events"}</span>
          </div>
          ${evs.map((e) => timelineItem(e)).join("")}
        </div>`;
      }).join("")}
    </div>
  </div>`;
};

function timelineItem(e) {
  const label = { acquired: "Acquired", memory: "Memory", service: "Service", parted: "Parted with" }[e.kind];
  return `<div class="tl-item">
    <div class="row gap4" style="align-items:flex-start">
      <a href="#/asset/${e.a.id}" class="row-thumb" style="width:56px;height:56px;border-radius:var(--r-sm);overflow:hidden;flex:none">${coverFor(e.a)}</a>
      <div style="min-width:0;flex:1">
        <div class="tl-date">${esc(fmtDate(e.date, "day"))} · ${esc(label)}${e.place ? " · " + esc(e.place) : ""}</div>
        <a href="#/asset/${e.a.id}"><div class="row-title" style="font-family:var(--serif);font-size:17px;margin-top:2px">${esc(e.title)}</div></a>
        ${e.kind !== "acquired" || e.text ? `<p class="t-sm muted clamp-2" style="max-width:74ch;margin-top:2px">${esc(e.text)}</p>` : ""}
        ${e.kind !== "acquired" ? `<div class="t-xs muted" style="margin-top:2px">${esc(e.a.name)}</div>` : ""}
      </div>
      ${e.amount ? `<div class="num" style="font-size:15px;white-space:nowrap">${money(e.amount)}</div>` : ""}
    </div>
  </div>`;
}

/* Maintenance ------------------------------------------------------------- */

VIEWS.care = () => {
  const open = state.tasks.filter((t) => !t.done).sort(by((t) => t.due));
  const overdue = open.filter((t) => daysUntil(t.due) < 0);
  const soon = open.filter((t) => { const d = daysUntil(t.due); return d >= 0 && d <= 30; });
  const later = open.filter((t) => daysUntil(t.due) > 30);
  const completed = state.tasks.filter((t) => t.done || (t.history || []).length)
    .flatMap((t) => (t.history || []).map((h) => ({ t, at: h.date }))).sort(by((x) => x.at, -1));
  const warranties = owned().map((a) => ({ a, w: warrantyState(a) })).filter((x) => x.w && x.w.level !== "active").sort(by((x) => x.w.days));

  const group = (title, sub, list, tone) => `<section class="section">
    <div class="section-head"><div><h2 class="section-title">${esc(title)}</h2><div class="section-sub">${esc(sub)}</div></div>
      <div class="spacer"></div><span class="chip ${tone || "chip-plain"}">${list.length}</span></div>
    ${list.length ? `<div class="panel"><div class="panel-body flush">${list.map((t) => taskRow(t)).join("")}</div></div>`
      : `<div class="panel"><div class="empty" style="padding:var(--s6)">${icon("check")}<p class="t-sm">Nothing here.</p></div></div>`}
  </section>`;

  return `<div class="view">
    <div class="page-head">
      <div class="row"><div>
        <h1 class="page-title">Maintenance</h1>
        <p class="page-sub">Objects do not last because they were expensive. They last because someone looked after them.</p>
      </div><div class="topbar-spacer"></div>
      <button class="btn" data-act="add-task">${icon("plus")}New reminder</button></div>
    </div>

    <div class="tiles" style="margin-bottom:var(--s7)">
      <div class="tile"><span class="tile-accent" style="background:var(--red)"></span>
        <div class="tile-label">Overdue</div><div class="tile-value">${overdue.length}</div>
        <div class="tile-meta">${overdue.length ? "oldest " + relative(overdue[0].due) : "nothing overdue"}</div></div>
      <div class="tile"><div class="tile-label">Due within 30 days</div><div class="tile-value">${soon.length}</div>
        <div class="tile-meta">${soon.length ? "next " + relative(soon[0].due) : "a clear month"}</div></div>
      <div class="tile"><div class="tile-label">Scheduled later</div><div class="tile-value">${later.length}</div>
        <div class="tile-meta">across ${uniq(open.map((t) => t.asset)).length} objects</div></div>
      <div class="tile"><div class="tile-label">Care logged</div><div class="tile-value">${sum(state.assets, (a) => (a.service || []).length) + completed.length}</div>
        <div class="tile-meta">services and completions on record</div></div>
    </div>

    ${group("Overdue", "Past due — these are the ones that cost money later", overdue, "chip-red")}
    ${group("Due soon", "The next thirty days", soon, "chip-orange")}
    ${group("Scheduled", "Further out — nothing to do yet", later)}

    ${warranties.length ? `<section class="section">
      <div class="section-head"><div><h2 class="section-title">Warranty watch</h2>
        <div class="section-sub">Cover that has ended or is about to</div></div></div>
      <div class="panel"><div class="panel-body flush">
        ${warranties.slice(0, 8).map((x) => assetRow(x.a, `<span class="chip ${x.w.level === "soon" ? "chip-orange" : "chip-plain"}">${esc(x.w.level === "soon" ? "ends " + relative(x.a.warrantyUntil) : "expired")}</span>`)).join("")}
      </div></div>
    </section>` : ""}

    ${completed.length ? `<section class="section">
      <div class="section-head"><div><h2 class="section-title">Recently completed</h2>
        <div class="section-sub">A record of care given</div></div></div>
      <div class="panel"><div class="panel-body flush">
        ${completed.slice(0, 10).map((x) => {
          const a = findAsset(x.t.asset);
          return `<div class="rowitem"><span class="attn-icon" style="background:var(--green-wash);color:var(--green)">${icon("check")}</span>
            <div class="row-main"><div class="row-title">${esc(x.t.title)}</div>
              <div class="row-sub">${esc(a ? a.name : "")} · ${esc(fmtDate(x.at, "medium"))}</div></div></div>`;
        }).join("")}
      </div></div>
    </section>` : ""}
  </div>`;
};

/* Value ------------------------------------------------------------------- */

function chartPanel(title, sub, chartHtml, tableHtml) {
  return `<div class="panel">
    <div class="panel-head"><h3>${esc(title)}</h3><div class="spacer"></div>
      <span class="t-sm muted desktop-only">${esc(sub || "")}</span>
      <div class="seg"><button class="is-on" data-act="chart-mode" data-mode="chart">Chart</button><button data-act="chart-mode" data-mode="table">Table</button></div></div>
    <div class="panel-body"><div data-pane="chart">${chartHtml}</div><div data-pane="table" hidden>${tableHtml}</div></div>
  </div>`;
}

VIEWS.value = () => {
  const list = owned();
  const growth = growthSeries();
  const colls = collectionStats().filter((c) => c.count).sort(by((c) => -c.value));
  const years = purchasesByYear();
  const valued = list.filter((a) => a.price > 0);
  const gained = valued.filter((a) => delta(a) > 0).sort(by((a) => -delta(a)));
  const lost = valued.filter((a) => delta(a) < 0).sort(by((a) => delta(a)));
  const net = totalValue() - totalPaid();
  const byValue = list.slice().sort(by((a) => -a.value));
  const oldest = list.slice().sort(by((a) => a.purchaseDate));
  const spentThisYear = sum(state.assets.filter((a) => String(a.purchaseDate).slice(0, 4) === String(new Date().getFullYear())), (a) => a.price);

  return `<div class="view">
    <div class="page-head">
      <h1 class="page-title">Value</h1>
      <p class="page-sub">What the library is worth, what it cost, and what that difference actually means. Financial value is one measure among several — it is not the important one.</p>
    </div>

    <div class="tiles" style="margin-bottom:var(--s7)">
      <div class="tile"><span class="tile-accent"></span><div class="tile-label">Current value</div>
        <div class="tile-value">${money(totalValue(), { compact: true })}</div>
        <div class="tile-meta">${list.length} objects held today</div></div>
      <div class="tile"><div class="tile-label">Total paid</div>
        <div class="tile-value">${money(totalPaid(), { compact: true })}</div>
        <div class="tile-meta">${money(spentThisYear)} committed this year</div></div>
      <div class="tile"><div class="tile-label">Net change</div>
        <div class="tile-value" style="color:${net >= 0 ? "var(--green)" : "var(--ink)"}">${net >= 0 ? "+" : "−"}${money(Math.abs(net), { compact: true })}</div>
        <div class="tile-meta">${net >= 0 ? "+" : "−"}${Math.abs((net / (totalPaid() || 1)) * 100).toFixed(0)}% against purchase price</div></div>
      <a class="tile" href="#/asset/${byValue[0] ? byValue[0].id : ""}"><div class="tile-label">Most valuable</div>
        <div class="tile-value" style="font-size:20px;line-height:1.3">${esc(byValue[0] ? fullName(byValue[0]) : "—")}</div>
        <div class="tile-meta">${byValue[0] ? money(byValue[0].value) : ""}</div></a>
    </div>

    <section class="section">
      ${chartPanel("Growth over time", "cumulative committed value, monthly",
        areaChart(growth, { height: 260 }),
        `<div class="table-wrap"><table class="data"><thead><tr><th>Month</th><th class="r">Objects</th><th class="r">Committed</th></tr></thead><tbody>
          ${growth.slice().reverse().slice(0, 24).map((p) => `<tr><td>${esc(fmtDate(p.x, "short"))}</td><td class="r">${p.n}</td><td class="r">${money(p.y)}</td></tr>`).join("")}
        </tbody></table></div>`)}
    </section>

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      ${chartPanel("Where the value sits", "by collection",
        rankedBars(colls.map((c) => ({ label: c.name, v: c.value, href: "#/collection/" + c.id })), { fmt: (r) => money(r.v, { compact: true }) }),
        `<table class="data"><thead><tr><th>Collection</th><th class="r">Objects</th><th class="r">Value</th><th class="r">Share</th></tr></thead><tbody>
          ${colls.map((c) => `<tr><td>${esc(c.name)}</td><td class="r">${c.count}</td><td class="r">${money(c.value)}</td><td class="r">${((c.value / (totalValue() || 1)) * 100).toFixed(1)}%</td></tr>`).join("")}
        </tbody></table>`)}

      ${chartPanel("Committed by year", "purchase price, by year of acquisition",
        barChart(years.map((y) => ({ label: y.year, v: y.spend, count: y.count })), { height: 240, fmt: (d) => `<b>${d.label}</b><br>${money(d.v)} · ${d.count} object${d.count === 1 ? "" : "s"}` }),
        `<table class="data"><thead><tr><th>Year</th><th class="r">Objects</th><th class="r">Committed</th></tr></thead><tbody>
          ${years.slice().reverse().map((y) => `<tr><td>${esc(y.year)}</td><td class="r">${y.count}</td><td class="r">${money(y.spend)}</td></tr>`).join("")}
        </tbody></table>`)}
    </div>

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      <div class="panel">
        <div class="panel-head"><h3>Holding or gaining value</h3><div class="spacer"></div>
          <span class="chip chip-green">${gained.length}</span></div>
        <div class="panel-body flush">
          ${gained.length ? gained.slice(0, 6).map((a) => assetRow(a, `<span class="chip chip-green">+${money(delta(a))}</span><div class="row-sub" style="margin-top:3px">+${deltaPct(a).toFixed(0)}%</div>`)).join("")
            : `<div class="empty" style="padding:var(--s6)"><p class="t-sm">Nothing has appreciated — which is normal, and fine.</p></div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Depreciating fastest</h3><div class="spacer"></div>
          <span class="t-sm muted">since purchase</span></div>
        <div class="panel-body flush">
          ${lost.slice(0, 6).map((a) => assetRow(a, `<span class="chip">−${money(Math.abs(delta(a)))}</span><div class="row-sub" style="margin-top:3px">−${Math.abs(deltaPct(a)).toFixed(0)}%</div>`)).join("")}
        </div>
      </div>
    </div>

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      <div class="panel">
        <div class="panel-head"><h3>Most valuable objects</h3></div>
        <div class="panel-body flush">${byValue.slice(0, 6).map((a) => assetRow(a)).join("")}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Longest held</h3><div class="spacer"></div><span class="t-sm muted">the quiet achievement</span></div>
        <div class="panel-body flush">
          ${oldest.slice(0, 6).map((a) => assetRow(a, `<div class="num">${esc(durationWords(daysBetween(a.purchaseDate, iso(Date.now()))))}</div><div class="row-sub">${money(costPerYear(a))}/yr</div>`)).join("")}
        </div>
      </div>
    </div>

    <div class="card card-pad">
      <div class="row gap3" style="align-items:flex-start">
        <span class="attn-icon" style="background:var(--gold-wash);color:var(--gold-ink)">${icon("scales")}</span>
        <div><b>A note on these numbers</b>
          <p class="prose t-sm" style="margin-top:6px;max-width:70ch">Current values are your own estimates, not appraisals. They exist to inform insurance cover and repair-versus-replace decisions — not to turn a home into a portfolio. The objects that matter most in this library are rarely the ones at the top of this page.</p></div>
      </div>
    </div>
  </div>`;
};

/* Memories ---------------------------------------------------------------- */

  const kind = route.params.get("k") || "all";
  const all = allMemories();
  const shown = all.filter((m) => kind === "all" || m.kind === kind);
  const years = {};
  shown.forEach((m) => { const y = String(m.date).slice(0, 4); (years[y] = years[y] || []).push(m); });
  const ykeys = Object.keys(years).sort((a, b) => b.localeCompare(a));
  const places = uniq(all.map((m) => m.place).filter(Boolean));

  return `<div class="view">
    <div class="page-head">
      <h1 class="page-title">Memories</h1>
      <p class="page-sub">Some possessions are valuable because of money. These are valuable for other reasons — where they came from, who gave them, what was happening at the time.</p>
    </div>

    <div class="tiles" style="margin-bottom:var(--s7)">
      <div class="tile"><span class="tile-accent"></span><div class="tile-label">Moments kept</div>
        <div class="tile-value">${all.length}</div><div class="tile-meta">across ${uniq(all.map((m) => m.asset.id)).length} objects</div></div>
      <div class="tile"><div class="tile-label">Places</div><div class="tile-value">${places.length}</div>
        <div class="tile-meta clamp-2">${esc(places.slice(0, 5).join(" · "))}</div></div>
      <div class="tile"><div class="tile-label">Objects with a story</div>
        <div class="tile-value">${owned().filter((a) => a.story || (a.memories || []).length).length}<span class="unit"> of ${owned().length}</span></div>
        <div class="tile-meta">the rest are still just things</div></div>
      <div class="tile"><div class="tile-label">Gifts held</div>
        <div class="tile-value">${owned().filter((a) => a.acquired === "gift").length}</div>
        <div class="tile-meta">objects chosen by someone else</div></div>
    </div>

    <div class="filters">
      <div class="seg">
        <button class="${kind === "all" ? "is-on" : ""}" data-act="go" data-href="#/memories">Everything</button>
        ${Object.entries(MEMORY_KINDS).map(([k, l]) => `<button class="${kind === k ? "is-on" : ""}" data-act="go" data-href="#/memories?k=${k}">${esc(l)}</button>`).join("")}
      </div>
    </div>

    ${shown.length ? ykeys.map((y) => `<section class="section">
      <div class="section-head"><h2 class="section-title">${esc(y)}</h2><div class="spacer"></div>
        <span class="t-sm muted">${years[y].length} moment${years[y].length === 1 ? "" : "s"}</span></div>
      <div class="panel"><div class="panel-body flush">
        ${years[y].map((m) => `<div class="mem-card">
          <a class="mem-art" href="#/asset/${m.asset.id}"><div class="art">${coverFor(m.asset)}</div></a>
          <div class="mem-body">
            <div class="row gap2" style="margin-bottom:4px">
              <span class="eyebrow">${esc(MEMORY_KINDS[m.kind] || "A moment")}</span>
              <span class="t-xs muted">· ${esc(fmtDate(m.date, "medium"))}${m.place ? " · " + esc(m.place) : ""}</span>
            </div>
            <div class="mem-quote">${esc(m.title)}</div>
            <p class="prose t-sm" style="margin-top:6px;max-width:74ch">${esc(m.body)}</p>
            <a class="chip" style="margin-top:var(--s3)" href="#/asset/${m.asset.id}">${esc(m.asset.name)}</a>
          </div></div>`).join("")}
      </div></div>
    </section>`).join("") : emptyState("No memories yet", "Open any object and attach the moment it belongs to.")}
  </div>`;
};

/* Wishlist ---------------------------------------------------------------- */

const PRIORITY = { high: "Considering seriously", medium: "Worth revisiting", low: "Just noted" };

VIEWS.wishlist = () => {
  const tab = route.params.get("s") || "considering";
  const all = state.wishlist;
  const list = all.filter((w) => w.status === tab);
  const considering = all.filter((w) => w.status === "considering");
  const totalIf = sum(considering, (w) => w.price);
  const declined = all.filter((w) => w.status === "declined");
  const saved = sum(declined, (w) => w.price);
  const avgDays = considering.length ? Math.round(sum(considering, (w) => daysBetween(w.addedAt, iso(Date.now()))) / considering.length) : 0;
  const ready = considering.filter((w) => readiness(w).score >= 80).length;

  return `<div class="view">
    <div class="page-head">
      <div class="row"><div>
        <h1 class="page-title">Wishlist</h1>
        <p class="page-sub">A waiting room, not a shopping cart. Things sit here until wanting them survives a month of ordinary days.</p>
      </div><div class="topbar-spacer"></div>
      <button class="btn" data-act="new-wish">${icon("plus")}Add something</button></div>
    </div>

    <div class="tiles" style="margin-bottom:var(--s7)">
      <div class="tile"><span class="tile-accent"></span><div class="tile-label">Under consideration</div>
        <div class="tile-value">${considering.length}</div><div class="tile-meta">${money(totalIf)} if every one were bought</div></div>
      <div class="tile"><div class="tile-label">Average time on the list</div>
        <div class="tile-value">${avgDays}<span class="unit"> days</span></div>
        <div class="tile-meta">the longer, the more honest the wanting</div></div>
      <div class="tile"><div class="tile-label">Ready to decide</div><div class="tile-value">${ready}</div>
        <div class="tile-meta">cooling-off complete, reflection done</div></div>
      <div class="tile"><div class="tile-label">Let go of</div>
        <div class="tile-value">${money(saved, { compact: true })}</div>
        <div class="tile-meta">${declined.length} item${declined.length === 1 ? "" : "s"} decided against</div></div>
    </div>

    <div class="filters">
      <div class="seg">
        ${[["considering", "Considering"], ["ready", "Ready"], ["acquired", "Acquired"], ["declined", "Let go"]].map(([k, l]) =>
          `<button class="${tab === k ? "is-on" : ""}" data-act="go" data-href="#/wishlist?s=${k}">${l} <span class="muted">${all.filter((w) => w.status === k).length}</span></button>`).join("")}
      </div>
    </div>

    ${list.length ? `<div class="panel"><div class="panel-body flush">
      ${list.slice().sort(by((w) => -readiness(w).score)).map((w) => {
        const r = readiness(w);
        const c = findColl(w.coll);
        return `<div class="wish-card">
          <a class="wish-art" href="#/wish/${w.id}"><div class="art">${artFor(w.id, c ? c.hue : 40, { letter: w.brand || w.name })}</div></a>
          <div style="min-width:0">
            <div class="row gap2" style="margin-bottom:2px">
              <span class="eyebrow">${esc(w.brand || "")}</span>
              <span class="chip ${w.need === "need" ? "chip-green" : w.need === "both" ? "chip-gold" : "chip-plain"}">${esc(w.need === "need" ? "Need" : w.need === "both" ? "Need and want" : "Want")}</span>
              <span class="chip chip-plain">${esc(PRIORITY[w.priority] || "")}</span>
            </div>
            <a href="#/wish/${w.id}"><div class="coll-name" style="font-size:18px">${esc(w.name)}</div></a>
            <p class="t-sm muted clamp-2" style="margin-top:4px;max-width:72ch">${esc(w.reason)}</p>
            <div class="row gap3" style="margin-top:var(--s3);max-width:420px">
              <div style="flex:1"><div class="meter ${r.score >= 80 ? "green" : r.score >= 45 ? "" : "orange"}"><i style="width:${r.score}%"></i></div></div>
              <span class="t-xs muted" style="white-space:nowrap">${r.days} day${r.days === 1 ? "" : "s"} on the list</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="num" style="font-size:20px">${money(w.price)}</div>
            <a class="btn btn-sm" style="margin-top:var(--s2)" href="#/wish/${w.id}">Consider →</a>
          </div>
        </div>`;
      }).join("")}
    </div></div>` : emptyState(
      tab === "declined" ? "Nothing let go of yet" : tab === "acquired" ? "Nothing has graduated yet" : "The list is empty",
      tab === "considering" ? "That is a good sign, not an empty state." : "Items you decide on will appear here.")}

    <div class="card card-pad" style="margin-top:var(--s7)">
      <div class="row gap3" style="align-items:flex-start">
        <span class="attn-icon" style="background:var(--gold-wash);color:var(--gold-ink)">${icon("compass")}</span>
        <div><b>How this list works</b>
          <p class="prose t-sm" style="margin-top:6px;max-width:72ch">Nothing moves into the library until it has sat here for thirty days and you have answered seven questions about it. The questions are not a test — most of them have no wrong answer. They exist because wanting something and having thought about it are different states, and only one of them lasts.</p></div>
      </div>
    </div>
  </div>`;
};

  const c = findColl(w.coll);
  const answered = Object.keys(w.reflections || {}).length;
  const cheapest = (w.alternatives || []).slice().sort(by((x) => x.price))[0];
  const similar = owned().filter((a) => a.coll === w.coll).sort(by((a) => -a.value)).slice(0, 3);

  return `<div class="view">
    <div class="detail">
      <div>
        <div class="page-head">
          <div class="eyebrow">${esc(w.brand || "")} <span style="opacity:.5">·</span> ${esc(c ? c.name : "")}</div>
          <h1 class="page-title" style="margin-top:6px">${esc(w.name)}</h1>
          <div class="row-wrap" style="margin-top:var(--s4)">
            <span class="chip ${w.need === "need" ? "chip-green" : w.need === "both" ? "chip-gold" : "chip-plain"}">${esc(w.need === "need" ? "A need" : w.need === "both" ? "Need and want" : "A want")}</span>
            <span class="chip">${esc(PRIORITY[w.priority])}</span>

              <div class="row-end num">${money(w.price)}</div></div>
          </div></div>
        </section>` : ""}

        ${w.notes ? `<section class="section">
          <div class="eyebrow" style="margin-bottom:var(--s3)">Notes</div>
          <p class="prose">${esc(w.notes)}</p>
        </section>` : ""}

            <p class="prose t-sm" style="max-width:68ch">The questions ask why you want it, whether you will still want it in a year, what it replaces, whether it improves your life or only your surroundings, whether it matches what you say you value, whether regret is anywhere in the picture, and what happens if you wait three more months.</p>

          <div class="section-head"><div><h2 class="section-title">What you already own here</h2>

      <aside class="stack gap4">

          <div class="cover cover-wide"><div class="cover-inner">${artFor(w.id + ":hero", c ? c.hue : 40, { letter: w.brand || w.name, big: true })}</div></div>
          <div class="panel-body">
            <div class="eyebrow">Estimated price</div>
            <div class="num" style="font-size:30px;line-height:1.2">${money(w.price)}</div>
            <div class="t-sm muted" style="margin-top:6px">${w.price ? money(w.price / 60, { cents: true }) + " a month across five years of use" : ""}</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Purchase readiness</h3><div class="spacer"></div>
            <span class="num" style="font-size:16px">${r.score}<span class="muted" style="font-size:12px">/100</span></span></div>
          <div class="panel-body">

            <div class="stack gap2" style="margin-top:var(--s4)">

                <span style="color:${p.ok ? "var(--green)" : "var(--ink-4)"};width:14px;display:inline-flex">${p.ok ? icon("check") : icon("clock")}</span>
                <span>${esc(p.k)}${p.note ? ` <span class="muted">— ${esc(p.note)}</span>` : ""}</span></div>`).join("")}

            <button class="btn" data-act="decline-wish" data-id="${w.id}">${icon("archive")}Decide against it</button>
            <button class="btn btn-ghost" data-act="edit-wish" data-id="${w.id}">${icon("edit")}Edit details</button>
          </div>
        </div>
      </aside>
    </div>

};

/* Gallery ----------------------------------------------------------------- */

VIEWS.gallery = () => {
  const mode = route.params.get("m") || "grid";
  const collFilter = route.params.get("c") || "";
  let list = owned();
  if (collFilter) list = list.filter((a) => a.coll === collFilter);
  list = list.slice().sort(by((a) => a.purchaseDate, -1));
  const modes = [["grid", "Grid"], ["editorial", "Editorial"], ["collection", "By collection"], ["timeline", "By year"], ["large", "Large"]];

  const body = () => {
    if (!list.length) return emptyState("Nothing to show", "Add an object and it will appear here.");
    if (mode === "editorial") {
      return `<div class="editorial">${list.slice(0, 24).map((a) => `
        <article class="ed-item">
          <a class="ed-media" href="#/asset/${a.id}"><div class="art">${coverFor(a)}</div></a>
          <div class="ed-figure">
            <div class="eyebrow">${esc(a.brand || collName(a.coll))} · ${esc(fmtDate(a.purchaseDate, "short"))}</div>
            <h3 class="display" style="font-size:30px;margin:var(--s3) 0">${esc(a.name)}</h3>
            <p class="prose clamp-3">${esc(a.story || a.purpose || a.reason || "No story recorded yet.")}</p>
            <div class="row-wrap" style="margin-top:var(--s4)">
              ${a.favorite ? `<span class="chip chip-gold">${iconFilled("heart")}Favourite</span>` : ""}
              <span class="chip">${esc(a.condition)}</span>
              <a class="chip" href="#/asset/${a.id}">Open ${icon("arrowRight")}</a>
            </div>
          </div>
        </article>`).join("")}</div>`;
    }
    if (mode === "collection") {
      return collectionStats().filter((c) => c.count && (!collFilter || c.id === collFilter)).map((c) => `
        <section class="section">
          <div class="section-head"><div><h2 class="section-title">${esc(c.name)}</h2>
            <div class="section-sub">${c.count} objects · ${money(c.value, { compact: true })}</div></div>
            <div class="spacer"></div><a class="btn btn-sm" href="#/collection/${c.id}">Open collection</a></div>
          <div class="grid g4">${c.items.slice().sort(by((a) => a.purchaseDate, -1)).map((a) => assetCard(a)).join("")}</div>
        </section>`).join("");
    }
    if (mode === "timeline") {
      const years = {};
      list.forEach((a) => { const y = String(a.purchaseDate).slice(0, 4); (years[y] = years[y] || []).push(a); });
      return Object.keys(years).sort((a, b) => b.localeCompare(a)).map((y) => `
        <section class="section">
          <div class="section-head"><h2 class="section-title">${esc(y)}</h2><div class="spacer"></div>
            <span class="t-sm muted">${years[y].length} acquired · ${money(sum(years[y], (a) => a.price), { compact: true })}</span></div>
          <div class="grid g4">${years[y].map((a) => assetCard(a)).join("")}</div>
        </section>`).join("");
    }
    if (mode === "large") {
      return `<div class="stack gap6">${list.slice(0, 20).map((a) => `
        <a href="#/asset/${a.id}" class="card" style="overflow:hidden">
          <div class="cover" style="aspect-ratio:21/9"><div class="cover-inner">${coverFor(a, { big: true })}</div></div>
          <div class="card-pad row gap4">
            <div style="flex:1;min-width:0">
              <div class="eyebrow">${esc(a.brand || "")}</div>
              <h3 class="display" style="font-size:24px;margin-top:4px">${esc(a.name)}</h3>
              <p class="t-sm muted clamp-2" style="margin-top:4px;max-width:70ch">${esc(a.purpose || a.story || "")}</p>
            </div>
            <div style="text-align:right"><div class="num" style="font-size:20px">${money(a.value)}</div>
              <div class="t-sm muted">${esc(fmtDate(a.purchaseDate, "short"))}</div></div>
          </div></a>`).join("")}</div>`;
    }
    return `<div class="masonry">${list.map((a, i) => `
      <a href="#/asset/${a.id}" class="card" style="overflow:hidden;display:block">
        <div class="cover ${i % 3 === 1 ? "cover-tall" : i % 5 === 0 ? "cover-wide" : ""}"><div class="cover-inner">${coverFor(a)}</div>
          ${a.favorite ? `<span class="cover-fav">${iconFilled("heart")}</span>` : ""}</div>
        <div class="asset-body"><div class="asset-brand truncate">${esc(a.brand || collName(a.coll))}</div>
          <div class="asset-name">${esc(a.name)}</div></div></a>`).join("")}</div>`;
  };

  return `<div class="view">
    <div class="page-head">
      <h1 class="page-title">Gallery</h1>
      <p class="page-sub">The library, seen rather than listed.</p>
    </div>
    <div class="filters">
      <div class="seg">${modes.map(([k, l]) => `<button class="${mode === k ? "is-on" : ""}" data-act="go" data-href="#/gallery?m=${k}${collFilter ? "&c=" + collFilter : ""}">${l}</button>`).join("")}</div>
      <div class="spacer" style="flex:1"></div>
      <select class="select" data-act="gallery-coll">
        <option value="">All collections</option>
        ${state.collections.map((c) => `<option value="${c.id}" ${collFilter === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
      </select>
    </div>
    ${body()}
  </div>`;
};

VIEWS.insights = () => {
  const list = owned();
  const gone = parted();
  const years = purchasesByYear();
  const colls = collectionStats().filter((c) => c.count);
  const mostCategory = colls.slice().sort(by((c) => -c.count))[0];
  const avgHold = list.length ? sum(list, (a) => daysBetween(a.purchaseDate, iso(Date.now()))) / list.length : 0;
  const partedHold = gone.length ? sum(gone, (a) => daysBetween(a.purchaseDate, a.partedOn)) / gone.length : 0;
  const expensive = list.slice().sort(by((a) => -a.price))[0];
  const oldest = list.slice().sort(by((a) => a.purchaseDate))[0];
  const bestValue = list.filter((a) => a.price > 30).slice().sort(by((a) => costPerUse(a)));
  const meaningful = list.slice().sort(by((a) => -(((a.memories || []).length * 3) + (a.favorite ? 2 : 0) + (a.story ? 1 : 0))));
  const usageDist = USAGE.map((u, i) => ({ label: u[0].toUpperCase() + u.slice(1), v: list.filter((a) => a.usage === u).length, color: `var(--ramp-${5 - i})` }));
  const condDist = CONDITIONS.map((c, i) => ({ label: c[0].toUpperCase() + c.slice(1), v: list.filter((a) => a.condition === c).length, color: `var(--ramp-${i + 1})` }));
  const serviceSpend = sum(state.assets, (a) => sum(a.service || [], (s) => s.cost));
  const serviceCount = sum(state.assets, (a) => (a.service || []).length);
  const gifts = list.filter((a) => a.acquired === "gift");
  const noIntent = list.filter((a) => !a.reason && !a.purpose);
  const tags = allTags();
  const review = reviewCandidates();

  const insight = (k, t) => `<div class="insight"><div class="insight-k">${k}</div><div class="insight-t">${t}</div></div>`;

  return `<div class="view">
    <div class="page-head">
      <h1 class="page-title">Statistics</h1>
      <p class="page-sub">What the record reveals about how you actually own things — as opposed to how you think you do.</p>
    </div>

    <div class="grid g3 gap4 stagger" style="margin-bottom:var(--s7)">
      ${insight(durationWords(avgHold), `Average time an object has been in the library. ${gone.length ? `Objects you have parted with were held ${esc(durationWords(partedHold))} on average.` : ""}`)}
      ${insight(esc(mostCategory ? mostCategory.name : "—"), `Your largest collection — ${mostCategory ? mostCategory.count : 0} objects, ${mostCategory ? ((mostCategory.count / list.length) * 100).toFixed(0) : 0}% of everything you own.`)}
      ${insight(money(expensive ? expensive.price : 0), `Most committed to a single object: ${esc(expensive ? fullName(expensive) : "—")}, ${esc(expensive ? fmtDate(expensive.purchaseDate, "short") : "")}.`)}
      ${insight(esc(oldest ? String(oldest.purchaseDate).slice(0, 4) : "—"), `Oldest object still held: ${esc(oldest ? fullName(oldest) : "—")}, ${esc(oldest ? durationWords(daysBetween(oldest.purchaseDate, iso(Date.now()))) : "")} in your keeping.`)}
      ${insight(serviceCount + "", `Repairs and services logged, ${money(serviceSpend)} spent keeping things alive rather than replacing them.`)}
      ${insight(list.filter((a) => a.favorite).length + "", `Objects marked as ones you would not replace — ${((list.filter((a) => a.favorite).length / (list.length || 1)) * 100).toFixed(0)}% of the library.`)}
    </div>

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      <div class="panel">
        <div class="panel-head"><h3>How often things are actually used</h3></div>
        <div class="panel-body">
          ${rankedBars(usageDist, { fmt: (r) => r.v + (r.v === 1 ? " object" : " objects") })}
          <p class="hint" style="margin-top:var(--s4)">${list.filter((a) => a.usage === "rarely" || a.usage === "seasonal").length} objects are used seasonally or rarely. That is not automatically a problem — but it is worth knowing.</p>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Condition of the library</h3></div>
        <div class="panel-body">
          ${rankedBars(condDist, { fmt: (r) => r.v + (r.v === 1 ? " object" : " objects") })}
          <p class="hint" style="margin-top:var(--s4)">Worn is not a failure state. Several of the objects here are meant to wear — leather, denim, waxed cotton and aluminium all get better at it.</p>
        </div>
      </div>
    </div>

    <section class="section">
      <div class="section-head"><div><h2 class="section-title">Acquisitions by year</h2>
        <div class="section-sub">How many objects entered the library each year</div></div></div>
      <div class="panel"><div class="panel-body">
        ${barChart(years.map((y) => ({ label: y.year, v: y.count, spend: y.spend })), { height: 200, fmt: (d) => `<b>${d.label}</b><br>${d.v} object${d.v === 1 ? "" : "s"} · ${money(d.spend)}` })}
      </div></div>
    </section>

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      <div class="panel">
        <div class="panel-head"><h3>Best value by use</h3><div class="spacer"></div><span class="t-sm muted">cost per use</span></div>
        <div class="panel-body flush">
          ${bestValue.slice(0, 6).map((a) => assetRow(a, `<div class="num">${money(costPerUse(a), { cents: costPerUse(a) < 10 })}</div><div class="row-sub">per use</div>`)).join("")}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Most meaningful</h3><div class="spacer"></div><span class="t-sm muted">by memories kept</span></div>
        <div class="panel-body flush">
          ${meaningful.slice(0, 6).map((a) => assetRow(a, `<div class="num">${(a.memories || []).length}</div><div class="row-sub">memor${(a.memories || []).length === 1 ? "y" : "ies"}</div>`)).join("")}
        </div>
      </div>
    </div>

    ${review.length ? `<section class="section">
      <div class="section-head"><div><h2 class="section-title">Worth reconsidering</h2>
        <div class="section-sub">High cost per use, no favourite status. Not a verdict — a question.</div></div>
        <div class="spacer"></div><button class="btn btn-sm" data-act="review">${icon("scales")}Run a review</button></div>
      <div class="panel"><div class="panel-body flush">
        ${review.map((x) => assetRow(x.a, `<div class="num">${money(x.cpu, { cents: x.cpu < 10 })}</div><div class="row-sub">per use</div>`)).join("")}
      </div></div>
    </section>` : ""}

    <div class="grid g2 gap5" style="align-items:start;margin-bottom:var(--s7)">
      <div class="panel">
        <div class="panel-head"><h3>Where things live</h3></div>
        <div class="panel-body">
          ${rankedBars(Object.entries(list.reduce((m, a) => { const k = a.location || "Unrecorded"; m[k] = (m[k] || 0) + 1; return m; }, {}))
            .map(([label, v]) => ({ label, v })).sort(by((r) => -r.v)).slice(0, 8), { fmt: (r) => r.v + "" })}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Most used tags</h3></div>
        <div class="panel-body">
          <div class="row-wrap">${tags.slice(0, 22).map((t) => `<a class="chip" href="#/search?q=${encodeURIComponent("#" + t.tag)}">${esc(t.tag)} <span class="muted">${t.n}</span></a>`).join("")}</div>
        </div>
      </div>
    </div>

    <div class="grid g2 gap5" style="align-items:start">
      <div class="card card-pad">
        <div class="eyebrow">Given, not bought</div>
        <p class="display" style="font-size:26px;margin:var(--s3) 0">${gifts.length} object${gifts.length === 1 ? "" : "s"} in this library were chosen by someone else.</p>
        <p class="prose t-sm">${gifts.length ? esc(gifts.map((a) => a.name).join(", ")) + "." : "Nothing here was a gift — yet."}</p>
      </div>
      <div class="card card-pad">
        <div class="eyebrow">Unfinished record</div>
        <p class="display" style="font-size:26px;margin:var(--s3) 0">${noIntent.length} object${noIntent.length === 1 ? " has" : "s have"} no recorded reason for being here.</p>
        <p class="prose t-sm">${noIntent.length ? "You will not remember. Write it down while you still can — it takes a minute and it is the part that ages best." : "Every object in this library has a stated purpose. That is rare."}</p>
        ${noIntent.length ? `<a class="btn btn-sm" style="margin-top:var(--s4)" href="#/asset/${noIntent[0].id}">Start with the ${esc(noIntent[0].name)}</a>` : ""}
      </div>
    </div>
  </div>`;
};

/* Search ------------------------------------------------------------------ */

function searchAssets(q, filters = {}) {
  const terms = String(q || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
  let list = state.assets.slice();
  if (filters.coll) list = list.filter((a) => a.coll === filters.coll);
  if (filters.condition) list = list.filter((a) => a.condition === filters.condition);
  if (filters.usage) list = list.filter((a) => a.usage === filters.usage);
  if (filters.year) list = list.filter((a) => String(a.purchaseDate).slice(0, 4) === filters.year);
  if (filters.status !== "all") list = list.filter((a) => a.status !== "parted");
  return list.map((a) => {
    const hay = [a.name, a.brand, a.model, a.store, a.location, a.purpose, a.reason, a.story, a.care,
      a.serial, a.condition, a.usage, collName(a.coll), (a.tags || []).join(" "),
      (a.memories || []).map((m) => m.title + " " + m.body + " " + m.place).join(" ")].join(" ").toLowerCase();
    let score = 0;
    for (const t of terms) {
      const tag = t.startsWith("#") ? t.slice(1) : null;
      if (tag) { if ((a.tags || []).some((x) => x.toLowerCase().includes(tag))) score += 6; else return null; continue; }
      if (!hay.includes(t)) return null;
      if (a.name.toLowerCase().includes(t)) score += 5;
      if ((a.brand || "").toLowerCase().includes(t)) score += 3;
      if ((a.tags || []).some((x) => x.toLowerCase().includes(t))) score += 2;
      score += 1;
    }
    return { a, score };
  }).filter(Boolean).sort(by((x) => -x.score)).map((x) => x.a);
}

const layers = () => document.getElementById("layers");

function openModal(html, opts = {}) {
  const wrap = document.createElement("div");
  wrap.className = "scrim";
  wrap.dataset.layer = "modal";
  wrap.innerHTML = `<div class="modal ${opts.size ? "modal-" + opts.size : ""}" role="dialog" aria-modal="true">${html}</div>`;
  wrap.addEventListener("mousedown", (e) => { if (e.target === wrap) closeLayer(); });
  layers().appendChild(wrap);
  document.body.style.overflow = "hidden";
  const focusable = wrap.querySelector("input, textarea, select, button");
  if (focusable && !opts.noFocus) setTimeout(() => focusable.focus(), 60);
  wireCharts(wrap);
  return wrap;
}
function closeLayer() {
  const all = layers().children;
  if (all.length) all[all.length - 1].remove();
  if (!layers().children.length) document.body.style.overflow = "";
}
function closeAllLayers() { layers().innerHTML = ""; document.body.style.overflow = ""; }

function toast(msg, actionLabel, onAction) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ""}`;
  if (actionLabel) el.querySelector("button").onclick = () => { onAction && onAction(); el.remove(); };
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 420); }, actionLabel ? 7000 : 3600);
}

function confirmDialog({ title, body, confirm = "Confirm", danger = false, onConfirm }) {
  const w = openModal(`
    <div class="modal-head"><div><div class="modal-title">${esc(title)}</div>
      <div class="modal-sub">${esc(body)}</div></div></div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-confirm>${esc(confirm)}</button></div>`, { size: "sm" });
  w.querySelector("[data-confirm]").onclick = () => { closeLayer(); onConfirm(); };
}

function formData(root) {
  const out = {};
  root.querySelectorAll("[name]").forEach((el) => {
    if (el.type === "checkbox") out[el.name] = el.checked;
    else if (el.type === "number") out[el.name] = el.value === "" ? 0 : Number(el.value);
    else out[el.name] = el.value.trim();
  });
  return out;
}
const opts = (arr, sel) => arr.map((v) => `<option value="${attr(v)}" ${v === sel ? "selected" : ""}>${esc(v[0].toUpperCase() + v.slice(1))}</option>`).join("");

function reflectFlow(wishId, step = 0) {
  const wsh = findWish(wishId);
  if (!wsh) return;
  const q = REFLECTIONS[step];
  const done = step >= REFLECTIONS.length;
  if (done) {
    const r = readiness(wsh);
    openModal(`
      <div class="modal-head"><div><div class="modal-title">Reflection complete</div>
        <div class="modal-sub">${esc(wsh.name)} — ${r.days} days on the list</div></div></div>
      <div class="modal-body">
        <div class="meter meter-lg ${r.score >= 80 ? "green" : ""}" style="margin-bottom:var(--s5)"><i style="width:${r.score}%"></i></div>
        <dl class="spec-list">
          ${REFLECTIONS.map((qq) => wsh.reflections[qq.id] ? `<div class="spec" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)">
            <dt style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink-2)">${esc(qq.q)}</dt>
            <dd>${esc(wsh.reflections[qq.id])}</dd></div>` : "").join("")}
        </dl>
        <p class="prose t-sm" style="margin-top:var(--s5)">Read these again tomorrow before deciding. The answers written while wanting something rarely survive a second reading — and when they do, that is the signal.</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-act="close">Close</button>
        ${r.score >= 80 ? `<button class="btn btn-primary" data-act="acquire-wish" data-id="${wsh.id}">Bring into the library</button>` : ""}</div>`);
    return;
  }
  const current = wsh.reflections[q.id] || "";
  const w = openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="row gap3"><span class="eyebrow">Question ${step + 1} of ${REFLECTIONS.length}</span>
        <div class="progress-dots">${REFLECTIONS.map((_, i) => `<i class="${i <= step ? "is-on" : ""}"></i>`).join("")}</div></div>
      <div class="modal-title" style="margin-top:var(--s3)">${esc(q.q)}</div>
      <div class="modal-sub">${esc(q.help)}</div></div></div>
    <div class="modal-body">
      ${q.type === "scale"
        ? `<div class="scale">${q.options.map((o) => `<button type="button" class="${current === o ? "is-on" : ""}" data-answer="${attr(o)}">${esc(o)}</button>`).join("")}</div>`
        : `<textarea class="textarea" id="reflect-text" style="min-height:120px" placeholder="In your own words.">${esc(current)}</textarea>`}
      <p class="hint" style="margin-top:var(--s4)">${esc(wsh.name)} · ${money(wsh.price)} · ${readiness(wsh).days} days on the list</p>
    </div>
    <div class="modal-foot">
      ${step > 0 ? `<button class="btn" data-back>${icon("chevronLeft")}Back</button>` : ""}
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-act="close">Finish later</button>
      <button class="btn btn-primary" data-next>${step === REFLECTIONS.length - 1 ? "Complete" : "Next"}</button>
    </div>`, { noFocus: q.type === "scale" });

  const record = (val) => {
    if (val) mutate(() => (findWish(wishId).reflections[q.id] = val), { silent: true });
  };
  w.querySelectorAll("[data-answer]").forEach((b) => b.addEventListener("click", () => {
    record(b.getAttribute("data-answer"));
    closeLayer(); reflectFlow(wishId, step + 1);
  }));
  const nextBtn = w.querySelector("[data-next]");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    const ta = w.querySelector("#reflect-text");
    if (ta) record(ta.value.trim());
    else if (!findWish(wishId).reflections[q.id]) { toast("Choose an answer, or finish later."); return; }
    closeLayer(); reflectFlow(wishId, step + 1);
  });
  const backBtn = w.querySelector("[data-back]");
  if (backBtn) backBtn.addEventListener("click", () => { closeLayer(); reflectFlow(wishId, step - 1); });
}

function acquireWish(wishId) {

function lightbox(assetId, i = 0) {
  const a = findAsset(assetId);
  const photos = assetPhotos(a);
  let idx = clamp(i, 0, photos.length - 1);
  const el = document.createElement("div");
  el.className = "lightbox";
  el.dataset.layer = "lightbox";
  const paint = () => {
    el.innerHTML = `<button class="lb-close btn btn-ghost btn-icon" data-act="close">${icon("x")}</button>
      ${photos.length > 1 ? `<button class="lb-nav lb-prev btn btn-ghost btn-icon" data-prev>${icon("chevronLeft")}</button>
      <button class="lb-nav lb-next btn btn-ghost btn-icon" data-next>${icon("chevronRight")}</button>` : ""}
      <figure><div class="frame" style="aspect-ratio:4/3;width:min(1100px,92vw);position:relative">
        <div class="art">${photoFrame(a, photos[idx], { big: true })}</div></div>
        <figcaption>${esc(a.brand ? a.brand + " " + a.name : a.name)} · ${idx + 1} of ${photos.length}${photos[idx].caption ? " · " + esc(photos[idx].caption) : ""}</figcaption></figure>`;
    const p = el.querySelector("[data-prev]"), n = el.querySelector("[data-next]");
    if (p) p.onclick = (e) => { e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; paint(); };
    if (n) n.onclick = (e) => { e.stopPropagation(); idx = (idx + 1) % photos.length; paint(); };
  };
  paint();
  el.addEventListener("click", (e) => { if (e.target === el) closeLayer(); });
  layers().appendChild(el);
  document.body.style.overflow = "hidden";
}

/* Photos ------------------------------------------------------------------ */

function addPhoto(assetId) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.multiple = true;
  input.onchange = () => {
    const files = [...input.files].slice(0, 6);
    let pending = files.length;
    if (!pending) return;
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1400;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          const src = c.toDataURL("image/jpeg", 0.82);
          mutate(() => { const a = findAsset(assetId); a.photos = [...(a.photos || []), { id: uid("p"), src, caption: "" }]; },
            { silent: --pending > 0 });
          if (!pending) toast("Photograph added.");
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

/* Import / export --------------------------------------------------------- */

function exportLibrary() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ark-library-${iso(Date.now())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast("Library exported.");
}
function importLibrary() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.assets)) throw new Error("Not an ARK library");
        confirmDialog({
          title: "Replace this library?", danger: true, confirm: "Replace",
          body: `The imported file holds ${data.assets.length} objects. Everything currently stored in this browser will be replaced.`,
          onConfirm: () => { state = data; state.v = SCHEMA; save(); render(); toast("Library imported."); },
        });
      } catch (e) { toast("That file could not be read as an ARK library."); }
    };
    reader.readAsText(file);
  };
  input.click();
}
