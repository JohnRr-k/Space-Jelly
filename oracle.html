          (unlockDays>0?' <span class="dim">('+durationWords(unlockDays)+')</span>':"")+'</span></div>':"")+
        (d.final.at? '<div class="aside-line"><span class="k">Deliberated</span><span class="v">'+deliberationDays(d)+' days</span></div>':"")+
      '</div>'+
    '</div>'+

    '<div class="aside-block"><span class="eyebrow aside-k">Connected decisions</span>'+
      (linked.length||inbound.length ?
        '<div class="stack gap-8">'+
          linked.map(x=>'<a class="row gap-8" href="#/d/'+x.id+'" data-nav><i class="area-dot" style="background:'+area(x.area).color+'"></i>'+
            '<span class="grow" style="font-size:var(--t-small);line-height:1.4">'+esc(shorten(x.title,40))+'</span>'+
            '<button class="item-x" style="opacity:.5" data-act="unlink" data-v="'+x.id+'" aria-label="Remove link">'+ic("x","",11)+'</button></a>').join("")+
          inbound.map(x=>'<a class="row gap-8" href="#/d/'+x.id+'" data-nav style="opacity:.7"><i class="area-dot" style="background:'+area(x.area).color+'"></i>'+
            '<span class="grow" style="font-size:var(--t-small);line-height:1.4">'+esc(shorten(x.title,40))+'</span>'+
            '<span class="meta" style="font-size:9px">refers here</span></a>').join("")+
        '</div>' : '<p class="meta" style="font-size:var(--t-micro)">Nothing linked yet.</p>')+
      '<button class="mini-add" data-act="link-add" style="margin-top:10px">'+ic("link","",12)+' Link a decision</button>'+
    '</div>'+

    '<div class="aside-block" style="border-bottom:0">'+
      '<div class="stack gap-8">'+
        '<button class="btn sm" data-act="area-set">'+ic("grid","",13)+'Change life area</button>'+
        (d.status==="reviewed"? '<a class="btn sm" href="#/playback/'+d.id+'" data-nav>'+ic("replay","",13)+'Replay this decision</a>':"")+
        '<button class="btn sm" data-act="print">'+ic("file","",13)+'Print / export</button>'+
        '<button class="btn sm danger" data-act="delete">'+ic("trash","",13)+'Delete</button>'+
      '</div>'+
    '</div>';
}

/* ---------------------------------------------------------- thinking sections */
function sec(d, s, body){
  const done = s.filled(d);
  return '<section class="tsec'+(done?" filled":"")+'" id="s-'+s.id+'">'+
    '<div class="tsec-head"><span class="tsec-n">'+s.n+'</span><h2 class="tsec-title">'+esc(s.title)+'</h2></div>'+
    '<p class="tsec-ask">'+esc(s.ask)+'</p>'+
    '<div class="tsec-body">'+body+'</div>'+
  '</section>';
}
function SEC(id){ return SECTIONS.find(s=>s.id===id); }

/* Once a decision is committed the reasoning becomes a record rather than a draft.
   It can still be amended — but only deliberately, and the page says so. */
let AMEND = null;

function thinkingSpace(d){
  const sealed = !isOpen(d) && AMEND!==d.id;
  return '<div class="think">'+
    (isOpen(d) ? "" : sealBar(d, sealed)) +
    (sealed ? sealedSections(d) : editableSections(d)) +
    finalBlock(d) +
    reviewBlock(d) +
    (isOpen(d) ? commitBar(d) : "") +
  '</div>';
}
function sealBar(d, sealed){
  if(!sealed){
    return '<div class="sealbar amending no-print">'+ic("pen","",14)+
      '<span class="grow"><strong>You are amending a sealed record.</strong> '+
      'Correct what is wrong; do not improve what was merely naive. The naive version is the useful one.</span>'+
      '<button class="btn sm primary" data-act="amend-done">Done</button></div>';
  }
  return '<div class="sealbar no-print">'+ic("lock","",14)+
    '<span class="grow">Sealed on '+fmtDate(d.final.at,"long")+'. This is the reasoning future you will read, in the words you used at the time.</span>'+
    '<button class="btn sm" data-act="amend">Amend</button></div>';
}

/* --- the record, read-only ------------------------------------ */
function roProse(v, empty){
  return len(v) ? '<p class="prose">'+esc(v)+'</p>'
    : '<p class="prose" style="color:var(--faint);font-style:italic">'+esc(empty||"Left unwritten.")+'</p>';
}
function roField(label, v){
  return '<div><span class="eyebrow field-k">'+esc(label)+'</span>'+
    (len(v)? '<p class="prose" style="font-size:1rem">'+esc(v)+'</p>'
           : '<p class="prose" style="font-size:1rem;color:var(--faint);font-style:italic">Left unwritten.</p>')+'</div>';
}
function sealedSections(d){
  const letters = "ABCDEFGHIJKL";
  return sec(d, SEC("situation"), roProse(d.think.situation)) +
    sec(d, SEC("outcome"), roProse(d.think.outcome)) +
    sec(d, SEC("options"),
      (d.options.length? '<div class="stack gap-12">'+d.options.map((o,i)=>
        '<div class="opt'+(d.chosen===i?" chosen":"")+'">'+
          '<div class="opt-head"><span class="opt-letter">'+letters[i]+'</span>'+
            '<span class="grow"><span class="h3" style="display:block;line-height:1.45">'+esc(o.label)+'</span>'+
              (o.note?'<span class="meta" style="font-size:var(--t-small);font-family:var(--serif)">'+esc(o.note)+'</span>':"")+'</span>'+
            (d.chosen===i?'<span class="pill gold">chosen</span>':"")+
          '</div>'+
          ((o.pros.length||o.cons.length)? '<div class="opt-cols">'+
            '<div><span class="eyebrow">For</span><div class="pc-list">'+o.pros.map(t=>
              '<div class="pc-line"><span class="s" style="color:var(--moss)">+</span><span class="txt">'+esc(t)+'</span></div>').join("")+'</div></div>'+
            '<div><span class="eyebrow">Against</span><div class="pc-list">'+o.cons.map(t=>
              '<div class="pc-line"><span class="s" style="color:var(--clay)">−</span><span class="txt">'+esc(t)+'</span></div>').join("")+'</div></div>'+
          '</div>':"")+
        '</div>').join("")+'</div>' : roProse("", "No options were written down."))) +
    sec(d, SEC("cost"), roProse(d.think.cost)) +
    sec(d, SEC("risks"),
      '<div class="tsec-grid">'+roField("Short term", d.think.riskShort)+roField("Long term", d.think.riskLong)+'</div>'+
      '<div style="margin-top:22px">'+roField("Worst realistic case", d.think.riskWorst)+'</div>') +
    sec(d, SEC("benefits"),
      '<div class="tsec-grid">'+roField("Short term", d.think.benShort)+roField("Long term", d.think.benLong)+
      roField("Counted on", d.think.benExpected)+roField("Not counted on", d.think.benUnexpected)+'</div>') +
    sec(d, SEC("assumptions"),
      (d.assumptions.length? '<div class="items">'+d.assumptions.map((a,i)=>
        '<div class="item"><span class="item-mark">'+String(i+1).padStart(2,"0")+'</span>'+
          '<span class="item-body"><span class="prose" style="font-size:1rem">'+esc(a.text)+'</span>'+
          (len(a.ifWrong)?'<span class="item-sub"><span style="color:var(--clay);flex:none">If wrong →</span><span>'+esc(a.ifWrong)+'</span></span>':"")+
          '<span class="meta" style="font-size:var(--t-micro)">Believed at '+(a.confidence||50)+'%'+(a.confidence<=45?" — recorded as fragile":"")+'</span></span>'+
          '<span></span></div>').join("")+'</div>' : roProse("", "No assumptions were named."))) +
    sec(d, SEC("unknowns"),
      (d.unknowns.length? '<div class="items">'+d.unknowns.map(u=>
        '<div class="item"><span class="item-mark" style="color:'+(u.resolved?"var(--moss)":"var(--faint)")+'">'+(u.resolved?"✓":"○")+'</span>'+
          '<span class="item-body"><span class="prose" style="font-size:1rem;'+(u.resolved?"opacity:.6":"")+'">'+esc(u.text)+'</span>'+
          (len(u.how)?'<span class="item-sub"><span style="color:var(--gold);flex:none">Find out by →</span><span>'+esc(u.how)+'</span></span>':"")+'</span>'+
          '<span></span></div>').join("")+'</div>' : roProse("", "Nothing was recorded as unknown."))) +
    sec(d, SEC("evidence"),
      '<div class="tsec-grid">'+
        ['evidenceFor','evidenceAgainst'].map((k,n)=>
          '<div><span class="eyebrow field-k">'+(n?"Contradicting":"Supporting")+'</span><div class="pc-list">'+
          ((d[k]||[]).length? d[k].map(t=>'<div class="pc-line"><span class="s" style="color:var('+(n?"--clay":"--moss")+')">'+(n?"−":"+")+'</span>'+
            '<span class="txt" style="font-family:var(--serif);font-size:1rem;line-height:1.6">'+esc(t)+'</span></div>').join("")
            : '<span class="meta" style="font-style:italic;color:var(--faint)">None recorded.</span>')+
          '</div></div>').join("")+
      '</div>') +
    sec(d, SEC("second"), roProse(d.think.secondOrder)) +
    sec(d, SEC("reversibility"),
      '<div class="cols-side"><div>'+
        '<span class="eyebrow field-k">How reversible</span>'+
        '<p class="prose" style="font-size:1rem;margin-bottom:18px">'+esc(REVERSIBILITY[d.think.reversibility]||"—")+'</p>'+
        roField("What undoing it would cost", d.think.reverseCost)+
      '</div><div>'+reversibilityQuadrant(d)+'</div></div>') +
    sec(d, SEC("values"),
      (d.values.length? '<div class="row gap-8 wrapf" style="margin-bottom:16px">'+d.values.map(id=>{
        const v = byId(store.state.values,id);
        return v? '<span class="pill gold">'+esc(v.name)+'</span>' : "";
      }).join("")+'</div>':"")+
      roProse(d.think.valuesNote, "No values were attached to this one.")) +
    sec(d, SEC("future"), roProse(d.think.futureSelf));
}

function editableSections(d){
  return sec(d, SEC("situation"), ta(d,"think.situation","Set down the facts. Numbers where you have them, and the parts you would rather not write.")) +
    sec(d, SEC("outcome"), ta(d,"think.outcome","Describe the world you are trying to bring about — not the action, the result.")) +
    sec(d, SEC("options"), optionsBlock(d)) +
    sec(d, SEC("cost"), ta(d,"think.cost","Every yes is a no to something. Name it precisely enough that it stings a little.")) +
    sec(d, SEC("risks"),
      '<div class="tsec-grid">'+
        fieldTA(d,"think.riskShort","Short term","What could go wrong in the first months?","compact")+
        fieldTA(d,"think.riskLong","Long term","What could go wrong slowly, in a way you would not notice?","compact")+
      '</div>'+
      '<div style="margin-top:22px">'+
        '<span class="eyebrow field-k">Worst realistic case — a pre-mortem</span>'+
        ta(d,"think.riskWorst","It is two years from now and this went as badly as it plausibly could. Write the story of how. Then price it.")+
      '</div>') +
    sec(d, SEC("benefits"),
      '<div class="tsec-grid">'+
        fieldTA(d,"think.benShort","Short term","","compact")+
        fieldTA(d,"think.benLong","Long term","","compact")+
        fieldTA(d,"think.benExpected","What you are counting on","","compact")+
        fieldTA(d,"think.benUnexpected","What might arrive that you are not counting on","","compact")+
      '</div>') +
    sec(d, SEC("assumptions"), assumptionsBlock(d)) +
    sec(d, SEC("unknowns"), unknownsBlock(d)) +
    sec(d, SEC("evidence"), evidenceBlock(d)) +
    sec(d, SEC("second"), ta(d,"think.secondOrder","Not what happens. What happens after what happens — and which decisions this one opens or closes.")) +
    sec(d, SEC("reversibility"), reversibilityBlock(d)) +
    sec(d, SEC("values"), valuesBlock(d)) +
    sec(d, SEC("future"), futureBlock(d));
}

/* --- options ------------------------------------------------- */
function optionsBlock(d){
  const ranked = rankedOptions(d);
  const best = ranked.length?ranked[0].o.id:null;
  const letters = "ABCDEFGHIJKL";
  return '<div class="stack gap-12">'+
    d.options.map((o,i)=>{
      const score = optionScore(d,o);
      const isChosen = d.chosen===i;
      return '<div class="opt'+(isChosen?" chosen":"")+'" data-oi="'+i+'">'+
        '<div class="opt-head">'+
          '<span class="opt-letter">'+letters[i]+'</span>'+
          '<span class="grow">'+
            '<input class="opt-name" data-bind="options.'+i+'.label" value="'+esc(o.label)+'" placeholder="Describe the option in one line" />'+
            '<input class="inp" style="border:0;padding:0;height:auto;margin-top:5px;font-size:var(--t-small);color:var(--stone);font-family:var(--serif)" data-bind="options.'+i+'.note" value="'+esc(o.note||"")+'" placeholder="A detail worth remembering about this path" />'+
          '</span>'+
          '<span class="row gap-10" style="flex:none">'+
            (o.id===best&&d.options.length>1?'<span class="pill gold">leads on score</span>':"")+
            '<span class="num" style="font-size:var(--t-small);color:var(--stone)">'+score.toFixed(1)+'</span>'+
            '<button class="item-x" style="opacity:.5" data-act="opt-del" data-v="'+i+'" aria-label="Remove option">'+ic("x","",12)+'</button>'+
          '</span>'+
        '</div>'+
        '<div class="opt-cols">'+
          prosCons(d,i,"pros","For")+
          prosCons(d,i,"cons","Against")+
        '</div>'+
      '</div>';
    }).join("")+
    '<button class="addline" data-act="opt-add">'+ic("plus","",13)+'Add an option — including the one you keep refusing to consider</button>'+
    (d.options.length>=2? scoringMatrix(d) : "")+
  '</div>';
}
function prosCons(d,i,kind,label){
  const list = d.options[i][kind]||[];
  return '<div><span class="eyebrow">'+label+'</span>'+
    '<div class="pc-list">'+list.map((t,j)=>
      '<div class="pc-line"><span class="s" style="color:var('+(kind==="pros"?"--moss":"--clay")+')">'+(kind==="pros"?"+":"−")+'</span>'+
      '<span class="txt">'+esc(t)+'</span>'+
      '<button class="x" data-act="pc-del" data-v="'+i+":"+kind+":"+j+'" aria-label="Remove">'+ic("x","",10)+'</button></div>').join("")+
    '</div>'+
    '<button class="mini-add" data-act="pc-add" data-v="'+i+":"+kind+'">+ add</button>'+
  '</div>';
}
function scoringMatrix(d){
  const ranked = rankedOptions(d);
  const letters = "ABCDEFGHIJKL";
  return '<details style="margin-top:12px" open>'+
    '<summary class="eyebrow" style="cursor:pointer;padding:10px 0;list-style:none">Weighted comparison — score each option 0–10 against what actually matters</summary>'+
    '<div style="overflow-x:auto"><table class="matrix">'+
      '<thead><tr><th style="width:auto">Criterion <span class="dim">(weight)</span></th>'+
        d.options.map((o,i)=>'<th title="'+esc(o.label)+'">'+letters[i]+'</th>').join("")+'</tr></thead>'+
      '<tbody>'+d.criteria.map(c=>
        '<tr><td><span style="color:var(--ink-2)">'+esc(c.label)+'</span> '+
          '<input class="scorecell" style="width:34px;height:22px;display:inline-block;margin-left:6px" type="number" min="0" max="5" value="'+c.weight+'" data-weight="'+c.id+'" aria-label="Weight for '+esc(c.label)+'" /></td>'+
          d.options.map((o,i)=>'<td><input class="scorecell" type="number" min="0" max="10" value="'+(o.scores[c.id]!=null?o.scores[c.id]:"")+'" data-score="'+i+":"+c.id+'" aria-label="'+esc(c.label)+' for option '+letters[i]+'" /></td>').join("")+
        '</tr>').join("")+
      '<tr class="total"><td><strong>Weighted score</strong></td>'+
        d.options.map(o=>'<td><strong>'+optionScore(d,o).toFixed(1)+'</strong></td>').join("")+'</tr>'+
      '</tbody></table></div>'+
    '<p class="chart-note">'+
      (ranked.length>1 && (ranked[0].s-ranked[1].s)<0.6
        ? "The top two are within half a point. When the numbers cannot separate the options, the numbers are not the answer — go back to values and to what you would regret."
        : ranked.length? "The matrix says "+esc(shorten(ranked[0].o.label,60))+". Notice whether you feel relief or resistance reading that; the feeling is information too."
        : "")+'</p>'+
  '</details>';
}

/* --- assumptions / unknowns / evidence ----------------------- */
function assumptionsBlock(d){
  return '<div class="items">'+
    d.assumptions.map((a,i)=>
      '<div class="item"><span class="item-mark">'+String(i+1).padStart(2,"0")+'</span>'+
        '<span class="item-body">'+
          '<textarea class="ta compact" style="border-left:0;padding-left:0" data-bind="assumptions.'+i+'.text" rows="1" placeholder="What must be true?">'+esc(a.text)+'</textarea>'+
          '<span class="item-sub"><span style="color:var(--clay);flex:none">If wrong →</span>'+
            '<textarea class="ta compact grow" style="border-left:0;padding-left:0;font-family:var(--sans);font-size:var(--t-small);color:var(--stone)" data-bind="assumptions.'+i+'.ifWrong" rows="1" placeholder="then what happens, and what would you do?">'+esc(a.ifWrong||"")+'</textarea></span>'+
          '<span class="row gap-10" style="margin-top:2px">'+
            '<span class="meta" style="font-size:var(--t-micro)">Belief</span>'+
            '<span class="num" style="font-size:var(--t-micro);width:34px" data-slide-out="assumptions.'+i+'.confidence" data-suffix="%">'+(a.confidence||50)+'%</span>'+
            '<input class="slider" style="max-width:150px" type="range" min="0" max="100" value="'+(a.confidence||50)+'" data-slide="assumptions.'+i+'.confidence" />'+
            (a.confidence<=45?'<span class="pill clay">fragile</span>':"")+'</span>'+
        '</span>'+
        '<button class="item-x" data-act="assum-del" data-v="'+i+'" aria-label="Remove assumption">'+ic("x","",12)+'</button>'+
      '</div>').join("")+
    '<button class="addline" data-act="assum-add">'+ic("plus","",13)+'Name an assumption</button>'+
  '</div>';
}
function unknownsBlock(d){
  return '<div class="items">'+
    d.unknowns.map((u,i)=>
      '<div class="item"><button class="item-mark" data-act="unk-toggle" data-v="'+i+'" style="cursor:pointer;color:'+(u.resolved?"var(--moss)":"var(--faint)")+'" aria-label="Mark resolved">'+(u.resolved?ic("check","",13):"○")+'</button>'+
        '<span class="item-body">'+
          '<textarea class="ta compact" style="border-left:0;padding-left:0;'+(u.resolved?"opacity:.55;text-decoration:line-through":"")+'" data-bind="unknowns.'+i+'.text" rows="1" placeholder="What do you still not know?">'+esc(u.text)+'</textarea>'+
          '<span class="item-sub"><span style="color:var(--gold);flex:none">Find out by →</span>'+
            '<textarea class="ta compact grow" style="border-left:0;padding-left:0;font-family:var(--sans);font-size:var(--t-small);color:var(--stone)" data-bind="unknowns.'+i+'.how" rows="1" placeholder="the cheapest way to learn it">'+esc(u.how||"")+'</textarea></span>'+
        '</span>'+
        '<button class="item-x" data-act="unk-del" data-v="'+i+'" aria-label="Remove">'+ic("x","",12)+'</button>'+
      '</div>').join("")+
    '<button class="addline" data-act="unk-add">'+ic("plus","",13)+'Name something you do not know</button>'+
  '</div>';
}
function evidenceBlock(d){
  const col = (key,label,sign,color)=>
    '<div><span class="eyebrow field-k">'+label+'</span><div class="items">'+
      (d[key]||[]).map((t,i)=>'<div class="item" style="grid-template-columns:auto minmax(0,1fr) auto">'+
        '<span class="item-mark" style="color:var('+color+')">'+sign+'</span>'+
        '<span class="item-body"><textarea class="ta compact" style="border-left:0;padding-left:0" data-bind="'+key+'.'+i+'" rows="1">'+esc(t)+'</textarea></span>'+
        '<button class="item-x" data-act="ev-del" data-v="'+key+":"+i+'" aria-label="Remove">'+ic("x","",12)+'</button></div>').join("")+
      '<button class="addline" data-act="ev-add" data-v="'+key+'">'+ic("plus","",13)+'Add</button>'+
    '</div></div>';
  const nFor = (d.evidenceFor||[]).length, nAg = (d.evidenceAgainst||[]).length;
  return '<div class="tsec-grid">'+
      col("evidenceFor","Supporting","+","--moss")+
      col("evidenceAgainst","Contradicting","−","--clay")+
    '</div>'+
    (nFor>0 && nAg===0 ? '<p class="chart-note" style="border-top:0;color:var(--clay)">Every piece of evidence here supports the thing you already want. That is not evidence, it is advocacy. Find one fact that argues the other way.</p>' : "")+
    (nAg>nFor ? '<p class="chart-note" style="border-top:0">More against than for, and you are still considering it. Either the upside is very large or something unwritten is doing the arguing.</p>' : "");
}

/* --- reversibility ------------------------------------------- */
function reversibilityQuadrant(d){
  const others = store.state.decisions.filter(x=>x.id!==d.id);
  const rx = { easy:0.15, costly:0.42, hard:0.68, oneway:0.9 };
  const iy = { minor:0.85, moderate:0.62, significant:0.36, "life-shaping":0.12 };
  const dot = x => '<button class="node" title="'+esc(x.title)+'" data-act="goto" data-v="'+x.id+'" style="left:'+((rx[x.think.reversibility]||.5)*100)+'%;top:'+((iy[x.impact]||.5)*100)+'%;background:'+area(x.area).color+';opacity:.4"></button>';
  return '<span class="eyebrow field-k">Where it sits among the rest</span>'+
    '<div class="quad"><i class="axis h"></i><i class="axis v"></i>'+
      '<span class="qlab" style="left:0;top:0">Reversible<br/>and heavy</span>'+
      '<span class="qlab" style="right:0;top:0;text-align:right">One-way<br/>and heavy</span>'+
      '<span class="qlab" style="left:0;bottom:0">Reversible<br/>and light</span>'+
      '<span class="qlab" style="right:0;bottom:0;text-align:right">One-way<br/>and light</span>'+
      others.map(dot).join("")+
      '<span class="node me" style="left:'+((rx[d.think.reversibility]||.5)*100)+'%;top:'+((iy[d.impact]||.5)*100)+'%;background:'+area(d.area).color+'"></span>'+
    '</div>'+
    '<p class="meta" style="font-size:var(--t-micro);margin-top:9px;line-height:1.5">Decide the bottom-left quickly. Sit with the top-right.</p>';
}
function reversibilityBlock(d){
  return '<div class="cols-side">'+
    '<div>'+
      '<span class="eyebrow field-k">How reversible is it?</span>'+
      segRow("think.reversibility", d.think.reversibility, Object.keys(REVERSIBILITY).map(k=>[k,REVERSIBILITY[k]]))+
      '<div style="margin-top:20px"><span class="eyebrow field-k">What would undoing it cost?</span>'+
        ta(d,"think.reverseCost","In money, in time, in dignity. Be specific — a reversal you have priced is a reversal you can actually use.")+'</div>'+
      '<p class="chart-note">'+
        (d.think.reversibility==="easy"||d.think.reversibility==="costly"
          ? "Reversible decisions reward speed. If you have been sitting on this for weeks, the delay is costing more than the mistake would."
          : "A one-way door earns your slowness. This is the category where taking another month is almost always cheap.")+'</p>'+
    '</div>'+
    '<div>'+reversibilityQuadrant(d)+'</div>'+
  '</div>';
}

      '<p class="tsec-ask">Write it as though someone else will have to act on it. Then write why, for the version of you who reads this in four years and has forgotten everything.</p>'+
      '<div class="tsec-body">'+

          '<div class="row gap-8 wrapf">'+d.options.map((o,i)=>

          '</div></div>' : "")+

        '<div style="margin-top:22px"><span class="eyebrow field-k">The reason — this is the part you will forget</span>'+
          ta(d,"final.reason","Not a justification. The actual reasoning, including the part that is uncomfortable.")+'</div>'+
        '<div style="margin-top:22px"><span class="eyebrow field-k">Confidence at the moment of deciding — this becomes the prediction you are scored against</span>'+
          sliderRow("final.confidence", d.final.confidence==null?d.confidence:d.final.confidence, 0, 100, "%")+
        '</div>'+
      '</div>'+
    '</section>';
  }
  return '<section class="tsec filled" id="s-final">'+
    '<div class="tsec-head"><span class="tsec-n">14</span><h2 class="tsec-title">Final Decision</h2>'+
      '<span class="grow"></span><span class="meta" style="font-size:var(--t-micro)">'+fmtDate(d.final.at,"long")+'</span></div>'+
    '<div class="tsec-body">'+
      '<p class="prose" style="font-size:1.14rem;color:var(--ink)">'+esc(d.final.text)+'</p>'+
      '<div style="margin-top:22px"><span class="eyebrow field-k">Why</span>'+
        '<p class="prose" style="border-left:1px solid var(--gold);padding-left:18px">'+esc(d.final.reason)+'</p></div>'+
      '<div class="row gap-20 wrapf" style="margin-top:22px">'+

        '<span class="meta">Deliberated: <strong style="color:var(--ink)">'+deliberationDays(d)+' days</strong></span>'+
        (d.chosen!=null&&d.options[d.chosen]?'<span class="meta">Option '+letters[d.chosen]+'</span>':"")+

/* --- outcome review -------------------------------------------- */
function reviewBlock(d){
  const r = d.review;
  const head = '<div class="tsec-head"><span class="tsec-n">15</span><h2 class="tsec-title">Outcome Review</h2></div>';

  if(d.status==="exploring" || d.status==="deliberating"){
    return '<section class="tsec" id="s-review">'+head+
      '<p class="tsec-ask">This section opens after you commit, and stays sealed until enough time has passed for the outcome to mean something.</p></section>';
  }
  if(d.status==="released"){
    return '<section class="tsec" id="s-review">'+head+
      '<div class="tsec-body"><p class="prose">Released without deciding. There is no outcome to review — though the fact that you set it down is itself a result worth remembering.</p></div></section>';
  }
  if(!r.done){
    const days = daysFromNow(r.unlockAt);
    if(days>0){
      const total = Math.max(1, Math.round((D(r.unlockAt)-D(d.final.at))/MS_DAY));
      const elapsed = total-days;
      return '<section class="tsec" id="s-review">'+head+
        '<div class="tsec-body"><div class="lock">'+
          '<div class="ring">'+ring(clamp(elapsed/total*100,0,100), 76, 2)+'</div>'+
          '<h3 class="h2">Sealed for '+durationWords(days)+'</h3>'+
          '<p>You committed on '+fmtDate(d.final.at,"long")+' and set this to open on '+fmtDate(r.unlockAt,"long")+'. '+
            'Reviewing an outcome too early rewards luck and punishes patience. Let it run.</p>'+
          '<div class="row gap-10" style="justify-content:center;margin-top:20px">'+
            '<button class="btn" data-act="review-early">Open it early anyway</button>'+
            '<button class="btn ghost" data-act="review-reschedule">Change the date</button>'+
          '</div>'+
        '</div></div></section>';
    }
    return '<section class="tsec" id="s-review">'+head+
      '<p class="tsec-ask">The window is open. Answer from memory first, before scrolling up to read what you wrote — that gap is the most useful thing on this page.</p>'+
      '<div class="tsec-body">'+
        '<div style="margin-bottom:24px"><span class="eyebrow field-k">How accurate was your prediction? '+
          '<span class="dim">(you claimed '+(d.final.confidence||50)+'% confidence)</span></span>'+
          sliderRow("review.accuracy", r.accuracy==null?60:r.accuracy, 0, 100, "%")+'</div>'+
        '<div><span class="eyebrow field-k">What actually happened</span>'+ta(d,"review.happened","The facts, including the ones that are unflattering.")+'</div>'+
        '<div style="margin-top:22px"><span class="eyebrow field-k">What surprised you</span>'+ta(d,"review.surprise","Surprise is where the learning is. What did the world do that you had not modelled?")+'</div>'+
        '<div style="margin-top:22px"><span class="eyebrow field-k">Would you decide the same way again?</span>'+
          segRow("review.again", r.again, [["yes","Yes"],["yes-sooner","Yes, and sooner"],["modified","Yes, but differently"],["no","No"]])+'</div>'+
        '<div style="margin-top:22px"><span class="eyebrow field-k">How satisfied are you with the outcome?</span>'+
          sliderRow("review.satisfaction", r.satisfaction==null?3:r.satisfaction, 1, 5, " / 5")+'</div>'+
        '<div style="margin-top:22px"><span class="eyebrow field-k">Lessons — separate the decision from the outcome</span>'+
          ta(d,"review.lessons","A good decision can have a bad outcome. Which was this? What would you tell someone standing where you stood?")+'</div>'+
        '<div class="commitbar" style="margin-top:30px">'+
          '<div class="grow"><span class="h3" style="display:block;margin-bottom:4px">Close the loop</span>'+
          '<span class="meta" style="font-size:var(--t-small)">Filing the review moves this decision into the record and offers you a principle to keep.</span></div>'+
          '<button class="btn primary" data-act="review-file">File the review'+ic("arrow","",14)+'</button>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  const gap = (d.final.confidence||50) - r.accuracy;
  const p = d.principleId ? byId(store.state.principles, d.principleId) : null;
  const againLabel = { yes:"Yes", "yes-sooner":"Yes, and sooner", modified:"Yes, but differently", no:"No" }[r.again] || "—";
  return '<section class="tsec filled" id="s-review">'+
    '<div class="tsec-head"><span class="tsec-n">15</span><h2 class="tsec-title">Outcome Review</h2>'+
      '<span class="grow"></span><span class="meta" style="font-size:var(--t-micro)">'+fmtDate(r.at,"long")+'</span></div>'+
    '<div class="tsec-body">'+
      '<div class="row gap-24 wrapf" style="padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px">'+
        miniStat("Claimed", (d.final.confidence||"—")+"%")+
        miniStat("Actual", r.accuracy+"%")+
        miniStat("Gap", (gap>0?"+":"")+gap+" pts", Math.abs(gap)<=10?"moss":"clay")+
        miniStat("Satisfaction", (r.satisfaction||"—")+" / 5")+
        miniStat("Again?", againLabel, r.again==="no"?"clay":"moss")+
      '</div>'+
      '<div><span class="eyebrow field-k">What happened</span><p class="prose">'+esc(r.happened)+'</p></div>'+
      '<div style="margin-top:24px"><span class="eyebrow field-k">The surprise</span><p class="prose">'+esc(r.surprise)+'</p></div>'+
      '<div style="margin-top:24px"><span class="eyebrow field-k">Lessons</span>'+
        '<p class="prose" style="border-left:1px solid var(--gold);padding-left:18px">'+esc(r.lessons)+'</p></div>'+
      (p? '<div style="margin-top:28px;padding-top:24px;border-top:1px solid var(--line)">'+
          '<span class="eyebrow field-k">'+ic("quote","",12)+' The principle this produced</span>'+
          '<a href="#/wisdom" data-nav><p class="principle-text">'+esc(p.text)+'</p></a>'+
        '</div>'
        : '<div style="margin-top:28px"><button class="btn" data-act="distil">'+ic("spark","",14)+'Distil a principle from this</button></div>')+
      '<div class="row gap-10" style="margin-top:26px">'+
        '<a class="btn sm" href="#/playback/'+d.id+'" data-nav>'+ic("replay","",13)+'Replay this decision blind</a>'+
        '<button class="btn sm ghost" data-act="review-edit">Edit the review</button>'+
      '</div>'+
    '</div>'+
  '</section>';
}
function miniStat(k,v,tone){
  return '<div><span class="eyebrow" style="display:block;margin-bottom:4px">'+esc(k)+'</span>'+
    '<span class="'+(tone||"")+'" style="font-family:var(--serif);font-size:1.24rem">'+esc(v)+'</span></div>';
}

/* --- commit bar ------------------------------------------------ */
function commitBar(d){
  const gate = commitGate(d);
  const ok = gate.every(x=>x.ok);
  const remaining = gate.filter(x=>!x.ok);
  return '<div class="commitbar no-print">'+
    '<div class="grow">'+
      '<span class="h3" style="display:block;margin-bottom:6px">'+(ok?"Ready to commit":"Not ready yet")+'</span>'+
      (ok? '<span class="meta" style="font-size:var(--t-small)">Everything a decision of this weight deserves has been written down. Committing seals the reasoning and schedules the review.</span>'
         : '<div class="stack gap-4">'+remaining.map(x=>'<span class="meta" style="font-size:var(--t-small);color:var(--stone)">○ '+esc(x.label)+'</span>').join("")+'</div>')+
    '</div>'+
    '<div class="row gap-10">'+
      '<button class="btn" data-act="release">Release it</button>'+
      '<button class="btn primary" data-act="commit"'+(ok?"":" disabled")+'>Commit'+ic("arrow","",14)+'</button>'+
    '</div>'+
  '</div>';
}

/* ---------------------------------------------------------- MAP */
VIEWS.map = function(){
  const S = store.state;
  const edges = mapEdges();
  return '<div class="wrap wrap-wide">'+
    '<div class="page-head plain enter">'+
      '<span class="eyebrow">'+S.decisions.length+' decisions · '+edges.length+' connections</span>'+
      '<h1 class="display">Decision map</h1>'+
      '<p class="lead">No decision happens alone. Each one narrows or widens the ground the next one stands on. '+
        'Drag to rearrange, hover to trace an influence, click to open.</p>'+
    '</div>'+
    '<div class="mapstage" id="mapstage">'+
      '<svg id="mapsvg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet">'+
        '<g id="mapg"><g id="mapedges"></g><g id="mapnodes"></g></g>'+
      '</svg>'+
      '<div class="map-tools">'+
        '<button class="btn sm" data-act="map-reset">Recentre</button>'+
        '<button class="btn sm" data-act="map-shake">Settle again</button>'+
      '</div>'+
      '<div class="map-card" id="mapcard" style="display:none"></div>'+
    '</div>'+
    '<div class="row gap-16 wrapf" style="margin-top:18px">'+
      store.state.areas.filter(a=>S.decisions.some(d=>d.area===a.id)).map(a=>
        '<span class="area-tag"><i class="area-dot" style="background:'+a.color+'"></i>'+esc(a.name)+'</span>').join("")+
    '</div>'+
    '<p class="subtle" style="margin-top:14px;max-width:70ch">Node size follows importance; faded nodes are closed. '+
      'A line means one decision was made in the shadow of another — open any decision and use <em>Link a decision</em> to record a new relationship.</p>'+
  '</div>';
};
function mapEdges(){
  const seen = new Set(), out = [];
  store.state.decisions.forEach(d=> d.links.forEach(t=>{
    if(!store.decision(t)) return;
    const k = [d.id,t].sort().join("|");
    if(seen.has(k)) return; seen.add(k);
    out.push({ s:d.id, t:t });
  }));
  return out;
}

const MAP = { nodes:[], edges:[], tx:0, ty:0, k:1, raf:null, drag:null, pan:null };
VIEW_AFTER.map = function(){
  const svg = $("#mapsvg"); if(!svg) return;
  const rect = $("#mapstage").getBoundingClientRect();
  const W = Math.max(640, Math.round(rect.width)), H = Math.max(420, Math.round(rect.height));
  svg.setAttribute("viewBox", "0 0 "+W+" "+H);
  MAP.W = W; MAP.H = H; MAP.tx = 0; MAP.ty = 0; MAP.k = 1;
  const ds = store.state.decisions;
  MAP.edges = mapEdges();
  MAP.nodes = ds.map((d,i)=>{
    const ang = (i/ds.length)*Math.PI*2;
    return { id:d.id, d, x:W/2+Math.cos(ang)*W*0.3+(Math.random()-.5)*40, y:H/2+Math.sin(ang)*H*0.34+(Math.random()-.5)*40,
      vx:0, vy:0, r:6+d.importance*1.4, deg:0, w:shorten(d.title,26).length*5.3 };
  });
  const idx = {}; MAP.nodes.forEach(n=>idx[n.id]=n);
  MAP.edges.forEach(e=>{ if(idx[e.s]) idx[e.s].deg++; if(idx[e.t]) idx[e.t].deg++; });

  const K = Math.max(90, Math.sqrt((W*H)/Math.max(1,MAP.nodes.length)) * 0.62);
  drawMap();
  simulate(320);

  function step(heat){
    const nodes = MAP.nodes;
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.sqrt(dx*dx+dy*dy)||0.01;
        /* labels sit under the node, so keep more vertical room than horizontal */
        const min = a.r+b.r+40;
        let f = (K*K)/dist;
        if(dist<min) f += (min-dist)*0.9;
        const fx = (dx/dist)*f, fy = (dy/dist)*f*1.25;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    MAP.edges.forEach(e=>{
      const a = idx[e.s], b = idx[e.t]; if(!a||!b) return;
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.sqrt(dx*dx+dy*dy)||0.01;
      const f = (dist*dist)/K;
      const fx = (dx/dist)*f, fy = (dy/dist)*f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });
    nodes.forEach(n=>{
      n.vx += (W/2-n.x)*0.016; n.vy += (H/2-n.y)*0.027;
      if(MAP.drag && MAP.drag.node===n) { n.vx=0; n.vy=0; return; }
      const cap = 22*heat;
      n.x += clamp(n.vx,-cap,cap)*0.5; n.y += clamp(n.vy,-cap,cap)*0.5;
      n.vx *= 0.7; n.vy *= 0.7;
      n.x = clamp(n.x, Math.min(W/2, n.w/2+10), Math.max(W/2, W-n.w/2-10));
      n.y = clamp(n.y, n.r+22, H-n.r-34);
    });
  }
  function simulate(frames){
    cancelAnimationFrame(MAP.raf);
    let i = 0;
    (function loop(){
      step(Math.max(0.15, 1 - i/frames)); positionMap();
      if(++i<frames) MAP.raf = requestAnimationFrame(loop);
    })();
  }
  MAP._simulate = simulate;

  /* interaction */
  svg.addEventListener("pointerdown", e=>{
    const g = e.target.closest(".map-node");
    const pt = toLocal(e);
    if(g){
      MAP.drag = { node: MAP.nodes.find(n=>n.id===g.dataset.id), moved:false, ox:pt.x, oy:pt.y };
    } else {
      MAP.pan = { x:e.clientX, y:e.clientY, tx:MAP.tx, ty:MAP.ty };
      svg.classList.add("dragging");
    }
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e=>{
    if(MAP.drag){
      const pt = toLocal(e);
      MAP.drag.node.x = pt.x; MAP.drag.node.y = pt.y;
      if(Math.abs(pt.x-MAP.drag.ox)+Math.abs(pt.y-MAP.drag.oy) > 4) MAP.drag.moved = true;
      simulate(40);
    } else if(MAP.pan){
      MAP.tx = MAP.pan.tx + (e.clientX-MAP.pan.x);
      MAP.ty = MAP.pan.ty + (e.clientY-MAP.pan.y);
      applyTransform();
    }
  });
  svg.addEventListener("pointerup", e=>{
    if(MAP.drag && !MAP.drag.moved){ go("#/d/"+MAP.drag.node.id); }
    MAP.drag = null; MAP.pan = null; svg.classList.remove("dragging");
  });
  svg.addEventListener("pointerleave", ()=>{ MAP.drag=null; MAP.pan=null; svg.classList.remove("dragging"); });
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    MAP.k = clamp(MAP.k * (e.deltaY>0?0.93:1.075), 0.45, 2.6);
    applyTransform();
  }, { passive:false });
  svg.addEventListener("mouseover", e=>{
    const g = e.target.closest(".map-node"); if(!g) return;
    highlight(g.dataset.id);
  });
  svg.addEventListener("mouseout", e=>{ if(!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest(".map-node")) highlight(null); });

  function toLocal(e){
    const r = svg.getBoundingClientRect();
    const sx = W/r.width, sy = H/r.height;
    return { x:((e.clientX-r.left)*sx - MAP.tx)/MAP.k, y:((e.clientY-r.top)*sy - MAP.ty)/MAP.k };
  }
  function applyTransform(){
    $("#mapg").setAttribute("transform","translate("+MAP.tx+","+MAP.ty+") scale("+MAP.k+")");
  }
  MAP._applyTransform = applyTransform;

  function highlight(id){
    const card = $("#mapcard");
    if(!id){
      $$(".map-node").forEach(n=>n.classList.remove("cold","hot"));
      $$(".map-edge").forEach(n=>n.classList.remove("cold","hot"));
      card.style.display = "none"; return;
    }
    const near = new Set([id]);
    MAP.edges.forEach(e=>{ if(e.s===id) near.add(e.t); if(e.t===id) near.add(e.s); });
    $$(".map-node").forEach(n=>{
      n.classList.toggle("cold", !near.has(n.dataset.id));
      n.classList.toggle("hot", n.dataset.id===id);
    });
    $$(".map-edge").forEach(l=>{
      const on = l.dataset.s===id || l.dataset.t===id;
      l.classList.toggle("hot", on); l.classList.toggle("cold", !on);
    });
    const d = store.decision(id);
    card.style.display = "block";
    card.innerHTML = '<div class="row gap-10 wrapf" style="margin-bottom:9px">'+areaTag(d)+statusPill(d)+'</div>'+
      '<div class="h3" style="margin-bottom:6px;line-height:1.35">'+esc(d.title)+'</div>'+
      '<p class="meta clamp3" style="font-family:var(--serif);font-size:var(--t-small);line-height:1.55">'+esc(d.description||d.think.situation)+'</p>'+
      '<div class="row gap-12" style="margin-top:11px">'+
        '<span class="meta" style="font-size:var(--t-micro)">weight '+d.importance+'</span>'+
        '<span class="meta" style="font-size:var(--t-micro)">'+(near.size-1)+' connection'+(near.size-1===1?"":"s")+'</span>'+
        '<span class="meta" style="font-size:var(--t-micro);color:var(--gold)">click to open</span>'+
      '</div>';
  }
  MAP._highlight = highlight;

  function drawMap(){
    $("#mapedges").innerHTML = MAP.edges.map(e=>
      '<path class="map-edge" data-s="'+e.s+'" data-t="'+e.t+'" d="" fill="none" stroke-width="1"/>').join("");
    $("#mapnodes").innerHTML = MAP.nodes.map(n=>{
      const c = area(n.d.area).color;
      const label = shorten(n.d.title, 26);
      return '<g class="map-node" data-id="'+n.id+'" style="color:'+c+'">'+
        '<circle class="halo" r="'+(n.r+9)+'" stroke-width="1"/>'+
        '<circle r="'+n.r+'" fill="'+c+'" fill-opacity="'+(isClosed(n.d)?0.32:0.9)+'" stroke="'+c+'" stroke-width="1.2"/>'+
        (n.d.favorite?'<circle r="'+(n.r+3.5)+'" fill="none" stroke="'+c+'" stroke-width=".8" stroke-dasharray="2 3"/>':"")+
        '<circle class="hit" r="'+(n.r+14)+'"/>'+
        '<text text-anchor="middle" y="'+(n.r+16)+'" paint-order="stroke" stroke="var(--paper)" '+
          'stroke-width="3.5" stroke-linejoin="round">'+esc(label)+'</text>'+
      '</g>';
    }).join("");
    positionMap();
  }
  function positionMap(){
    const idx2 = {}; MAP.nodes.forEach(n=>idx2[n.id]=n);
    $$("#mapnodes .map-node").forEach(g=>{
      const n = idx2[g.dataset.id]; if(!n) return;
      g.setAttribute("transform","translate("+n.x.toFixed(1)+","+n.y.toFixed(1)+")");
    });
    $$("#mapedges .map-edge").forEach(p=>{
      const a = idx2[p.dataset.s], b = idx2[p.dataset.t]; if(!a||!b) return;
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const dx = b.x-a.x, dy = b.y-a.y;
      const cx = mx - dy*0.12, cy = my + dx*0.12;
      p.setAttribute("d","M"+a.x.toFixed(1)+" "+a.y.toFixed(1)+" Q"+cx.toFixed(1)+" "+cy.toFixed(1)+" "+b.x.toFixed(1)+" "+b.y.toFixed(1));
    });
  }
};

function insights(){
  const out = [];
  const r = reviewed();
  const oc = overconfidence();
  const sp = speedSplit();
  const stats = areaStats();
  const ag = againStats();

  if(r.length>=3 && oc!=null){
    out.push({
      fig: (oc>0?"+":"")+oc, unit:"pts", figcap:"average gap between confidence claimed and outcome",
      title: oc>6 ? "You are consistently more certain than you turn out to be right"
           : oc<-6 ? "You under-claim. Your outcomes beat your predictions"
           : "Your confidence is close to honest",
      body: oc>6
        ? "Across "+r.length+" reviewed decisions you claimed an average of "+Math.round(avg(r.map(d=>d.final.confidence||50)))+"% confidence and the outcomes scored "+Math.round(avg(r.map(d=>d.review.accuracy)))+"%. The largest gap was “"+shorten(worstCalibrated().title,44)+"”, where you were "+Math.abs((worstCalibrated().final.confidence||50)-worstCalibrated().review.accuracy)+" points out. A working correction: when you feel 80% sure, write 65% and see whether the decision still holds."
        : oc<-6
        ? "You claimed an average of "+Math.round(avg(r.map(d=>d.final.confidence||50)))+"% and outcomes scored "+Math.round(avg(r.map(d=>d.review.accuracy)))+"%. Under-confidence is cheaper than the reverse, but it has a cost of its own: it makes you slower on decisions you were always going to get right."
        : "Claimed "+Math.round(avg(r.map(d=>d.final.confidence||50)))+"%, delivered "+Math.round(avg(r.map(d=>d.review.accuracy)))+"%. That is unusually well calibrated, and it is the single best evidence that this practice is working.",
      links:[["See the calibration chart","#/reflections"]]
    });
  }
  if(sp.fast.n && sp.slow.n){
    const diff = sp.slow.score - sp.fast.score;
    out.push({
      fig: (diff>0?"+":"")+diff, unit:"pts", figcap:"satisfaction difference, slow decisions over fast ones",
      title: diff>8 ? "The decisions you sat with turned out better"
           : diff<-8 ? "Your quick decisions have outperformed your slow ones"
           : "Speed has not decided your outcomes",
      body: diff>8
        ? "Decisions you deliberated for more than a month score "+sp.slow.score+" out of 100 on satisfaction. Those decided within a month score "+sp.fast.score+". The sample is small ("+sp.slow.n+" and "+sp.fast.n+"), but it points the same way your reviews do: rushing has cost you more than waiting has."
        : diff<-8
        ? "Decisions made within a month score "+sp.fast.score+"; those you deliberated longer score "+sp.slow.score+". Worth asking whether the slow ones were slow because they were hard, or hard because they were slow. Deliberation past a point is often avoidance wearing a serious expression."
        : "Fast decisions average "+sp.fast.score+" and slow ones "+sp.slow.score+". On this evidence, how long you take matters far less than whether you wrote down why.",
      links:[["Open the timeline","#/timeline"]]
    });
  }
  const hard = sortBy(stats.filter(a=>a.avgDelib!=null && a.total>=2), a=>-a.avgDelib, 1)[0];
  if(hard){
    out.push({
      fig: hard.avgDelib, unit:"days", figcap:"average deliberation in "+hard.name.toLowerCase(),
      title: hard.name+" produces your hardest decisions",
      body: hard.name+" decisions take an average of "+hard.avgDelib+" days from opening to committing, against "+
        Math.round(avg(stats.filter(a=>a.avgDelib!=null).map(a=>a.avgDelib)))+" days across everything else, and you consider "+hard.avgOptions+" options per decision there. "+
        (hard.satisfaction!=null? "They also turn out well — satisfaction averages "+hard.satisfaction+" out of 5 — which suggests the slowness is doing something." : "Not enough of them have been reviewed to say whether the slowness pays."),
      links:[["See "+hard.name.toLowerCase()+" decisions","#/decisions"]]
    });
  }
  if(ag.total>=3){
    const wouldRepeat = ag.yes + ag["yes-sooner"];
    out.push({
      fig: Math.round(wouldRepeat/ag.total*100), unit:"%", figcap:"of reviewed decisions you would make again",
      title: ag["yes-sooner"]>=2 ? "Your most common regret is lateness, not direction"
            : ag.no>=2 ? "A pattern of decisions you would reverse" : "You largely stand by your choices",
      body: ag["yes-sooner"]>=2
        ? "Of "+ag.total+" reviewed decisions, "+ag["yes-sooner"]+" are marked “yes, and sooner” and only "+ag.no+" are marked “no”. You are not choosing wrongly. You are choosing late — and the cost of lateness does not show up as a bad outcome, which is exactly why it keeps happening."
        : ag.no>=2
        ? ag.no+" of "+ag.total+" reviewed decisions you would not repeat. Read those three reviews together: "+r.filter(d=>d.review.again==="no").map(d=>"“"+shorten(d.title,30)+"”").join(", ")+". They tend to share a shape."
        : wouldRepeat+" of "+ag.total+" reviewed decisions would be made again. The value of the record is not the score; it is that you can check rather than assume.",
      links:[["Practise on an old one","#/playback"]]
    });
  }
  const frag = store.state.decisions.filter(isOpen).flatMap(d=>d.assumptions.filter(a=>a.confidence<=50).map(a=>({d,a})));
  if(frag.length){
    out.push({
      fig: frag.length, unit:"", figcap:"fragile assumptions holding up open decisions",
      title:"Your open decisions rest on assumptions you do not believe",
      body: frag.slice(0,2).map(x=>"In “"+shorten(x.d.title,38)+"” you have written “"+shorten(x.a.text,74)+"” at "+x.a.confidence+"% belief.").join(" ")+
        " An assumption below fifty percent is not an assumption, it is an open question — and questions can be answered before the decision rather than after it.",
      links: frag.slice(0,1).map(x=>["Open “"+shorten(x.d.title,26)+"”","#/d/"+x.d.id])
    });
  }
  const emo = r.filter(d=>d.emotionNow).map(d=>({ e:d.emotionNow.toLowerCase(), s:d.review.satisfaction||3 }));
  const lowEnergy = emo.filter(x=>/exhaust|hollow|angry|panic|trapped|pressur|desperate|guilt|asham/.test(x.e));
  if(lowEnergy.length>=2){
    const others = emo.filter(x=>lowEnergy.indexOf(x)<0);
    out.push({
      fig: avg(lowEnergy.map(x=>x.s)).toFixed(1), unit:"/5", figcap:"satisfaction when you started depleted",
      title:"Decisions begun in a depleted state score lower",
      body:"When you opened a decision feeling exhausted, trapped, pressured or ashamed, the outcome averaged "+avg(lowEnergy.map(x=>x.s)).toFixed(1)+" out of 5. Everything else averages "+
        (others.length?avg(others.map(x=>x.s)).toFixed(1):"—")+". The state you are in when you start writing shapes the decision more than any single fact you write down. It is also the one variable you can change for free, by waiting a week.",
      links:[["Read the principle","#/wisdom"]]
    });
  }
  const va = valuesAdherence();
  if(va.total){
    out.push({
      fig: Math.round(va.tracked/va.total*100), unit:"%", figcap:"of committed decisions were checked against your values",
      title: va.tracked/va.total>0.7 ? "You mostly decide against a stated standard" : "Half your decisions never met your own values",
      body:(va.tracked)+" of "+va.total+" committed decisions have values attached. "+
        (va.satisfaction!=null? "Those that do average "+va.satisfaction+" out of 5 on satisfaction. " : "")+
        "The value of naming a value is not moral, it is practical: it gives future-you a fixed point to measure against, instead of a memory that has quietly rewritten itself.",
      links:[["Edit your values","#/settings"]]
    });
  }
  return out;
}

  return sortBy(reviewed(), d=>-Math.abs((d.final.confidence||50)-d.review.accuracy), 1)[0];
}

/* ============================================================
   ORACLE / interaction — actions, editing, palette, keyboard
   ============================================================ */

function currentDecision(el){
  const host = el && el.closest ? el.closest("[data-did]") : null;
  return store.decision(host ? host.dataset.did : CURRENT.id);
}
function flagSaved(){
  const f = $("#saveflag"); if(!f) return;
  f.classList.add("on");
  clearTimeout(flagSaved._t);
  flagSaved._t = setTimeout(()=>f.classList.remove("on"), 1400);
}
const softRail = debounce(function(){
  if(CURRENT.name!=="detail") return;
  const active = document.activeElement;
  if(active && active.closest && active.closest(".dossier-rail")) return;
  const d = store.decision(CURRENT.id); if(!d) return;
  const rail = $(".dossier-rail"); if(rail) rail.innerHTML = dossierRail(d, clarity(d));
  $$(".tsec").forEach(el=>{
    const s = SECTIONS.find(x=>"s-"+x.id===el.id);
    if(s) el.classList.toggle("filled", s.filled(d));
  });
  /* the commit gate has to answer to what was just written, not to the last page load */
  const bar = $(".commitbar");
  if(bar && isOpen(d)) bar.outerHTML = commitBar(d);
}, 700);

/* ---------------------------------------------------------- editing */
document.addEventListener("input", function(e){
  const el = e.target;

  if(el.matches("textarea")) autosize(el);

  if(el.dataset.bind!=null){
    const d = currentDecision(el); if(!d) return;
    let v = el.value;
    if(el.dataset.bind==="deadline" && !v) v = null;
    setPath(d, el.dataset.bind, v);
    d._hay = null;
    store.save(); flagSaved(); softRail();
    if(el.dataset.bind==="title"){ const cn=$(".crumb-now"); if(cn) cn.textContent = v; }
    return;
  }
  if(el.dataset.slide!=null){
    const path = el.dataset.slide;
    const out = $('[data-slide-out="'+path+'"]');
    if(out) out.textContent = el.value + (out.dataset.suffix||"");
    if(path==="__pbconf"){ PB.conf = +el.value; return; }
    const d = currentDecision(el); if(!d) return;
    setPath(d, path, +el.value);
    store.save(); flagSaved(); softRail();
    return;
  }
  if(el.dataset.score!=null){
    const [i,cid] = el.dataset.score.split(":");
    const d = currentDecision(el); if(!d) return;
    const v = el.value===""?null:clamp(+el.value,0,10);
    if(v==null) delete d.options[i].scores[cid]; else d.options[i].scores[cid]=v;
    store.save(); flagSaved(); refreshMatrix(d);
    return;
  }
  if(el.dataset.weight!=null){
    const d = currentDecision(el); if(!d) return;
    const c = byId(d.criteria, el.dataset.weight); if(!c) return;
    c.weight = clamp(+el.value||0, 0, 5);
    store.save(); flagSaved(); refreshMatrix(d);
    return;
  }
  if(el.dataset.val!=null){
    const [i,f] = el.dataset.val.split(":");
    store.state.values[i][f] = el.value; store.save(); return;
  }
  if(el.dataset.chap!=null){
    const [i,f] = el.dataset.chap.split(":");
    store.state.chapters[i][f] = el.value || (f==="to"?null:""); store.save(); return;
  }
  if(el.id==="pbnote"){ PB.note = el.value; return; }
  if(el.dataset.act==="wisdom-q"){ wisdomSearch(el.value); return; }
});
function refreshMatrix(d){
  $$("table.matrix tr.total td strong").forEach((cell,i)=>{
    if(i===0) return;
    const o = d.options[i-1]; if(o) cell.textContent = optionScore(d,o).toFixed(1);
  });
  $$(".opt").forEach((el,i)=>{
    const o = d.options[i]; if(!o) return;
    const n = el.querySelector(".opt-head .num"); if(n) n.textContent = optionScore(d,o).toFixed(1);
  });
}
const wisdomSearch = debounce(function(v){
  WISDOM_Q = v; render();
  const el = $('[data-act="wisdom-q"]');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}, 260);

document.addEventListener("change", function(e){
  const el = e.target;
  if(el.dataset.act==="filter-sel"){ FILTERS[el.dataset.k] = el.value; render(); }
});

document.addEventListener("submit", function(e){
  const form = e.target.closest('[data-act="capture-form"]');
  if(!form) return;
  e.preventDefault();
  const title = form.querySelector('[name="title"]').value.trim();
  if(!title){ toast("Give it a name first"); return; }
  createDecision({ title, area:form.querySelector('[name="area"]').value });
});

/* ---------------------------------------------------------- creation */
function createDecision(o){
  const d = mkDecision(Object.assign({
    id: uid("d"), createdAt: todayISO(), status:"exploring"
  }, o));
  store.add(d);
  toast("Opened. Take your time with it.", "check");
  go("#/d/"+d.id);
  return d;
}

/* --- field setters ------------------------------------------- */
ACT.set = (el)=>{
  const path = el.dataset.path, v = el.dataset.v;
  if(path==="__theme"){ store.state.prefs.theme = v; store.save(); applyTheme(); render(); return; }
  const d = currentDecision(el); if(!d) return;
  setPath(d, path, v);
  store.save(); flagSaved();
  if(path==="status" || path==="think.reversibility" || path==="impact") render(); else softRail();
  if(path.indexOf("review.")===0) render();
};
ACT.choose = (el)=>{
  const d = currentDecision(el); if(!d) return;
  d.chosen = +el.dataset.v;
  if(!len(d.final.text)) d.final.text = d.options[d.chosen].label;
  store.save(); render();
};

/* --- options -------------------------------------------------- */
ACT["opt-add"] = (el)=>{
  const d = currentDecision(el); if(!d) return;
  d.options.push({ id:uid("o"), label:"", note:"", pros:[], cons:[], scores:{} });
  store.save(); render();
  setTimeout(()=>{ const inputs=$$(".opt-name"); if(inputs.length) inputs[inputs.length-1].focus(); },80);
};
ACT["opt-del"] = (el)=>{
  const d = currentDecision(el); if(!d) return;
  const i = +el.dataset.v;
  d.options.splice(i,1);
  if(d.chosen===i) d.chosen=null; else if(d.chosen>i) d.chosen--;
  store.save(); render();
};
ACT["pc-add"] = (el)=>{
  const [i,kind] = el.dataset.v.split(":");
  const d = currentDecision(el); if(!d) return;
  promptSheet(kind==="pros"?"What speaks for this option?":"What speaks against it?", "", v=>{
    if(!v) return;
    d.options[i][kind].push(v); store.save(); render();
  });
};
ACT["pc-del"] = (el)=>{
  const [i,kind,j] = el.dataset.v.split(":");
  const d = currentDecision(el); if(!d) return;
  d.options[i][kind].splice(j,1); store.save(); render();
};

ACT["assum-add"] = (el)=>{
  const d = currentDecision(el); if(!d) return;

ACT["unk-add"] = (el)=>{
  const d = currentDecision(el); if(!d) return;

};

ACT["unk-toggle"] = (el)=>{
  const d = currentDecision(el); const u = d.unknowns[+el.dataset.v];

ACT["ev-add"] = (el)=>{

    '<div class="sheet-head center">'+
      '<span class="eyebrow">Before you commit</span>'+
      '<h2 class="h1" style="font-size:1.5rem;margin-top:10px">Three questions, slowly</h2>'+
    '</div>'+
    '<div class="stack gap-20">'+
      ritualQ("1","How will you feel about this in ten minutes, ten months, and ten years?",
        "If the ten-minute answer is the strongest one, that is worth noticing.")+
      ritualQ("2","Are you deciding this while depleted?",
        d.emotionNow ? "You recorded feeling “"+esc(d.emotionNow)+"” when you opened this." : "You did not record how you felt when you opened this.")+
      ritualQ("3", vals.length ? "Does this honour "+vals.map(v=>"<em>"+esc(v.name)+"</em>").join(", ")+"?" : "Does this move you toward who you are trying to become?",
        "The values you attached are the standard you set yourself, not a mood.")+
    '</div>'+
    '<div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--line)">'+
      '<span class="eyebrow field-k">When should the outcome be reviewed?</span>'+
      '<div class="row gap-10 wrapf"><input class="inp" type="date" id="unlockdate" style="max-width:180px" value="'+defaultUnlock(d)+'" />'+
        '<span class="meta" style="font-size:var(--t-small)">Based on a horizon of '+esc(d.horizon)+'. It stays sealed until then.</span></div>'+
    '</div>'+
    '<div class="sheet-foot">'+
      '<button class="btn" data-act="close">Not yet</button>'+
      '<button class="btn primary" data-act="commit-confirm" data-id="'+d.id+'">Commit this decision</button>'+
    '</div></div>');
};
function ritualQ(n,q,note){
  return '<div class="row gap-14" style="align-items:flex-start">'+
    '<span class="num" style="color:var(--gold);font-size:var(--t-small);padding-top:3px">'+n+'</span>'+
    '<span><span class="h3" style="display:block;line-height:1.45;margin-bottom:4px">'+q+'</span>'+
    '<span class="meta" style="font-size:var(--t-small)">'+note+'</span></span></div>';
}
ACT["commit-confirm"] = (el)=>{
  const d = store.decision(el.dataset.id); if(!d) return;
  const date = $("#unlockdate").value || defaultUnlock(d);
  d.status = "committed";
  d.final.at = todayISO();
  if(d.final.confidence==null) d.final.confidence = d.confidence;
  d.review.unlockAt = date;
  d.log.push({ at:todayISO(), event:"committed" });
  store.save(); closeLayer(); render();
  toast("Committed. The review opens "+fmtDate(date,"long")+".", "check");
};
ACT.release = (el)=>{
  const d = currentDecision(el);
  confirmSheet("Release this decision?",
    "Releasing means setting it down without choosing. That is a legitimate outcome — but record why, so future you does not mistake it for forgetting.",
    "Release it", ()=>{
      d.status = "released"; d.final.at = todayISO();
      if(!len(d.final.reason)) d.final.reason = "Set down without deciding.";
      store.save(); render(); toast("Released");
    });
};
ACT.amend = (el)=>{
  const d = currentDecision(el);
  AMEND = d.id; render();
  toast("Editing a sealed record. Correct, do not improve.");
};
ACT["amend-done"] = ()=>{ AMEND = null; render(); toast("Sealed again", "check"); };

ACT.uncommit = (el)=>{
  const d = currentDecision(el);
  confirmSheet("Reopen this decision?",
    "The commitment date and the sealed review window will be cleared. Your reasoning stays exactly as written.",
    "Reopen", ()=>{
      d.status = "deliberating"; d.final.at = null; d.review.unlockAt = null;
      store.save(); render(); toast("Reopened");
    });
};

/* --- review ----------------------------------------------------- */
ACT["review-early"] = (el)=>{
  const d = currentDecision(el);
  confirmSheet("Open the review early?",
    "Reviewing before the window rewards luck and punishes patience — the outcome has not finished happening yet. If you have a real reason, go ahead.",
    "Open it anyway", ()=>{
      d.review.unlockAt = todayISO(); store.save(); render();
    });
};
ACT["review-reschedule"] = (el)=>{
  const d = currentDecision(el);
  promptSheet("New review date", d.review.unlockAt, v=>{
    if(!v) return; d.review.unlockAt = v; store.save(); render(); toast("Review rescheduled");
  }, "date");
};
ACT["review-file"] = (el)=>{
  const d = currentDecision(el);
  if(!len(d.review.happened)){ toast("Write what actually happened first"); return; }
  d.review.done = true; d.review.at = todayISO(); d.status = "reviewed";
  if(d.review.accuracy==null) d.review.accuracy = 60;
  if(d.review.satisfaction==null) d.review.satisfaction = 3;
  store.save(); render();
  setTimeout(()=>ACT.distil({ closest:()=>null }), 400);
  toast("Review filed. The lesson is yours now.", "check");
};
ACT["review-edit"] = (el)=>{
  const d = currentDecision(el);
  d.review.done = false; d.status = "committed"; store.save(); render();
};
ACT.distil = (el)=>{
  const d = store.decision(CURRENT.id); if(!d) return;
  const seed = d.review.lessons ? firstSentence(d.review.lessons) : "";
  openLayer('<div class="sheet"><div class="sheet-head">'+
    '<span class="eyebrow">'+ic("quote","",12)+' Wisdom library</span>'+
    '<h2 class="h1" style="font-size:1.5rem;margin-top:10px">What is the one sentence you want to keep?</h2>'+
    '<p class="meta" style="margin-top:10px;font-size:var(--t-small);line-height:1.6">Not a summary of what happened. A rule you would hand to someone else — short enough to remember when you are tired and about to break it.</p></div>'+
    '<textarea class="inp" id="pText" rows="3" data-autofocus placeholder="Never make an irreversible decision in the first week of anything.">'+esc(seed)+'</textarea>'+
    '<div class="formrow" style="margin-top:14px"><span class="eyebrow field-k">Tags</span>'+
      '<input class="inp" id="pTags" placeholder="money, patience" /></div>'+
    '<div class="sheet-foot"><button class="btn" data-act="close">Not now</button>'+
      '<button class="btn primary" data-act="distil-save" data-id="'+d.id+'">Keep it</button></div></div>');
};
ACT["distil-save"] = (el)=>{
  const d = store.decision(el.dataset.id);
  const text = $("#pText").value.trim();
  if(!text){ closeLayer(); return; }
  const p = { id:uid("p"), text, from:d.id, at:todayISO(),
    tags:$("#pTags").value.split(",").map(s=>s.trim()).filter(Boolean), affirmed:0, favorite:false };
  store.state.principles.unshift(p);
  d.principleId = p.id;
  store.save(); closeLayer(); render();
  toast("Added to the wisdom library", "check");
};
function firstSentence(s){
  const m = String(s||"").match(/^[^.!?]*[.!?]/);
  return m ? m[0].trim() : String(s||"").slice(0,140);
}

/* --- principles -------------------------------------------------- */
ACT.affirm = (el)=>{
  const p = byId(store.state.principles, el.dataset.v);
  p.affirmed = (p.affirmed||0)+1; store.save();
  el.innerHTML = ic("check","",11)+" held "+p.affirmed+"×";
  toast("Held again. That is how a sentence becomes a principle.");
};
ACT.pfav = (el)=>{
  const p = byId(store.state.principles, el.dataset.v);

};
ACT["principle-new"] = ()=>{
  openLayer('<div class="sheet"><div class="sheet-head">'+
    '<span class="eyebrow">Wisdom library</span>'+
    '<h2 class="h1" style="font-size:1.5rem;margin-top:10px">Write a principle</h2>'+
    '<p class="meta" style="margin-top:10px;font-size:var(--t-small)">Most principles come from a reviewed decision. Some arrive on their own, usually in the shower.</p></div>'+
    '<textarea class="inp" id="pText" rows="3" data-autofocus placeholder="Decide reversible things quickly."></textarea>'+

};

  const text = $("#pText").value.trim(); if(!text){ closeLayer(); return; }

ACT["wisdom-tag"] = (el)=>{ WISDOM_Q = (WISDOM_Q===el.dataset.v)?"":el.dataset.v; render(); };

/* --- playback ------------------------------------------------------ */
ACT["pb-next"] = ()=>{ PB.stage="choose"; render(); };
ACT["pb-back"] = ()=>{ PB.stage="brief"; render(); };
ACT["pb-pick"] = (el)=>{ PB.chosen = +el.dataset.v; render(); };
ACT["pb-reveal"] = ()=>{ if(PB.chosen==null) return; PB.stage="reveal"; render(); };
ACT["pb-save"] = (el)=>{

/* --- decision deletion / settings ----------------------------------- */
ACT.delete = (el)=>{
  const d = currentDecision(el);
  confirmSheet("Delete “"+shorten(d.title,44)+"”?",
    "The reasoning goes with it, permanently. If you simply changed your mind about the decision, release it instead — the record is more useful than the tidiness.",
    "Delete permanently", ()=>{ store.remove(d.id); go("#/decisions"); toast("Deleted"); });
};
ACT["val-add"] = ()=>{
  promptSheet("Name the value","", v=>{
    if(!v) return;
    store.state.values.push({ id:uid("v"), name:v, line:"" });
    store.save(); render();
  });
};

  store.state.values.splice(i,1);

  store.save(); render();
};
ACT["chap-add"] = ()=>{
  store.state.chapters.push({ id:uid("ch"), name:"New chapter", from:todayISO(), to:null, note:"" });
  store.save(); render();
};
ACT["chap-del"] = (el)=>{ store.state.chapters.splice(+el.dataset.v,1); store.save(); render(); };

ACT.export = ()=>{
  const blob = new Blob([JSON.stringify(store.state,null,2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "oracle-record-"+todayISO()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported");
};
ACT.import = ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        if(!data.decisions) throw new Error("no decisions");
        store.state = data; store.save(); applyTheme(); render();
        toast("Record imported", "check");
      }catch(e){ toast("That file could not be read as an ORACLE record"); }
    };
    rd.readAsText(f);
  };
  inp.click();
};
ACT.reset = ()=>{
  confirmSheet("Reset everything?",
    "Every decision, principle and playback session in this browser will be replaced by the sample record. This cannot be undone.",
    "Reset", ()=>{ store.state = store.fresh(); store.save(); applyTheme(); go("#/home"); render(); toast("Reset"); });
};

/* --- generic sheets -------------------------------------------------- */
function promptSheet(title, value, cb, type){
  openLayer('<div class="sheet"><div class="sheet-head"><h2 class="h2">'+esc(title)+'</h2></div>'+
    (type==="date"
      ? '<input class="inp" id="promptv" type="date" data-autofocus value="'+esc(value||"")+'" />'
      : '<textarea class="inp" id="promptv" rows="2" data-autofocus>'+esc(value||"")+'</textarea>')+
    '<div class="sheet-foot"><button class="btn" data-act="close">Cancel</button>'+
    '<button class="btn primary" data-act="prompt-ok">Save</button></div></div>');
  _promptCb = cb;
}
let _promptCb = null;
ACT["prompt-ok"] = ()=>{
  const v = $("#promptv").value.trim();
  const cb = _promptCb; _promptCb = null; closeLayer(); if(cb) cb(v);
};
function confirmSheet(title, body, okLabel, cb){
  openLayer('<div class="sheet"><div class="sheet-head"><h2 class="h1" style="font-size:1.4rem">'+esc(title)+'</h2>'+
    '<p class="prose" style="margin-top:12px;font-size:1rem">'+esc(body)+'</p></div>'+
    '<div class="sheet-foot"><button class="btn" data-act="close" data-autofocus>Cancel</button>'+
    '<button class="btn danger" data-act="confirm-ok">'+esc(okLabel)+'</button></div></div>');

let _confirmCb = null;
ACT["confirm-ok"] = ()=>{ const cb=_confirmCb; _confirmCb=null; closeLayer(); if(cb) cb(); };
ACT.close = ()=> closeLayer();

/* --- quick capture ----------------------------------------------------- */

    '<div class="formrow"><span class="eyebrow field-k">The decision</span>'+
      '<textarea class="inp" id="qTitle" rows="2" data-autofocus placeholder="Take the offer in Lisbon, or stay and finish what I started"></textarea></div>'+
    '<div class="formrow"><span class="eyebrow field-k">Why is it hard?</span>'+

    '<div class="row gap-16 wrapf">'+
      '<div><span class="eyebrow field-k">Life area</span>'+areaSelect("qArea", store.state.areas[0].id)+'</div>'+
      '<div><span class="eyebrow field-k">Deadline (optional)</span>'+
        '<input class="inp" id="qDeadline" type="date" style="width:170px;height:28px;font-size:var(--t-small)" /></div>'+

        '<span class="num" id="qImpOut" style="font-size:var(--t-small)">5</span></div></div>'+
    '</div>'+
    '<div class="sheet-foot"><button class="btn" data-act="close">Cancel</button>'+

/* --- command palette ------------------------------------------------- */
let PAL = { items:[], sel:0 };
ACT.palette = ()=> openPalette();
function paletteItems(q){
  q = (q||"").toLowerCase().trim();
  const out = [];
  const push = (group,label,hint,icon,run)=>out.push({ group,label,hint,icon,run });
  if(!q){
    NAV.forEach(g=>g.items.forEach(it=> push("Go to", it.label, "", it.icon, ()=>go(it.hash))));
    push("Do","New decision","N","plus",()=>ACT.quick());
    push("Do","Start a playback session","","replay",()=>go("#/playback"));
    push("Do","Switch theme","","moon",()=>toggleTheme());
    sortBy(store.state.decisions.filter(isOpen), urgencyScore, -1).slice(0,5)
      .forEach(d=> push("Open decisions", d.title, area(d.area).name, "layers", ()=>go("#/d/"+d.id)));
    return out;
  }
  NAV.forEach(g=>g.items.forEach(it=>{
    if(it.label.toLowerCase().indexOf(q)>=0) push("Go to", it.label, "", it.icon, ()=>go(it.hash));
  }));
  const r = searchAll(q);
  r.decisions.slice(0,8).forEach(x=> push("Decisions", x.d.title, area(x.d.area).name+" · "+STATUS[x.d.status].label, "layers", ()=>go("#/d/"+x.d.id)));
  r.principles.slice(0,4).forEach(p=> push("Principles", shorten(p.text,70), "wisdom library", "quote", ()=>go("#/wisdom")));
  if(r.total>10) push("Search", 'See all results for “'+q+'”', String(r.total), "search", ()=>go("#/search?q="+encodeURIComponent(q)));
  if(!out.length) push("Create", 'Open a decision called “'+q+'”', "", "plus", ()=>createDecision({ title:q }));
  return out;
}
function openPalette(){
  PAL.sel = 0;
  openLayer('<div class="palette">'+
    '<div class="palette-in">'+ic("search","",16)+
      '<input id="palq" data-autofocus placeholder="Search decisions, reasoning, principles…" autocomplete="off" />'+
      '<span class="kbd">esc</span></div>'+
    '<div class="palette-res" id="palres"></div>'+
    '<div class="palette-foot"><span class="meta" style="font-size:var(--t-micro)"><span class="kbd">↑↓</span> move</span>'+
      '<span class="meta" style="font-size:var(--t-micro)"><span class="kbd">↵</span> open</span>'+
      '<span class="meta" style="font-size:var(--t-micro)"><span class="kbd">⌘K</span> anywhere</span></div>'+
  '</div>');
  const inp = $("#palq");
  const draw = ()=>{
    PAL.items = paletteItems(inp.value);
    PAL.sel = clamp(PAL.sel, 0, Math.max(0,PAL.items.length-1));
    let html = "", lastGroup = null;
    PAL.items.forEach((it,i)=>{
      if(it.group!==lastGroup){ lastGroup = it.group; html += '<div class="pgroup eyebrow">'+esc(it.group)+'</div>'; }
      html += '<button class="pres'+(i===PAL.sel?" on":"")+'" data-pi="'+i+'">'+ic(it.icon,"",15)+
        '<span class="t trunc">'+esc(it.label)+'</span>'+(it.hint?'<span class="hint">'+esc(it.hint)+'</span>':"")+'</button>';
    });
    $("#palres").innerHTML = html || '<div class="pgroup meta">Nothing found.</div>';
  };
  draw();
  inp.addEventListener("input", ()=>{ PAL.sel=0; draw(); });
  inp.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); PAL.sel=Math.min(PAL.sel+1,PAL.items.length-1); draw(); scrollSel(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); PAL.sel=Math.max(PAL.sel-1,0); draw(); scrollSel(); }
    else if(e.key==="Enter"){ e.preventDefault(); runSel(); }
  });
  $("#palres").addEventListener("click", e=>{
    const b = e.target.closest("[data-pi]"); if(!b) return;
    PAL.sel = +b.dataset.pi; runSel();
  });
  function runSel(){ const it = PAL.items[PAL.sel]; if(!it) return; closeLayer(); it.run(); }
  function scrollSel(){ const el = $("#palres .pres.on"); if(el) el.scrollIntoView({ block:"nearest" }); }
}

/* ---------------------------------------------------------- delegation */
document.addEventListener("click", function(e){
  const scroller = e.target.closest("[data-scroll]");
  if(scroller){
    e.preventDefault();
    const t = document.getElementById(scroller.dataset.scroll);
    if(t) t.scrollIntoView({ behavior:"smooth", block:"start" });
    return;
  }
  const btn = e.target.closest("[data-act]");
  if(btn && ACT[btn.dataset.act]){
    if(btn.tagName!=="INPUT" && btn.tagName!=="SELECT" && btn.tagName!=="TEXTAREA"){
      e.preventDefault();
      ACT[btn.dataset.act](btn, e);
      return;
    }
  }
  const nav = e.target.closest("[data-nav]");
  if(nav){
    const r = $("#rail"); if(r && r.classList.contains("open")) ACT.rail();
    if(nav.getAttribute("href").indexOf("#/playback/")===0){ PB.stage="brief"; PB.chosen=null; PB.note=""; PB.conf=60; }
  }
});

/* ---------------------------------------------------------- keyboard */
let gKey = false;
document.addEventListener("keydown", function(e){
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;

  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); return; }
  if(e.key==="Escape"){
    if(_closeLayer){ closeLayer(); return; }
    const r = $("#rail"); if(r && r.classList.contains("open")) ACT.rail();
    if(typing) e.target.blur();
    return;
  }
  if(typing) return;

  if(e.key==="/"){ e.preventDefault(); openPalette(); return; }
  if(e.key.toLowerCase()==="n"){ e.preventDefault(); ACT.quick(); return; }
  if(e.key.toLowerCase()==="g"){ gKey = true; setTimeout(()=>gKey=false, 900); return; }
  if(gKey){
    const map = { h:"#/home", d:"#/decisions", m:"#/map", t:"#/timeline", r:"#/reflections",
                  w:"#/wisdom", p:"#/playback", f:"#/favorites", s:"#/settings", a:"#/areas" };
    const to = map[e.key.toLowerCase()];
    if(to){ e.preventDefault(); gKey=false; go(to); }
    return;
  }
  if(CURRENT.name==="detail" && e.key.toLowerCase()==="e"){
    const first = $(".tsec .ta"); if(first){ e.preventDefault(); first.focus(); }
  }
});

/* ---------------------------------------------------------- boot */
window.addEventListener("hashchange", render);
window.addEventListener("resize", debounce(()=>{ if(CURRENT.name==="map") VIEW_AFTER.map(CURRENT); }, 400));

(function boot(){
  store.boot();
  applyTheme();
  if(window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener?mq.addEventListener.bind(mq,"change"):mq.addListener.bind(mq))(()=>{
      if(store.state.prefs.theme==="auto") renderRail();
    });
  }
  if(!location.hash) location.replace("#/home");
  render();
})();
</script>
